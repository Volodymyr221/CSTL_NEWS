<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Макети шрифту заголовка модалки</title>

<!-- Справжній style.css — той самий каскад, що в застосунку. -->
<link rel="stylesheet" href="../../../style.css">

<style>
  html, body { margin: 0; height: 100%; background: #6E6A66; }
  .mk { position: relative; min-height: 100vh; }

  /* Аркуш відтворює РЕАЛЬНУ модалку вибору населеного пункту — ту саму, знімок
     якої прислав Вова. Порівнюємо шрифт на живому вмісті, а не на «Заголовок». */
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: var(--modal-bg, #fff);
    border-radius: 22px 22px 0 0;
    padding: 4px 20px 20px;
    max-height: 92%;
    overflow: hidden;
  }
  .grab { width: 40px; height: 4px; border-radius: 2px; background: rgba(0,0,0,.18); margin: 10px auto 6px; }

  /* ── А — Georgia (як зараз) ─────────────────────────────────────────────── */
  .mk--a .app-modal-title { font-family: Georgia, serif; font-size: 20px; font-weight: 700; }

  /* ── Б — системний sans, як решта інтерфейсу ───────────────────────────────
     Той самий шрифт, яким набрано весь застосунок. Заголовок відрізняється не
     ГАРНІТУРОЮ, а вагою і кеглем — так роблять iOS і Android у своїх аркушах. */
  .mk--b .app-modal-title {
    font-family: -apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', sans-serif;
    font-size: 20px; font-weight: 700; letter-spacing: -.02em;
  }

  /* ── В — системний sans, великий і щільний ─────────────────────────────────
     Те саме сімейство, але заголовок звучить гучніше: 23px/800. Патерн великих
     заголовків аркушів у Apple Music та Файлах. */
  .mk--c .app-modal-title {
    font-family: -apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', sans-serif;
    font-size: 23px; font-weight: 800; letter-spacing: -.03em;
  }

  /* ── Г — тихий капс ────────────────────────────────────────────────────────
     Заголовок стає підписом розділу, а не назвою екрана: та сама роль, що
     `.hm-kicker` на головній. Головним у вікні лишається СПИСОК, а не шапка. */
  .mk--d .app-modal-title {
    font-family: -apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', sans-serif;
    font-size: 12px; font-weight: 800; letter-spacing: .11em; text-transform: uppercase;
    color: var(--hm-quiet, #6E727A);
  }

  .mk-tag {
    position: absolute; left: 0; right: 0; top: 0; z-index: 5;
    font: 700 11px/1 system-ui, sans-serif; letter-spacing: .14em; text-transform: uppercase;
    color: #fff; text-align: center; padding: 10px 0; background: rgba(0,0,0,.4);
  }
</style>
</head>
<body>
<div class="mk" id="mk">
  <div class="mk-tag" id="tag"></div>
  <div class="sheet">
    <div class="grab"></div>
    <h3 class="app-modal-title">Населений пункт</h3>
    <div class="wxp">
      <button class="wxp-row wxp-row--on" type="button">
        <span class="wxp-row-n">За моїм місцем</span>
        <span class="wxp-row-ok">✓</span>
      </button>
      <div class="wxp-grp">Олицька громада</div>
      <button class="wxp-row" type="button"><span class="wxp-row-n">Олика</span></button>
      <button class="wxp-row" type="button"><span class="wxp-row-n">Горянівка</span></button>
      <button class="wxp-row" type="button"><span class="wxp-row-n">Дерно</span></button>
      <button class="wxp-row" type="button"><span class="wxp-row-n">Жорнище</span></button>
      <p class="wxp-note">Села громади лежать близько одне до одного, тож прогноз для них здебільшого однаковий.</p>
    </div>
  </div>
</div>
<script>
  const v = (new URLSearchParams(location.search).get('v') || 'a').toLowerCase();
  document.getElementById('mk').classList.add('mk--' + v);
  document.getElementById('tag').textContent =
    ({ a: 'А — Georgia (як зараз)', b: 'Б — системний sans 20/700',
       c: 'В — системний sans 23/800', d: 'Г — тихий капс' })[v] || v;
</script>
</body>
</html>
