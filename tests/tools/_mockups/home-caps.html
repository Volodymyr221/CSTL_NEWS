<!doctype html>
<meta charset="utf-8">
<title>Громада — капсули-статуси, варіанти</title>
<!--
  МАКЕТ. Три компонування «розумних капсул» (замовлення Вови 04.08).
  Спільне у всіх трьох: скло поверх фото, великий радіус, циклічна зміна рядка.
  Різниця — ЯК вони розкладені і скільки місця забирають.

  🔴 ЧИСЛА ТУТ СПРАВЖНІ ЗА ПРИРОДОЮ: усе, що показано, ми вміємо порахувати
  (новини з articles.json, рейси зі schedule.json, оголошення й обговорення з
  Supabase). Того, чого немає — «N переглядають зараз», «46 онлайн» — у макеті
  свідомо НЕМА: на головній сторінці громади вигадане число це брехня людям.

  Варіант: ?v=a|b|c
-->
<style>
  :root{
    --brand-grad: radial-gradient(130% 100% at 26% 0%, rgba(150,32,50,.26) 0%, rgba(150,32,50,0) 60%),
                  linear-gradient(162deg,#5E1723 0%,#4A121C 48%,#2E0C14 100%);
    --red:#722F37; --board-card:#FFF; --board-line:#C4C4C1; --ink:#2A2520; --quiet:#6E727A;
    --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
  body{width:390px;height:844px;overflow:hidden;
       font:400 15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;color:#fff}
  .bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:#1A0A0E}
  .bg img{width:100%;height:100%;object-fit:cover;filter:blur(2px) saturate(.88);transform:scale(1.06)}
  .bg::after{content:'';position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(24,10,14,.58) 0%,rgba(24,10,14,.74) 46%,rgba(20,8,12,.88) 100%)}
  .top{height:56px;background:rgba(236,238,241,.94);display:flex;align-items:center;justify-content:center;gap:8px}
  .top b{font:800 15px/1 system-ui;letter-spacing:.14em;color:var(--red)}
  .top span{font:500 10px/1 system-ui;color:#A9A399}
  .hdr{background:var(--brand-grad);border-radius:0 0 22px 22px;padding:var(--s6) var(--s5) var(--s5);margin:0 0 0}
  .date{font:600 12px/1 system-ui;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.62)}
  .hi{font:700 25px/1.14 system-ui;letter-spacing:-.02em;margin-top:var(--s2)}
  .wx{display:flex;align-items:center;gap:var(--s3);margin-top:var(--s4);padding-top:var(--s4);border-top:1px solid rgba(255,255,255,.15)}
  .wx b{font:300 34px/1 system-ui;letter-spacing:-.03em}
  .wx i{font-style:normal;font:400 13.5px/1.25 system-ui}
  .wx u{display:block;text-decoration:none;font:400 12px/1.3 system-ui;color:rgba(255,255,255,.72);margin-top:2px}

  /* ── СПІЛЬНА КАПСУЛА ─────────────────────────────────────────────────────── */
  .cap{
    -webkit-backdrop-filter:blur(14px) saturate(1.5); backdrop-filter:blur(14px) saturate(1.5);
    background:linear-gradient(180deg,rgba(255,255,255,.17) 0%,rgba(255,255,255,.09) 100%);
    border:1px solid rgba(255,255,255,.24);
    box-shadow:0 6px 20px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.22);
    display:flex;align-items:center;gap:10px;min-width:0;color:#fff;
  }
  .cap .ic{flex:0 0 auto;display:grid;place-items:center}
  .cap .tx{min-width:0;display:flex;flex-direction:column;gap:2px}
  .cap .k{font:700 9.5px/1 system-ui;letter-spacing:.11em;text-transform:uppercase;color:rgba(255,255,255,.66)}
  .cap .v{font:600 13.5px/1.2 system-ui;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dots{display:flex;gap:3px;margin-top:5px}
  .dots i{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.3)}
  .dots i.on{background:rgba(255,255,255,.85);width:10px;border-radius:2px}

  /* А — сітка 2×2, великі плитки */
  .a-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:var(--s4) var(--s5) 0}
  .a-grid .cap{border-radius:18px;padding:13px 14px;min-height:66px}
  .a-grid .ic{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.16);font-size:15px}

  /* Б — горизонтальний ряд 2 широких, під ними ще 2 */
  .b-rows{display:flex;flex-direction:column;gap:8px;padding:var(--s4) var(--s5) 0}
  .b-rows .cap{border-radius:999px;padding:11px 16px;min-height:56px}
  .b-rows .ic{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.16);font-size:16px}
  .b-rows .v{font-size:14px}

  /* В — одна широка капсула-табло, що прокручує ВСІ розділи по черзі */
  .c-wrap{padding:var(--s4) var(--s5) 0}
  .c-wrap .cap{border-radius:22px;padding:16px 18px;min-height:84px;gap:14px}
  .c-wrap .ic{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.16);font-size:21px}
  .c-wrap .k{font-size:10px}
  .c-wrap .v{font:600 16px/1.25 system-ui}
  .c-rail{display:flex;gap:6px;margin-top:10px;padding:0 4px}
  .c-rail i{height:3px;flex:1;border-radius:2px;background:rgba(255,255,255,.22)}
  .c-rail i.on{background:rgba(255,255,255,.8)}

  .note{padding:var(--s6) var(--s5) 0;font:700 12px/1 system-ui;letter-spacing:.1em;
        text-transform:uppercase;color:rgba(255,255,255,.74);text-shadow:0 1px 3px rgba(0,0,0,.55)}
  .card{margin:var(--s3) var(--s5) 0;background:var(--board-card);border:1px solid var(--board-line);
        border-radius:14px;padding:var(--s3);display:flex;gap:var(--s3);color:var(--ink)}
  .card .ph{width:64px;height:64px;border-radius:10px;background:#DFDCD7;display:grid;place-items:center;font-size:20px;flex:0 0 auto}
  .card .bd{min-width:0}
  .card .g{font:700 10px/1 system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--red)}
  .card h3{font:600 14px/1.3 system-ui;margin-top:5px}
  .tag{position:fixed;left:0;top:0;background:#111;color:#fff;font:700 11px/1 system-ui;padding:5px 9px;border-radius:0 0 8px 0;z-index:9}
</style>

<div class="bg"><img src="../../../photos/olyka-bg.jpg" alt=""></div>
<div class="top"><b>CSTL LIFE</b><span>v771 · 04.08 13:40</span></div>
<header class="hdr">
  <div class="date">вівторок · 4 серпня</div>
  <div class="hi">Добридень, Володимир</div>
  <div class="wx"><b>33°</b><span><i>Хмарно</i><u>Олика · відчувається 36°</u></span></div>
</header>
<div id="caps"></div>
<div class="note">У стрічці громади</div>
<div class="card"><span class="ph">🏰</span><span class="bd"><span class="g">Олицька міська рада</span><h3>«Чому для отримання однієї послуги потрібно стільки документів?»</h3></span></div>

<script>
const V=(new URLSearchParams(location.search).get('v')||'a').toLowerCase();
// Набори повідомлень — те, що ми ВМІЄМО порахувати.
const D={
  board:{ic:'📋',k:'Дошка',msgs:['19 оголошень','3 нових сьогодні','Продам · 8']},
  bus:{ic:'🚌',k:'Автобуси',msgs:['25 рейсів сьогодні','Олика → Луцьк · 11 хв','2 зараз у дорозі']},
  news:{ic:'📰',k:'Новини',msgs:['400 публікацій','99 за добу','Громада · 4 нові']},
  disc:{ic:'💬',k:'Обговорення',msgs:['18 тем','5 нових відповідей','2 активні сьогодні']},
};
const cap=(d,i)=>`<div class="cap"><span class="ic">${d.ic}</span><span class="tx"><span class="k">${d.k}</span><span class="v">${d.msgs[i%d.msgs.length]}</span><span class="dots">${d.msgs.map((_,j)=>`<i class="${j===i%d.msgs.length?'on':''}"></i>`).join('')}</span></span></div>`;
const H={
  a:()=>`<div class="a-grid">${[D.board,D.bus,D.news,D.disc].map((d,i)=>cap(d,i)).join('')}</div>`,
  b:()=>`<div class="b-rows">${[D.board,D.bus,D.news].map((d,i)=>cap(d,i)).join('')}</div>`,
  c:()=>`<div class="c-wrap"><div class="cap"><span class="ic">🚌</span><span class="tx"><span class="k">Автобуси</span><span class="v">Олика → Луцьк · через 11 хв</span></span></div><div class="c-rail"><i></i><i class="on"></i><i></i><i></i></div></div>`,
};
document.getElementById('caps').innerHTML=(H[V]||H.a)();
document.body.insertAdjacentHTML('beforeend',`<div class="tag">ВАРІАНТ ${V.toUpperCase()}</div>`);
</script>
