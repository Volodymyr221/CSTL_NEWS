    ${hourRows(зріз.by_hour)}

    <div class="section-title" style="margin-top:22px">🏘 Хто заходив — по селах (${п})</div>
    ${tapRows('settlement', рядкиСіл)}
    <p style="font-size:11.5px;color:#999;margin-top:6px">Число — <b>людей</b> із цього
    населеного пункту, які заходили в обраний період. Село береться з анкети профілю.</p>

    ${prof ? `
      <div class="section-title" style="margin-top:24px">👥 Анкети профілів (усього ${prof.total_profiles})</div>
      <p style="font-size:11.5px;color:#999;margin-bottom:8px">🛑 Це <b>не</b> відвідуваність,
      а зріз анкет: де люди живуть і скільки їм років. Хто заходив — у розділі вище.</p>
      <div class="section-title" style="margin-top:14px">Населені пункти (анкети)</div>
      ${barRows(prof.by_settlement)}
      <div class="section-title" style="margin-top:22px">Вік (анкети)</div>
      ${barRows(prof.by_age_bracket)}
      <div class="card" style="border-left:3px solid #b8860b;margin-top:10px">
        <b>Звідки береться вік.</b>
        <p style="font-size:12px;color:#999;margin-top:6px;line-height:1.55">
        🗣️ Питання Вови: «звідки ти береш цю інформацію, через Gmail це береться, чи як?»<br>
        ➡️ <b>Ні.</b> Google при вході віддає лише пошту, імʼя та аватарку — дати народження
        він не дає взагалі. Вік рахується з поля <b>«Дата народження»</b>, яке людина
        <b>сама</b> вписує в Кабінеті. Тому «невідомо» — це не збій, а незаповнена анкета.<br>
        Те саме з населеним пунктом: поле анкети, не геолокація. Місце розташування
        застосунок не питає й не пише.</p>
      </div>
    ` : `<p style="font-size:12px;color:#999;margin-top:12px">Розподіл по селах/віку недоступний — потрібна SQL-міграція scripts/supabase_analytics.sql (RPC admin_profile_stats).</p>`}

    <div class="section-title" style="margin-top:24px">🤖 AI-висновок</div>
    <div class="card" style="margin-bottom:16px">
      <button class="login-btn" id="ai-refresh-btn" style="width:auto;padding:8px 18px">Проаналізувати зміни</button>
      <p style="font-size:12px;color:#999;margin-top:8px" id="ai-refresh-hint">${аіПідпис}</p>
      <div id="ai-refresh-result" style="margin-top:10px;white-space:pre-wrap;font-size:13.5px;line-height:1.55">${аіТекст}</div>
      ${аіІсторія}
    </div>
  `;

  // ── Перемикач періоду ───────────────────────────────────────────────────────
  el.querySelectorAll('.an-period').forEach(b => b.addEventListener('click', () => {
    anPeriod = b.dataset.period;
    renderAnalytics(el);
  }));

  // ── Тап по будь-якому числу → «хто саме» ────────────────────────────────────
  // 🔑 Делегат, а не слухач на кожному рядку: рядки перемальовуються на кожну зміну
  // періоду, і персональні слухачі накопичувались би непоміченими.
  // ⚠️ Прапорець обовʼязковий: `renderAnalytics()` перемальовує себе на кожну зміну
  // періоду, а слухач на самому `el` перемальовку переживає — без нього другий тап
  // відкривав би вікно двічі, третій тричі. Класична пастка делегата на контейнері.
  if (!el.dataset.anBound) {
    el.dataset.anBound = '1';
    el.addEventListener('click', async e => {
    const рядок = e.target.closest('.an-tap');
    if (!рядок) return;
    const scope = рядок.dataset.scope;
    const key = рядок.dataset.key || null;
    const назва = scope === 'all' ? `Хто заходив (${п})`
      : `${(рядок.querySelector('.spend-row-date') || рядок).textContent.trim().split('\n')[0]} — хто саме (${п})`;
    openDetail(назва, '<div class="empty">Завантаження…</div>');
    const дані = await fetchAnalyticsPeople(scope, key);
    openDetail(назва, peopleHtml(дані));
    });
  }

  // ── Тап по збою → усі його випадки поштучно ─────────────────────────────────
  // 🗣️ «якщо є збої, то тап відкриває деталі: який користувач, його email, імʼя, що
  //     сталося, який баг, час».
  el.querySelectorAll('.fail-tap').forEach(рядок => рядок.addEventListener('click', () => {
    const код = рядок.dataset.code || '';
    const текст = рядок.dataset.msg || '';
    const всі = (випадки && випадки.cases) || [];
    const свої = всі.filter(c => (c.code || '') === код && (c.message || '') === текст);
    openDetail(`${код || 'збій'} — ${свої.length} ${свої.length === 1 ? 'випадок' : 'випадків'}`,
      свої.length ? '<div class="spend-log">' + свої.map(c => `
        <div class="spend-row" style="align-items:flex-start;border-left:3px solid var(--red);padding-left:10px">
          <span class="spend-row-meta" style="flex:1">
            <b style="display:block">${escapeHtml(c.who)}</b>
            <span style="display:block;font-size:11.5px;color:#777">${escapeHtml(c.email || (c.guest ? 'без акаунта — лише пристрій' : 'пошти немає'))}</span>
            <span style="display:block;font-size:12px;color:#555;margin-top:4px">${escapeHtml(c.message)}</span>
            ${c.place ? `<span style="display:block;font-size:11px;color:#777">${escapeHtml(c.place)}</span>` : ''}
            ${c.tab ? `<span style="display:block;font-size:11px;color:#777">вкладка: ${escapeHtml(TAB_LABELS_UK[c.tab] || c.tab)}</span>` : ''}
            <span style="display:block;font-size:11px;color:#999;margin-top:4px">
              ${new Date(c.at).toLocaleString('uk-UA')} · ${escapeHtml(c.kind)} ·
              пристрій ${escapeHtml(String(c.device || '').slice(0, 8))}…</span>
          </span>
        </div>`).join('') + '</div>'
        : '<div class="empty">Випадки цієї поломки не знайшлись — можливо, вони старші за 30 днів.</div>');
  }));

  // ✓ «Полагоджено» / «повернути». 🔑 Позначка не ховає збій назавжди: якщо він
  // трапиться після неї, база сама поверне рядок нагору з поміткою «повернувся».
  // ⚠️ `stopPropagation` обовʼязковий — рядок під кнопкою відкриває вікно деталей.
  el.querySelectorAll('.fail-fix').forEach(кн => кн.addEventListener('click', async (ev) => {
    ev.stopPropagation();
    const d = кн.dataset;
    кн.disabled = true;
    const було = кн.textContent;
    кн.textContent = '…';
    const fn = d.on === '1' ? 'admin_failure_resolve' : 'admin_failure_unresolve';
    const args = { p_kind: d.kind, p_code: d.code, p_message: d.msg, p_where: d.where || '' };
    const { data, error } = await supa.rpc(fn, args);
    if (error || (data && data.error)) {
      кн.disabled = false; кн.textContent = '✗ не вийшло';
      setTimeout(() => { кн.textContent = було; }, 2000);
      return;
    }
    renderAnalytics(el);   // перемальовуємо: рядок їде у свій розділ
  }));

  // 🔑 Попередній висновок відкриваємо в ТОМУ САМОМУ вікні, що людей і збої. Третє
  // вікно поруч розійшлося б із першими двома — у цьому проєкті таке вже було.
  el.querySelectorAll('.ai-past').forEach(рядок => рядок.addEventListener('click', () => {
    const r = (звіти || []).find(x => String(x.id) === рядок.dataset.id);
    if (!r) return;
    openDetail(`AI-висновок від ${new Date(r.created_at).toLocaleString('uk-UA')}`,
      `<div style="white-space:pre-wrap;font-size:13.5px;line-height:1.55">${escapeHtml(r.summary_text)}</div>`
      + `<p style="font-size:11px;color:#999;margin-top:12px">Зроблено на числах того дня —
         саме тому висновок лишається правдивим, навіть коли екран уже показує інші.</p>`);
  }));

  // 📋 Копіювання всіх збоїв одним натиском (замовлення Вови 26.08).
  // ⚠️ Запасний шлях обовʼязковий: `navigator.clipboard` існує лише в захищеному
  // контексті (https), а адмінку відкривають і локально по http — там він відсутній.
  const copyBtn = document.getElementById('copy-failures');
  if (copyBtn) copyBtn.addEventListener('click', async (ev) => {
    ev.stopPropagation();
    const текст = failureText(збої);
    const ok = document.getElementById('copy-failures-ok');
    let вдалось = false;
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(текст);
        вдалось = true;
      }
    } catch (_) { /* нижче запасний шлях */ }
    if (!вдалось) {
      const ta = document.createElement('textarea');
      ta.value = текст;
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { вдалось = document.execCommand('copy'); } catch (_) {}
      ta.remove();
    }
    if (ok) {
      ok.textContent = вдалось ? '✓ скопійовано' : '✗ не вдалось — виділіть текст нижче';
      if (!вдалось) {
        const pre = document.createElement('pre');
        pre.style.cssText = 'white-space:pre-wrap;font-size:11px;background:#f5f5f5;padding:10px;border-radius:8px;margin-top:8px;user-select:all';
        pre.textContent = текст;
        copyBtn.parentElement.insertBefore(pre, copyBtn.nextSibling);
      }
      setTimeout(() => { if (вдалось && ok) ok.textContent = ''; }, 2500);
    }
  });

  // AI-висновок по кнопці (Потік 2) — supabase/functions/ai-analytics-summary.
  // Гейт адміна + рахунок агрегатів — на сервері (Edge Function), не тут.
  document.getElementById('ai-refresh-btn').addEventListener('click', async (e) => {
    const btn = e.currentTarget;
    const resultEl = document.getElementById('ai-refresh-result');
    const hintEl = document.getElementById('ai-refresh-hint');
    btn.disabled = true;
    const prevText = btn.textContent;
    btn.textContent = 'Читаю цифри…';
    resultEl.textContent = '';
    try {
      const { data, error } = await supa.functions.invoke('ai-analytics-summary');
      if (error) throw error;
      if (data && data.ok) {
        resultEl.textContent = data.summary_text;
        // ⚠️ «Збережено» пишемо ЛИШЕ коли сервер це підтвердив. Інакше людина повернеться
        // на сторінку по текст, якого там немає, — і другий раз заплатить за те саме.
        hintEl.innerHTML = data.saved
          ? 'Пораховано щойно і <b>збережено</b> — не зникне при поверненні на сторінку.'
          : '⚠️ Пораховано щойно, але <b>зберегти не вдалось</b>: при поверненні на '
            + 'сторінку цей текст зникне. Скопіюй його, якщо потрібен.';
      } else {
        resultEl.textContent = '❌ ' + ((data && data.error) || 'Невідома помилка');
      }
    } catch (err) {
      resultEl.textContent = '❌ Не вдалося отримати висновок: ' + (err.message || err);
    } finally {
      btn.disabled = false;
      btn.textContent = prevText;
    }
  });
}

// ── TAB: Статті (кабінет редактора) ───────────────────────────────────
const ART_CATEGORIES = ['Суспільство', 'Культура', 'Спорт', 'Освіта', 'Історія', 'Люди', 'Бізнес'];
const ART_GEOS = ['Громада', 'Волинь', 'Україна', 'Світ'];
const ART_STATUS = {
  draft:     { label: 'Чернетка',    color: '#8a7' },
  scheduled: { label: 'Заплановано', color: '#7a5cc0' },
  ready:     { label: 'На публікації', color: '#e08a2b' },
  published: { label: 'Опубліковано', color: '#2e9e5b' },
  archived:  { label: 'В архіві',    color: '#999' },
};
const ART_TYPE_UK = { news: '📰 Новина', holiday: '🎉 Свято', event: '📅 Подія' };

let artQuery = '';
let artFilter = 'all';   // all | draft | scheduled | ready | published
let artCategory = null;  // null = екран вибору категорії; 'news'|'holiday'|'event' = список типу

const typeOfArt = a => a.type || 'news';
// 3 категорії статей = 3 типи. «Найближчі події» (event) — керована рубрика:
// модератор копіює туди опубліковані статті/свята кнопкою «Скопіювати в Найближчі події».
const ART_CATS = [
  { type: 'news',    emoji: '📰', label: 'Новини' },
  { type: 'holiday', emoji: '🎉', label: 'Свята' },
  { type: 'event',   emoji: '📌', label: 'Найближчі події' },
];
const DRAFT_ART = () => ({ title: '', excerpt: '', content: '', category: '', geo: 'Громада', type: 'news', image: null, image_type: 'none', image_credit: null });

// Екран вибору категорії — сітка 3 плиток (перевикористовує .tile/.tile-grid головного меню).
function renderArtCategories(el) {
  const canCreate = isAdmin || editorPerms.canCreate;
  el.innerHTML = `
    ${canCreate ? '<div class="art-head"><button class="btn btn--approve" id="art-new">+ Створити статтю</button></div>' : ''}
    <div class="tile-grid">${ART_CATS.map(c => {
      const n = articles.filter(a => typeOfArt(a) === c.type).length;
      return `<button class="tile" data-artcat="${c.type}">
        ${n ? `<span class="tile-badge">${n}</span>` : ''}
        <span class="tile-ic" style="font-size:26px;line-height:1">${c.emoji}</span>
        <span class="tile-label">${c.label}</span>
      </button>`;
    }).join('')}</div>
  `;
  el.querySelectorAll('[data-artcat]').forEach(b => b.addEventListener('click', () => {
    artCategory = b.dataset.artcat; artFilter = 'all'; artQuery = ''; renderApp();
  }));
  document.getElementById('art-new')?.addEventListener('click', () => { articleDraft = DRAFT_ART(); renderApp(); });
}

function renderArticles(el) {
  if (articleDraft) return renderArticleForm(el);
  if (artCategory === null) return renderArtCategories(el);
  const canPub = isAdmin || editorPerms.canPublish;
  const inCat = articles.filter(a => typeOfArt(a) === artCategory);
  const draftN = inCat.filter(a => (a.status || 'draft') === 'draft').length;
  const catInfo = ART_CATS.find(c => c.type === artCategory) || ART_CATS[0];
  const FILTERS = [['all', 'Усі'], ['draft', 'Чернетки' + (draftN ? ' ' + draftN : '')],
                   ['scheduled', 'Заплановано'], ['ready', 'На публікації'], ['published', 'Опубліковано']];
  el.innerHTML = `
    <div class="art-head">
      <button class="btn" id="art-back-cat">← Категорії</button>
      <button class="btn" id="art-refresh">🔄 Оновити</button>
      <button class="btn btn--approve" id="art-new">+ Створити статтю</button>
    </div>
    <div style="font-weight:700;font-size:15px;margin:2px 0 8px">${catInfo.emoji} ${catInfo.label}</div>
    <input class="art-inp" id="art-search" placeholder="🔍 Пошук за заголовком…" value="${escapeHtml(artQuery)}" style="margin-bottom:8px">
    <div class="art-filters">${FILTERS.map(([v, l]) => `<button class="art-chip${artFilter === v ? ' active' : ''}" data-af="${v}">${l}</button>`).join('')}</div>
    <div id="art-list"></div>
  `;
  const listEl = el.querySelector('#art-list');
  // Потік 8: id оригіналів, які ВЖЕ скопійовані в Найближчі події (щоб не плодити дублі).
  // P6: рахуємо лише копії у статусі ready/published — чернетка-копія ще не в ефірі,
  // тому не має світити «вже скопійовано» (інакше здається зроблено, а на сайті нема).
  const copiedFrom = new Set(articles
    .filter(a => a.source_article_id != null && (a.status === 'ready' || a.status === 'published'))
    .map(a => Number(a.source_article_id)));

  const paint = () => {
    let list = articles.filter(a => typeOfArt(a) === artCategory);
    if (artFilter !== 'all') list = list.filter(a => (a.status || 'draft') === artFilter);
    const q = artQuery.trim().toLowerCase();
    if (q) list = list.filter(a => (a.title || '').toLowerCase().includes(q) || (a.excerpt || '').toLowerCase().includes(q));
    listEl.innerHTML = !list.length ? '<div class="empty">Нічого не знайдено.</div>' : list.map(a => {
      const st = ART_STATUS[a.status] || ART_STATUS.draft;
      const isAI = a.source && String(a.source).includes('CSTL');
      return `
        <article class="card">
          <div class="card-meta">
            <span class="badge" style="background:${st.color};color:#fff">${st.label}</span>
            ${a.status === 'ready' ? міткаОчікування(a) : ''}
            ${(() => { const п = призначення(a); return `<span class="badge" style="background:${п.колір};color:#fff" title="${escapeHtml(п.підказка)}">${п.текст}</span>`; })()}
            ${isAI ? '<span class="badge" style="background:#4b3bd6;color:#fff">🤖 AI</span>' : ''}
            ${a.type && a.type !== 'news' && ART_TYPE_UK[a.type] ? `<span class="badge badge--type">${ART_TYPE_UK[a.type]}</span>` : ''}
            ${a.status === 'scheduled' && a.publish_at ? `<span class="badge" style="background:#7a5cc0;color:#fff">📅 ${escapeHtml(formatDate(a.publish_at))}</span>` : ''}
            ${a.geo ? `<span class="badge badge--cat">${escapeHtml(a.geo)}</span>` : ''}
            ${a.category ? `<span class="badge badge--loc">${escapeHtml(a.category)}</span>` : ''}
            ${a.image_type === 'illustration' ? '<span class="badge" style="background:#555;color:#fff">🖼 Ілюстрація</span>' : ''}
            <span style="font-size:12px;color:#999;margin-left:auto">${escapeHtml(formatDate(a.updated_at))}</span>
          </div>
          <div style="font-weight:700;margin-bottom:4px">${escapeHtml(a.title || '(без заголовка)')}</div>
          ${a.excerpt ? `<p class="card-text">${escapeHtml(a.excerpt)}</p>` : ''}
          <div class="art-preview" id="art-prev-${a.id}" hidden></div>
          <div class="card-actions">
            <button class="btn" data-art-prev="${a.id}">👁 Прев'ю</button>
            <button class="btn" data-art-edit="${a.id}">✏️ Редагувати</button>
            ${a.status === 'draft' && canPub ? `<button class="btn btn--approve" data-art-pub="${a.id}">🚀 Опублікувати</button>` : ''}
            ${a.status === 'ready' ? `<button class="btn" data-art-unpub="${a.id}">↩︎ У чернетки</button>` : ''}
            ${((a.status === 'ready' || a.status === 'published') && typeOfArt(a) === 'news')
              ? (copiedFrom.has(Number(a.id))
                  ? '<span class="badge" style="background:#2e6b40;color:#fff">📌 у Найближчих подіях</span>'
                  : `<button class="btn" data-art-copyev="${a.id}">📌 Скопіювати в Найближчі події</button>`)
              : ''}
            <button class="btn btn--reject" data-art-del="${a.id}">🗑 Видалити</button>
          </div>
        </article>`;
    }).join('');
    bind();
  };

  const bind = () => {
    listEl.querySelectorAll('[data-art-prev]').forEach(b => b.addEventListener('click', () => {
      const box = document.getElementById('art-prev-' + b.dataset.artPrev);
      const a = articles.find(x => String(x.id) === b.dataset.artPrev);
      if (!box || !a) return;
      if (box.hidden) {
        box.innerHTML = (a.image ? `<img src="${escapeHtml(a.image)}" style="max-width:100%;border-radius:8px;margin:6px 0">` : '') +
          `<div class="card-text" style="white-space:pre-wrap">${escapeHtml(a.content || '(порожньо)')}</div>`;
        box.hidden = false;
      } else box.hidden = true;
    }));
    listEl.querySelectorAll('[data-art-edit]').forEach(b => b.addEventListener('click', () => {
      articleDraft = { ...articles.find(a => String(a.id) === b.dataset.artEdit) }; renderApp();
    }));
    listEl.querySelectorAll('[data-art-pub]').forEach(b => b.addEventListener('click', async () => {
      if (!confirm('Опублікувати статтю? Вона з\'явиться у стрічці після синхронізації.')) return;
      b.disabled = true;
      const ok = await publishArticle(b.dataset.artPub);
      if (!ok) { alert('Не вдалося опублікувати (перевірте дозвіл).'); b.disabled = false; return; }
      articles = await fetchArticles(); renderApp();
    }));
    listEl.querySelectorAll('[data-art-unpub]').forEach(b => b.addEventListener('click', async () => {
      await unpublishArticle(b.dataset.artUnpub); articles = await fetchArticles(); renderApp();
    }));
    listEl.querySelectorAll('[data-art-del]').forEach(b => b.addEventListener('click', async () => {
      if (!confirm('Видалити статтю?')) return;
      await deleteArticle(b.dataset.artDel); articles = await fetchArticles(); renderApp();
    }));
    // Потік 8: «Скопіювати в Найближчі події» — відкриває форму НОВОГО запису type='event'
    // з копією фото+тексту оригіналу; модератор ставить дату події й зберігає (INSERT).
    // source_article_id = оригінал → не дублюємо (позначка «📌 у Найближчих подіях»).
    listEl.querySelectorAll('[data-art-copyev]').forEach(b => b.addEventListener('click', () => {
      const a = articles.find(x => String(x.id) === b.dataset.artCopyev);
      if (!a) return;
      articleDraft = {
        title: a.title || '', excerpt: a.excerpt || '', content: a.content || '',
        category: a.category || '', geo: a.geo || 'Громада',
        image: a.image || null, image_type: a.image_type || (a.image ? 'source' : 'none'),
        image_credit: a.image_credit || null,
        type: 'event', status: 'draft', event_date: a.event_date || '',
        source_article_id: a.id,   // слід оригіналу (нема id → буде INSERT нового рядка)
      };
      renderApp();
    }));
  };

  document.getElementById('art-back-cat').addEventListener('click', () => { artCategory = null; renderApp(); });
  document.getElementById('art-refresh')?.addEventListener('click', async () => {
    articles = await fetchArticles(); renderApp();   // P2: підтягнути свіжий стан із сервера
  });
  document.getElementById('art-new')?.addEventListener('click', () => {
    articleDraft = { ...DRAFT_ART(), type: artCategory };   // нова стаття вже з типом обраної категорії
    renderApp();
  });
  el.querySelector('#art-search').addEventListener('input', e => { artQuery = e.target.value; paint(); });
  el.querySelectorAll('[data-af]').forEach(b => b.addEventListener('click', () => {
    artFilter = b.dataset.af;
    el.querySelectorAll('[data-af]').forEach(x => x.classList.toggle('active', x === b));
    paint();
  }));
  paint();
}

function renderArticleForm(el) {
  const d = articleDraft;
  const canPub = isAdmin || editorPerms.canPublish;
  const isSched = d.status === 'scheduled';
  const schedDT = d.publish_at
    ? (() => { const t = new Date(d.publish_at); return new Date(t.getTime() - t.getTimezoneOffset() * 60000).toISOString().slice(0, 16); })()
    : '';
  el.innerHTML = `
    <div class="art-form">
      <label class="art-lbl">Тип матеріалу
        <select class="art-inp" id="af-type">${Object.entries(ART_TYPE_UK).map(([v, l]) => `<option value="${v}" ${(d.type || 'news') === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
      </label>
      <label class="art-lbl">Заголовок
        <input class="art-inp" id="af-title" value="${escapeHtml(d.title || '')}" placeholder="Заголовок статті">
      </label>
      <label class="art-lbl">Короткий опис (лід)
        <textarea class="art-inp" id="af-excerpt" rows="2" placeholder="1-2 речення для картки">${escapeHtml(d.excerpt || '')}</textarea>
      </label>
      <label class="art-lbl">Повний текст
        <textarea class="art-inp" id="af-content" rows="9" placeholder="Текст статті...">${escapeHtml(d.content || '')}</textarea>
      </label>
      <div class="art-row">
        <label class="art-lbl">Регіон
          <select class="art-inp" id="af-geo">${ART_GEOS.map(g => `<option ${d.geo === g ? 'selected' : ''}>${g}</option>`).join('')}</select>
        </label>
        <label class="art-lbl">Категорія
          <select class="art-inp" id="af-cat"><option value="">—</option>${ART_CATEGORIES.map(c => `<option ${d.category === c ? 'selected' : ''}>${c}</option>`).join('')}</select>
        </label>
      </div>
      <label class="art-lbl">Дата свята/події (для «Шо в селі», необовʼязково для новин)
        <input class="art-inp" id="af-eventdate" type="date" value="${escapeHtml(d.event_date || '')}">
      </label>
      <label class="art-lbl">Фото (обкладинка)
        <input class="art-inp" id="af-photo" type="file" accept="image/*">
      </label>
      <div id="af-preview">${d.image ? `<img src="${escapeHtml(d.image)}" style="max-width:100%;border-radius:10px;margin-top:6px">` : ''}</div>
      ${d.status === 'published' ? `
      <div style="background:#e8f5ec;border:1px solid #bfe3c9;border-radius:10px;padding:10px 12px;font-size:14px;color:#2e6b40">
        ✅ Стаття ОПУБЛІКОВАНА — вона вже у стрічці сайту. Збереження оновить лише копію
        в кабінеті (на сайт зміни не потраплять) і НЕ зніме статтю з публікації.
      </div>` : `
      <label class="art-lbl">Публікація
        <div class="art-when">
          <label class="art-when-opt"><input type="radio" name="af-when" value="draft" ${isSched ? '' : 'checked'}> Лишити чернеткою</label>
          <label class="art-when-opt"><input type="radio" name="af-when" value="schedule" ${isSched ? 'checked' : ''}> 📅 Автопостинг на дату/час</label>
        </div>
        <input class="art-inp" id="af-when-dt" type="datetime-local" value="${schedDT}" style="${isSched ? '' : 'display:none'};margin-top:6px">
      </label>`}
      <div class="art-actions">
        <button class="btn" id="af-cancel">Скасувати</button>
        <button class="btn btn--approve" id="af-save">💾 ${d.status === 'published' ? 'Зберегти зміни' : 'Зберегти чернетку'}</button>
        ${canPub && d.status !== 'published' ? `<button class="btn" id="af-savepub" style="background:#e08a2b;color:#fff">🚀 Зберегти й опублікувати</button>` : ''}
      </div>
    </div>
  `;
  const read = () => ({
    ...d,
    title: document.getElementById('af-title').value.trim(),
    excerpt: document.getElementById('af-excerpt').value.trim(),
    content: document.getElementById('af-content').value.trim(),
    geo: document.getElementById('af-geo').value,
    category: document.getElementById('af-cat').value,
    event_date: document.getElementById('af-eventdate').value || null,
    type: document.getElementById('af-type').value,
  });
  document.getElementById('af-cancel').addEventListener('click', () => { articleDraft = null; renderApp(); });
  // Розклад: показати/сховати вибір дати-часу + зробити кнопку зрозумілою.
  // Коли обрано автопостинг — кнопка «Опублікувати» стає «Запланувати» (публікації
  // одразу не буде, стаття піде в чергу на вказаний час).
  const syncWhenUI = () => {
    const on = document.querySelector('input[name="af-when"]:checked')?.value === 'schedule';
    const dt = document.getElementById('af-when-dt');   // відсутній для опублікованої
    if (dt) dt.style.display = on ? '' : 'none';
    const pubBtn = document.getElementById('af-savepub');
    if (pubBtn) pubBtn.textContent = on ? '📅 Запланувати автопостинг' : '🚀 Зберегти й опублікувати';
  };
  document.querySelectorAll('input[name="af-when"]').forEach(r => r.addEventListener('change', syncWhenUI));
  syncWhenUI();
  // Фото → Supabase Storage
  document.getElementById('af-photo').addEventListener('change', async e => {
    const file = e.target.files[0]; if (!file) return;
    const prev = document.getElementById('af-preview');
    prev.innerHTML = 'Завантаження…';
    const url = await uploadArticlePhoto(file);
    if (url) { d.image = url; d.image_type = 'source'; prev.innerHTML = `<img src="${url}" style="max-width:100%;border-radius:10px;margin-top:6px">`; }
    else { prev.innerHTML = '<span style="color:#c33">Не вдалося завантажити фото</span>'; }
  });
  const doSave = async (publish) => {
    const a = read();
    if (!a.title || !a.content) { alert('Заголовок і текст обов\'язкові.'); return; }
    // ОПУБЛІКОВАНУ статтю збереження НЕ деградує: статус лишається 'published'.
    // Раніше «Зберегти чернетку» мовчки знімав статус у базі, а стрічка (git)
    // статтю тримала далі → розсинхрон «на сайті є, в кабінеті чернетка».
    // Розклад автопостингу. ВАЖЛИВО: якщо обрано «Автопостинг на дату/час» —
    // розклад МАЄ ПРІОРИТЕТ над «опублікувати зараз». Раніше кнопка «Зберегти й
    // опублікувати» мовчки ігнорувала розклад і публікувала одразу (status=ready) —
    // тому заплановані статті виглядали як опубліковані. Тепер розклад завжди виграє.
    const scheduling = document.querySelector('input[name="af-when"]:checked')?.value === 'schedule';
    if (d.status === 'published') {
      a.status = 'published';
    } else {
      const dtVal = document.getElementById('af-when-dt')?.value;
      if (scheduling) {
        if (!dtVal) { alert('Оберіть дату й час автопостингу.'); return; }
        a.status = 'scheduled';
        a.publish_at = new Date(dtVal).toISOString();   // локальний час → UTC
      } else if (!publish) {
        // P5: якщо стаття ВЖЕ у черзі публікації (ready) — звичайне збереження її
        // ЛИШАЄ ready (не демотуємо в чернетку), інакше правка тихо знімала з черги.
        a.status = (d.status === 'ready') ? 'ready' : 'draft';
        if (a.status === 'draft') a.publish_at = null;   // зняти розклад при збереженні чернеткою
      }
    }
    const savedId = await saveArticle(a);
    if (!savedId) { alert('Не вдалося зберегти (перевірте дозвіл).'); return; }
    // Публікуємо одразу ЛИШЕ якщо НЕ заплановано (інакше чекаємо часу автопостингу).
    // Результат перевіряємо: RLS може відмовити (нема дозволу publish) — тоді стаття
    // лишилась чернеткою, і мовчати про це не можна.
    if (publish && !scheduling) {
      const ok = await publishArticle(savedId);
      if (!ok) alert('Збережено як чернетку, але ОПУБЛІКУВАТИ не вдалося (нема дозволу на публікацію?).');
    }
    articles = await fetchArticles();
    if (a.type) artCategory = a.type;   // P10: після збереження показати категорію збереженого типу (не «зникло» при зміні типу)
    articleDraft = null; renderApp();
  };
  document.getElementById('af-save').addEventListener('click', () => doSave(false));
  document.getElementById('af-savepub')?.addEventListener('click', () => doSave(true));
}

// ── TAB 1: модерація постів ───────────────────────────────────────────
function typeLabel(t) {
  return t === 'chat' ? '💬 розмова' : t === 'greeting' ? '🎉 вітання' : '🛒 оголошення';
}

async function approvePost(id) {
  const { error } = await supa.from('posts').update({
    status: 'published',
    published_at: new Date().toISOString(),
  }).eq('id', id);
  if (error) return showToast('Помилка: ' + error.message, 4000);
  showToast('Опубліковано ✓');
  await loadAll(); renderApp();
}

// ── ВІДХИЛЕННЯ З ПРИЧИНОЮ — ОДНЕ МІСЦЕ ПРАВДИ (17.08.2026) ─────────────────
//
// 🔴 Навіщо: житель бачив у «Моїх оголошеннях» лише слово «Відхилено» і НЕ ЗНАВ
// ЧОМУ — тобто не міг виправити й подати знову. Рішення Вови: варіант «Б» —
// колонка `posts.reject_reason` + поле тут.
//
// 🔑 Чому одна функція на ТРИ кнопки («Відхилити» в модерації · «Зняти з
// публікації» в опублікованих · те саме в картці поста): статус міняли три
// окремі місця, і без спільної функції одне з них рано чи пізно лишилось би без
// причини — а житель отримав би порожнє «відхилено» знову, тільки зрідка.
//
// ⚠️ ПРИЧИНА НЕ ОБОВʼЯЗКОВА. Порожній рядок = відхилити без пояснення: змусити
// адміна писати текст означало б, що при поспіху модерація просто спиниться.
// Скасування діалогу (Esc / «Скасувати») — це «нічого не роби», пост не чіпаємо.
async function rejectPost(id, { запит = 'Чому відхиляємо? Це побачить житель у «Моїх оголошеннях».\n\nМожна лишити порожнім.' } = {}) {
  const причина = prompt(запит, '');
  if (причина === null) return;                      // скасував — не відхиляємо
  const текст = причина.trim().slice(0, 300);        // стеля дзеркалить constraint у БД

  // 🛑 ДВА КРОКИ, і це не надмірність: колонка `reject_reason` живе окремою
  // міграцією (`scripts/supabase_reject_reason.sql`), і поки її не накатали,
  // запит із цим полем падає ЦІЛКОМ — тобто модерація перестала б працювати
  // взагалі. Тому спершу робимо головну дію, і лише потім, окремо, дописуємо
  // причину; не вдалося — кажемо про це вголос, а не мовчимо.
  const { error } = await supa.from('posts').update({ status: 'rejected' }).eq('id', id);
  if (error) return showToast('Помилка: ' + error.message, 4000);

  if (текст) {
    const { error: e2 } = await supa.from('posts').update({ reject_reason: текст }).eq('id', id);
    if (e2) showToast('Відхилено, але причину не збережено: ' + e2.message, 5000);
    else showToast('Відхилено · причину збережено');
  } else {
    showToast('Відхилено');
  }
  await loadAll(); renderApp();
}

async function deletePost(id) {
  if (!confirm('Видалити пост назавжди? Цю дію не скасувати.')) return;
  const { error } = await supa.from('posts').delete().eq('id', id);
  if (error) return showToast('Помилка: ' + error.message, 4000);
  showToast('Видалено');
  await loadAll(); renderApp();
}

// ── TAB: Дошка оголошень ──────────────────────────────────────────────────
// 🔴 20.08 — БУЛО ДВА РОЗДІЛИ («Модерація» і «Опубліковані»), і в обох лежали
// вперемішку оголошення та ПИТАННЯ, бо в базі це одна таблиця `posts`. Скарга
// Вови дослівно: «оголошення дошки і ті що в питання але позначені як розмова».
//
// 🔑 СТАЛО: одна сутність — один розділ, а СТАТУС це фільтр. Так людина мислить
// («покажи оголошення» → «які з них чекають рішення»), і так не буває стану,
// коли той самий об'єкт лежить у двох різних місцях меню.
// ⚠️ «Відхилені» з'явились уперше: раніше їх узагалі не вантажили, тобто
// відхилене оголошення зникало з адмінки назавжди.
let дошкаФільтр = 'pending';

function renderBoard(el) {
  const усі = оголошення();
  const за = (s) => усі.filter(p => (p.status || 'pending') === s);
  const набір = за(дошкаФільтр);

  const чіп = (id, назва) => {
    const n = за(id).length;
    return `<button class="chip${дошкаФільтр === id ? ' chip--on' : ''}" data-bfilter="${id}">
      ${назва}${n ? ` <span class="chip-n">${n}</span>` : ''}</button>`;
  };

  el.innerHTML = `
    <div class="chips">
      ${чіп('pending', 'На модерації')}
      ${чіп('published', 'Опубліковані')}
      ${чіп('rejected', 'Відхилені')}
    </div>
    ${набір.length ? набір.map(карткаОголошення).join('')
      : `<div class="empty">${дошкаФільтр === 'pending'
            ? 'Усе перевірено — нових оголошень на модерації немає.'
            : 'Тут порожньо.'}</div>`}
  `;

  el.querySelectorAll('[data-bfilter]').forEach(b => b.addEventListener('click', () => {
    дошкаФільтр = b.dataset.bfilter; renderBoard(el);
  }));
  вішатиДіїОголошення(el);
}

// 🔑 ОДНА картка на всі три стани — різняться лише ДІЇ. Три майже однакові
// шаблони (як було) розходяться при першій же правці: у проєкті це вже коштувало
// розсинхрону двох копій антиспаму.
function карткаОголошення(p) {
  const s = p.status || 'pending';
  const дії = s === 'pending'
    ? `<button class="btn btn--approve" data-approve="${p.id}">Опублікувати</button>
       <button class="btn btn--reject"  data-reject="${p.id}">Відхилити</button>`
    : s === 'published'
      ? `<button class="btn btn--reject" data-unpublish="${p.id}">Зняти з публікації</button>`
      : `<button class="btn btn--approve" data-approve="${p.id}">Повернути в ефір</button>`;
  return `
    <article class="card">
      <div class="card-meta">
        <span class="badge badge--type">${escapeHtml(typeLabel(p.type))}</span>
        ${p.category ? `<span class="badge badge--cat">${escapeHtml(p.category)}</span>` : ''}
        ${p.location ? `<span class="badge badge--loc">📍 ${escapeHtml(p.location)}</span>` : ''}
        <span class="card-when">${escapeHtml(formatDate(p.published_at || p.created_at))}</span>
      </div>
      ${p.title ? `<div class="card-title">${escapeHtml(p.title)}</div>` : ''}
      <p class="card-text">${escapeHtml(p.text)}</p>
      ${p.contact ? `<div class="card-contact">📞 ${escapeHtml(p.contact)}</div>` : ''}
      <p class="card-author">— ${escapeHtml(p.author || 'анонімно')}</p>
      <div class="card-actions">
        ${дії}
        <button class="btn btn--delete" data-delete-post="${p.id}">Видалити</button>
      </div>
    </article>`;
}

function вішатиДіїОголошення(el) {
  el.querySelectorAll('[data-approve]').forEach(b => b.addEventListener('click', () => approvePost(Number(b.dataset.approve))));
  el.querySelectorAll('[data-reject]').forEach(b => b.addEventListener('click', () => rejectPost(Number(b.dataset.reject))));
  el.querySelectorAll('[data-delete-post]').forEach(b => b.addEventListener('click', () => deletePost(Number(b.dataset.deletePost))));
  el.querySelectorAll('[data-unpublish]').forEach(b => b.addEventListener('click', async () => {
    if (!confirm('Зняти оголошення з публікації?')) return;
    const { error } = await supa.from('posts').update({ status: 'rejected' }).eq('id', Number(b.dataset.unpublish));
    if (error) return showToast('Помилка: ' + error.message, 4000);
    showToast('Знято з публікації ✓');
    await loadAll(); renderApp();
  }));
}

// ── TAB: Питання громади ──────────────────────────────────────────────────
// 🔴 20.08 — ЗАВЕДЕНО ЗАМІСТЬ ДВОХ РОЗДІЛІВ, які його розривали навпіл.
// Було: питання лежали в «Опублікованих» упереміш з оголошеннями, а відповіді на
// них — в окремій вкладці «Коментарі», без питання поруч. Скарга Вови: «коментарів
// до питань нема, вони взагалі десь в іншій вкладці».
//
// 🔑 ЧОМУ ЦЕ БУЛА НЕ ДРІБНИЦЯ: заміряно 20.08 — усі 72 коментарі це відповіді на
// питання, на оголошеннях їх РІВНО НУЛЬ. Тобто вкладка «Коментарі» ніколи не була
// про коментарі взагалі; вона була «Відповідями», відірваними від свого питання.
// Модерувати відповідь, не бачачи питання, — це вгадувати.
//
// ⚠️ Мітка «розмова» пішла разом із розділами: вкладку перейменували на «Питання»
// 11.08, а адмінка про це не знала ще девʼять днів.
function renderQuestions(el) {
  const список = питання();
  if (!список.length) return el.innerHTML = '<div class="empty">Питань ще немає.</div>';

  el.innerHTML = список.map(q => {
    const відп = відповідіДо(q.id);
    return `
      <article class="card card--q">
        <div class="card-meta">
          <span class="badge badge--type">Питання</span>
          ${відп.length
            ? `<span class="badge badge--cat">${відп.length} ${відмінок(відп.length, 'відповідь', 'відповіді', 'відповідей')}</span>`
            : '<span class="badge badge--warn">без відповіді</span>'}
          <span class="card-when">${escapeHtml(formatDate(q.created_at))}</span>
        </div>
        <div class="q-text">${escapeHtml(q.text || q.title || '')}</div>
        <p class="card-author">— ${escapeHtml(q.author || 'анонімно')}</p>

        ${відп.length ? `<div class="answers">
          ${відп.map(c => `
            <div class="answer">
              <div class="answer-head">
                <b>${escapeHtml(c.author || 'анонімно')}</b>
                <span class="card-when">${escapeHtml(formatDate(c.created_at))}</span>
              </div>
              <div class="answer-text">${escapeHtml(c.text || '')}</div>
              <button class="btn btn--delete btn--sm" data-del-answer="${c.id}">Видалити відповідь</button>
            </div>`).join('')}
        </div>` : ''}

        <div class="card-actions">
          <button class="btn btn--delete" data-delete-post="${q.id}">Видалити питання</button>
        </div>
      </article>`;
  }).join('');

  el.querySelectorAll('[data-delete-post]').forEach(b => b.addEventListener('click', () => deletePost(Number(b.dataset.deletePost))));
  el.querySelectorAll('[data-del-answer]').forEach(b => b.addEventListener('click', async () => {
    if (!confirm('Видалити цю відповідь?')) return;
    const { error } = await supa.from('comments').delete().eq('id', Number(b.dataset.delAnswer));
    if (error) return showToast('Помилка: ' + error.message, 4000);
    showToast('Відповідь видалено ✓');
    await loadAll(); renderApp();
  }));
}

// Українська плюралізація — щоб не писати «1 відповідей».
function відмінок(n, одна, дві, багато) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return одна;
  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return дві;
  return багато;
}

//
// 🔴 НАВІЩО ЦЕЙ РОЗДІЛ (замовлення Вови 17.08). До нього збори лежали у файлі
// `data/fundraisers.json` у git: створити збір міг ЛИШЕ Вова і лише через
// GitHub. Це працювало, поки збір був один, і ставало вузьким місцем далі —
// зокрема тому, що передати цю роботу іншій людині було неможливо.
//
// 🔑 РОЗДІЛ РОБИТЬ ДВІ РІЗНІ РЕЧІ, І ВОНИ НАВМИСНО НА ОДНОМУ ЕКРАНІ:
//   • ЗАЯВКИ  — те, що надіслали жителі. Тут ухвалюють рішення.
//   • ЗБОРИ   — те, що вже видно на головній. Тут керують показом.
// Розводити їх по двох розділах означало б розірвати один робочий процес
// («прийшла заявка → подзвонив → схвалив → бачу збір») на два екрани.
//
// ⚠️ ЗАЯВКИ СТОЯТЬ ПЕРШИМИ. Вони єдине, що ЧЕКАЄ на людину; збори просто є.
// Той самий принцип, що в «Скаргах»: угорі те, що вимагає дії.

const FUND_KIND_LABEL = {
  military:     'Для захисників',
  humanitarian: 'Гуманітарний',
  community:    'Для громади',
};
const FREQ_STATUS_LABEL = {
  new:       'Нова',
  contacted: 'Звʼязались',
  approved:  'Схвалено',
  rejected:  'Відхилено',
};

// Сума словами для списку. `toLocaleString` дає нерозривні пробіли між тисячами.
const fundMoney = n => (Number.isFinite(Number(n)) && Number(n) > 0)
  ? Number(n).toLocaleString('uk-UA') + ' ₴' : '—';

// Фото збору. Той самий бакет, що в спільнот і оголошень — заводити окремий
// заради одного розділу немає причини.
async function uploadFundPhoto(file) {
  const safe = (file.name || 'img').replace(/[^\w.\-]/g, '_');
  const path = `fundraisers/${currentUser.id}/${Date.now()}_${safe}`;
  const { error } = await supa.storage.from('community-photos').upload(path, file, { upsert: false });
  if (error) { showToast('Не вдалося завантажити фото: ' + error.message, 4000); return null; }
  const { data } = supa.storage.from('community-photos').getPublicUrl(path);
  return data?.publicUrl || null;
}

// Людська мова замість тексту з бази. 🔑 Ловимо ІМЕНА ОБМЕЖЕНЬ, а не текст
// помилки: текст Postgres міняє між версіями, назва `check` — ні.
function fundErr(error) {
  const m = `${error?.message || ''} ${error?.details || ''} ${error?.hint || ''}`;
  if (m.includes('url_https'))  return 'Посилання на банку має починатися з https://';
  if (m.includes('title_ok'))   return 'Назва — від 3 до 120 символів';
  if (m.includes('org_ok'))     return 'Поле «Хто збирає» — від 2 до 80 символів';
  if (m.includes('goal_ok'))    return 'Ціль має бути додатнім числом';
  if (m.includes('kind_ok'))    return 'Невідома категорія';
  if (m.includes('note_ok'))    return 'Опис задовгий — до 400 символів';
  if (m.includes('row-level'))  return 'Немає прав. Збори створює лише адмін.';
  return error?.message || 'Помилка';
}

// Форма створення / редагування. 🔑 ОДНА форма на обидві дії: різниця лише в

      <label style="font-size:13px;color:#555;display:flex;align-items:center;gap:8px;cursor:pointer">

      <div style="display:flex;gap:8px">
        <button class="btn btn--primary" type="submit">${редагуємо ? 'Зберегти' : 'Створити збір'}</button>

function renderFundraisers(el) {
  const лічильники = {
    new:       fundRequests.filter(r => r.status === 'new').length,
    contacted: fundRequests.filter(r => r.status === 'contacted').length,
    approved:  fundRequests.filter(r => r.status === 'approved').length,
    rejected:  fundRequests.filter(r => r.status === 'rejected').length,
  };
  const заявки = fundRequests.filter(r => r.status === fundReqFilter);
  const сьогодні = new Date().toISOString().slice(0, 10);

  el.innerHTML = `
    <div class="section-title">Заявки від жителів</div>
    <!-- ⚠️ Фільтр зроблено ТИМИ САМИМИ класами, що у «Скаргах» (btn / btn--ghost),
         а не власними: своя пара класів у розділі означала б, що дві однакові
         на вигляд смужки живуть різним життям і розʼїдуться при першій же
         правці стилів.
         🛑 ЗВОРОТНІ ЛАПКИ В ЦЬОМУ КОМЕНТАРІ ЗАБОРОНЕНІ: він лежить УСЕРЕДИНІ
         шаблонного рядка, і пара лапок навколо назви класу закрила б рядок —
         решта розмітки стала б кодом. Саме так я тут і зламав адмінку 17.08:
         сторінка застигала на «Завантаження…», а перевірка синтаксису мовчала.
         Виправляючи це, я вжив лапки ще раз — у самому попередженні. -->
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
      ${Object.entries(FREQ_STATUS_LABEL).map(([k, v]) =>
        `<button class="btn${fundReqFilter === k ? '' : ' btn--ghost'}" data-freq-filter="${k}">${v} ${лічильники[k]}</button>`).join('')}
    </div>
    ${!fundRequests.length
      ? '<div class="empty">Заявок ще немає. Кнопка «Запропонувати збір» у застосунку пише сюди.</div>'
      : (!заявки.length ? '<div class="empty">У цій категорії порожньо</div>' : заявки.map(r => `
      <article class="card">
        <div class="card-meta">
          <span class="badge">${FREQ_STATUS_LABEL[r.status] || r.status}</span>
          <span class="badge">${FUND_KIND_LABEL[r.kind] || r.kind}</span>
          <span style="font-size:12px;color:#999;margin-left:auto">${escapeHtml(formatDate(r.created_at))}</span>
        </div>
        <div style="font-weight:600;margin-bottom:4px">${escapeHtml(r.title)}</div>
        <p class="card-text">${escapeHtml(r.note || '—')}</p>
        <div style="font-size:13px;color:#444;line-height:1.6;margin:6px 0">
          Збирає: <b>${escapeHtml(r.org)}</b><br>
          Банка: <a href="${escapeHtml(r.url)}" target="_blank" rel="noopener">${escapeHtml(r.url)}</a><br>
          Ціль: ${fundMoney(r.goal)}${r.until ? ' · до ' + escapeHtml(r.until) : ''}${r.place ? ' · ' + escapeHtml(r.place) : ''}
        </div>
        <!-- 🔴 КОНТАКТ — ГОЛОВНЕ В ЗАЯВЦІ, тому окремою плашкою, а не рядком
             у загальному тексті: збір публікується лише після живої розмови. -->
        <div style="background:#F3F5F8;border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.6">
          📞 <b>${escapeHtml(r.contact_name)}</b> · <a href="tel:${escapeHtml(r.contact_phone)}">${escapeHtml(r.contact_phone)}</a>
          <br><span style="color:#777">акаунт: ${escapeHtml(r.author_name || '—')}</span>
        </div>
        ${r.admin_note ? `<p class="card-text" style="color:#777">Нотатка: ${escapeHtml(r.admin_note)}</p>` : ''}
        <div class="card-actions">
          ${r.status === 'approved'
            ? `<span style="font-size:13px;color:#2a7">✓ Схвалено — збір #${r.fundraiser_id ?? '—'}</span>`
            : `<button class="btn btn--primary" data-freq-approve="${r.id}">✓ Схвалити і створити збір</button>
               ${r.status === 'new' ? `<button class="btn" data-freq-contacted="${r.id}">📞 Звʼязались</button>` : ''}
               <button class="btn btn--delete" data-freq-reject="${r.id}">Відхилити</button>`}
        </div>
      </article>`).join(''))}

    <div class="section-title" style="margin-top:22px">Збори на головній (${fundraisers.length})</div>
    ${fundFormHtml()}
    ${!fundraisers.length ? '<div class="empty">Жодного збору. Блок на головній не показується.</div>' : fundraisers.map(f => {
      const завершено = f.until && f.until < сьогодні;
      return `
      <article class="card" style="${f.active ? '' : 'opacity:.6'}">
        <div class="card-meta">
          ${f.active ? '<span class="badge" style="background:#DFF3E4;color:#1d6b32">На головній</span>'
                     : '<span class="badge">Приховано</span>'}
          ${f.verified ? '<span class="badge" style="background:#E7EEFB;color:#24467e">Перевірено</span>' : ''}
          ${завершено ? '<span class="badge" style="background:#FBE9E7;color:#8a3226">Завершено</span>' : ''}

            <a href="${escapeHtml(f.url)}" target="_blank" rel="noopener" style="font-size:12px;word-break:break-all">${escapeHtml(f.url)}</a>
          </div>
        </div>
        <div class="card-actions">
          <button class="btn" data-fund-edit="${f.id}">✎ Редагувати</button>
          <button class="btn" data-fund-toggle="${f.id}">${f.active ? 'Сховати' : 'Показати'}</button>
          <button class="btn" data-fund-verify="${f.id}">${f.verified ? 'Зняти «перевірено»' : 'Позначити перевіреним'}</button>

          <button class="btn btn--delete" data-fund-delete="${f.id}">🗑 Видалити</button>
        </div>
      </article>`;
    }).join('')}
  `;

  // ── Фільтр заявок ──
  el.querySelectorAll('[data-freq-filter]').forEach(b => b.addEventListener('click', () => {
    fundReqFilter = b.dataset.freqFilter; renderFundraisers(el);
  }));

  // ── Схвалення. 🔑 Через RPC, а не двома запитами: атомарно, і поля
  //    копіюються НА СЕРВЕРІ — підмінити посилання на банку по дорозі не можна.
  el.querySelectorAll('[data-freq-approve]').forEach(b => b.addEventListener('click', async () => {
    if (!confirm('Схвалити заявку і створити збір?\n\nПозначку «перевірено» треба буде поставити окремо.')) return;
    b.disabled = true;
    const { data, error } = await supa.rpc('approve_fundraiser_request', { p_request_id: Number(b.dataset.freqApprove) });
    if (error) { b.disabled = false; return showToast(fundErr(error), 4000); }
    showToast('Збір створено ✓ (#' + data + ')');
    await loadAll(); renderApp();
  }));

  el.querySelectorAll('[data-freq-contacted]').forEach(b => b.addEventListener('click', async () => {
    const { error } = await supa.from('fundraiser_requests')
      .update({ status: 'contacted' }).eq('id', Number(b.dataset.freqContacted));
    if (error) return showToast(fundErr(error), 4000);
    await loadAll(); renderApp();
  }));

  el.querySelectorAll('[data-freq-reject]').forEach(b => b.addEventListener('click', async () => {
    const нотатка = prompt('Чому відхиляємо? (побачить лише команда)');
    if (нотатка === null) return;
    const { error } = await supa.from('fundraiser_requests')
      .update({ status: 'rejected', admin_note: нотатка || null, reviewed_at: new Date().toISOString() })
      .eq('id', Number(b.dataset.freqReject));
    if (error) return showToast(fundErr(error), 4000);
    await loadAll(); renderApp();
  }));

  // ── Форма збору ──
  const photoInput = document.getElementById('fund-photo');
  if (photoInput) photoInput.addEventListener('change', async e => {
    const file = e.target.files[0]; if (!file) return;
    const prev = document.getElementById('fund-photo-prev');
    if (prev) prev.textContent = 'Завантаження…';
    const url = await uploadFundPhoto(file);
    fundDraft = { ...(fundDraft || {}), photo: url };

      ? `<img src="${url}" style="height:90px;border-radius:8px;object-fit:cover;display:block;margin:6px 0">`
      : '<span style="color:#c33">Не вдалося</span>';
  });

  const cancel = document.getElementById('fund-cancel');
  if (cancel) cancel.addEventListener('click', () => { fundDraft = null; renderFundraisers(el); });

  document.getElementById('fund-form').addEventListener('submit', async e => {
    e.preventDefault();
    const v = id => (document.getElementById(id)?.value || '').trim();
    const рядок = {
      title: v('fund-title'),
      org:   v('fund-org'),
      url:   v('fund-url'),
      note:  v('fund-note') || null,
      goal:  v('fund-goal') ? Number(v('fund-goal')) : null,
      kind:  v('fund-kind') || 'community',
      until: v('fund-until') || null,
      place: v('fund-place') || null,
      photo: (fundDraft && fundDraft.photo) || null,
      verified: !!document.getElementById('fund-verified')?.checked,
    };
    if (!рядок.title || !рядок.org || !рядок.url) return showToast('Назва, «хто збирає» і посилання обовʼязкові', 4000);
    const { error } = fundDraft && fundDraft.id
      ? await supa.from('fundraisers').update(рядок).eq('id', fundDraft.id)
      : await supa.from('fundraisers').insert(рядок);
    if (error) return showToast(fundErr(error), 4000);
    showToast(fundDraft && fundDraft.id ? 'Збережено ✓' : 'Збір створено ✓');
    fundDraft = null;
    await loadAll(); renderApp();
  });

  // ── Дії над зборами ──
  el.querySelectorAll('[data-fund-edit]').forEach(b => b.addEventListener('click', () => {
    fundDraft = fundraisers.find(f => f.id === Number(b.dataset.fundEdit)) || null;
    renderFundraisers(el);
    document.getElementById('fund-form')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }));

  el.querySelectorAll('[data-fund-toggle]').forEach(b => b.addEventListener('click', async () => {
    const f = fundraisers.find(x => x.id === Number(b.dataset.fundToggle)); if (!f) return;
    const { error } = await supa.from('fundraisers').update({ active: !f.active }).eq('id', f.id);
    if (error) return showToast(fundErr(error), 4000);
    await loadAll(); renderApp();
  }));

  el.querySelectorAll('[data-fund-verify]').forEach(b => b.addEventListener('click', async () => {
    const f = fundraisers.find(x => x.id === Number(b.dataset.fundVerify)); if (!f) return;
    // 🛑 Окрема дія, а не галочка «за компанію» при схваленні: схвалив = «ми це
    // пропустили», перевірив = «ми це перевірили». Позначка, яку клеять усім
    // підряд, знецінює слово, заради якого існує.
    if (!f.verified && !confirm('Позначити збір перевіреним?\n\nЦе означає, що ви особисто переконались у зборі й у людині.')) return;
    const { error } = await supa.from('fundraisers').update({ verified: !f.verified }).eq('id', f.id);
    if (error) return showToast(fundErr(error), 4000);
    await loadAll(); renderApp();
  }));

  // Підняти вгору = стати вищим за найвищий. Числа в полі ніхто не редагує
  // руками: «підняти» — це дія, а не значення.
  el.querySelectorAll('[data-fund-up]').forEach(b => b.addEventListener('click', async () => {
    const максимум = fundraisers.reduce((m, x) => Math.max(m, Number(x.sort_order) || 0), 0);
    const { error } = await supa.from('fundraisers')
      .update({ sort_order: максимум + 1 }).eq('id', Number(b.dataset.fundUp));
    if (error) return showToast(fundErr(error), 4000);
    showToast('Піднято вгору');
    await loadAll(); renderApp();
  }));

  el.querySelectorAll('[data-fund-delete]').forEach(b => b.addEventListener('click', async () => {
    // ⚠️ Питаємо саме про НАСЛІДОК, а не «ви впевнені?»: у зборів є «Сховати»,
    // і в дев'яти випадках із десяти людині потрібне саме воно.
    if (!confirm('Видалити збір НАЗАВЖДИ?\n\nЩоб просто прибрати його з головної, є кнопка «Сховати».')) return;
    const { error } = await supa.from('fundraisers').delete().eq('id', Number(b.dataset.fundDelete));
    if (error) return showToast(fundErr(error), 4000);
    showToast('Видалено');
    await loadAll(); renderApp();
  }));
}

// ── TAB 3: адміни ─────────────────────────────────────────────────────
// ── TAB: Спільноти (канали «Стрічки») ─────────────────────────────────
// Створення / порядок кружечків / видалення спільнот + керування власниками.
// База (RLS + RPC): scripts/supabase_pages_admin.sql. Форма — за зразком
// renderAdmins/renderArticleForm; аватар/банер — uploadCommunityImage (бакет
// community-photos, як uploadArticlePhoto). profiles закриті RLS, тому власник
// по email іде через RPC admin_create_community / admin_find_uid_by_email.
let ccDraft = { avatar_url: null, banner_url: null };

async function uploadCommunityImage(file) {
  const safe = (file.name || 'img').replace(/[^\w.\-]/g, '_');
  const path = `communities/${currentUser.id}/${Date.now()}_${safe}`;
  const { error } = await supa.storage.from('community-photos').upload(path, file, { upsert: false });
  if (error) { showToast('Не вдалося завантажити фото: ' + error.message, 4000); return null; }
  const { data } = supa.storage.from('community-photos').getPublicUrl(path);
  return data?.publicUrl || null;
}

// Прив'язати <input type=file> до прев'ю і зберегти URL у target[field].
function bindCommunityUpload(inputId, prevId, target, field, isAvatar) {
  const inp = document.getElementById(inputId);
  if (!inp) return;
  inp.addEventListener('change', async e => {
    const file = e.target.files[0]; if (!file) return;
    const prev = document.getElementById(prevId);
    if (prev) prev.innerHTML = 'Завантаження…';
    const url = await uploadCommunityImage(file);
    if (url) {
      target[field] = url;
      if (prev) prev.innerHTML = `<img src="${url}" style="height:${isAvatar ? 54 : 90}px;border-radius:${isAvatar ? '50%' : '8px'};object-fit:cover;display:block;margin:6px 0">`;
    } else if (prev) prev.innerHTML = '<span style="color:#c33">Не вдалося</span>';
  });
}

// Укр. відмінювання «власник» за кількістю.
function pluralOwners(n) {
  const a = n % 10, b = n % 100;
  if (a === 1 && b !== 11) return 'власник';
  if (a >= 2 && a <= 4 && (b < 10 || b >= 20)) return 'власники';
  return 'власників';
}

// Розшифровка помилок RPC у людську мову.
function ccErr(error) {
  const m = (error.message || '') + ' ' + (error.details || '') + ' ' + (error.hint || '');
  if (m.includes('EMAIL_NOT_FOUND')) return 'Жителя з таким email не знайдено (він має бути зареєстрований у додатку)';
  if (m.includes('EMPTY_NAME'))      return 'Вкажи назву спільноти';
  if (m.includes('NOT_ADMIN'))       return 'Немає прав адміна';
  if (m.includes('NO_OWNER'))        return 'Признач хоча б одного власника';
  return 'Помилка: ' + (error.message || 'невідома');
}

// Рядок спільноти у списку (аватар · назва · тема/власники · дії · стрілки порядку).
// ── ОФІЦІЙНА ГАЛОЧКА (09.08, замовлення Вови) ─────────────────────────
// «Додай можливість для призначення синьої галочки з адмінки спільнотам та певним
// користувачам… просто буде користувач Олександр Прендецький, це голова міської
// ради — йому треба додати офіційну галочку, щоб користувачі розуміли, що це він».
//
// 🛑 НЕ ПЛУТАТИ З `trusted`. Той означає «підтверджений житель» і дає
// автопублікацію оголошень без модерації; його має 1 профіль з 11 і ставиться він
// не вручну. Галочка — окрема колонка `official`, і саме тому в списку людей
// нижче показані ОБИДВІ позначки різними значками: інакше адмін не бачив би, що
// саме він міняє.
//
// 🔑 Чому через RPC, а не `update`: право на колонку `official` відібране в усіх
// клієнтських ролей — а адмінка ходить у базу звичайним Google-входом, тобто
// теж `authenticated`. Пряме `update` не пройшло б навіть у Вови. Сторож
// `is_admin()` живе ВСЕРЕДИНІ `admin_set_official`.
const officialTick = (on) => on
  ? ' <span title="Офіційний акаунт" style="display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:#1D74E8;color:#fff;font-size:10px;font-weight:800;vertical-align:middle">✓</span>'
  : '';

const officialBtn = (kind, id, on) =>
  `<button class="btn" data-official-kind="${kind}" data-official-id="${escapeHtml(String(id))}"
     data-official-value="${on ? '0' : '1'}" style="padding:5px 10px;font-size:13px">
     ${on ? '✓ Зняти галочку' : '✓ Зробити офіційним'}</button>`;

// Один обробник на обидва списки (люди і спільноти) — щоб копії не розійшлись.
function bindOfficialButtons(el) {
  el.querySelectorAll('[data-official-kind]').forEach(b => b.addEventListener('click', async () => {
    const kind = b.dataset.officialKind;
    const id   = b.dataset.officialId;
    const val  = b.dataset.officialValue === '1';
    b.disabled = true;
    const prev = b.textContent;
    b.textContent = 'Зберігаю…';
    const { error } = await supa.rpc('admin_set_official', { p_kind: kind, p_id: id, p_value: val });
    if (error) {
      b.disabled = false; b.textContent = prev;
      // Машинні коди з бази → людський текст. База не має вирішувати, якою мовою
      // говорити з людиною (той самий підхід, що в скаргах).
      const raw = String(error.message || error);
      if (raw.includes('official_not_admin')) return showToast('Це може робити лише адмін', 4000);
      if (raw.includes('official_not_found')) return showToast('Запис не знайдено — онови сторінку', 4000);
      return showToast('Не вдалося: ' + raw, 5000);
    }
    showToast(val ? 'Галочку поставлено ✓' : 'Галочку знято');
    if (kind === 'page') { await loadAll(); renderApp(); }
    else { await loadPeople(peopleQuery); renderApp(); }
  }));
}

function ccRow(p, i) {
  const n = ownerCounts[p.id] || 0;
  const av = p.avatar_url
    ? `<img src="${escapeHtml(p.avatar_url)}" style="width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none">`
    : `<div style="width:44px;height:44px;border-radius:50%;background:#eee;display:flex;align-items:center;justify-content:center;flex:none;color:#999;font-weight:700">${escapeHtml((p.name || '?').slice(0, 1).toUpperCase())}</div>`;
  const first = i === 0, last = i === communities.length - 1;
  return `<article class="card" style="display:flex;align-items:center;gap:12px">
    ${av}
    <div style="flex:1;min-width:0">
      <div style="font-weight:600">${escapeHtml(p.name)}${officialTick(p.official)}${p.is_system ? ' <span class="badge" style="background:#e0e0e0;color:#555">системна</span>' : ''}</div>

      <button class="btn" data-cc-move="up"   data-cc-id="${p.id}" ${first ? 'disabled' : ''} style="padding:4px 9px${first ? ';opacity:.3' : ''}">⬆</button>
      <button class="btn" data-cc-move="down" data-cc-id="${p.id}" ${last ? 'disabled' : ''} style="padding:4px 9px${last ? ';opacity:.3' : ''}">⬇</button>
    </div>
  </article>`;
}

async function moveCommunity(id, dir) {
  const idx = communities.findIndex(p => p.id === id);
  if (idx === -1) return;
  const swapIdx = dir === 'up' ? idx - 1 : idx + 1;
  if (swapIdx < 0 || swapIdx >= communities.length) return;
  const a = communities[idx], b = communities[swapIdx];
  let sa = a.sort_order, sb = b.sort_order;
  if (sa === sb) { sa = idx + 1; sb = swapIdx + 1; }   // старі дані (0/0) — рознести за індексом
  const [r1, r2] = await Promise.all([
    supa.from('pages').update({ sort_order: sb }).eq('id', a.id),
    supa.from('pages').update({ sort_order: sa }).eq('id', b.id),
  ]);
  if (r1.error || r2.error) return showToast('Не вдалося змінити порядок', 3500);
  await loadAll(); renderApp();
}

async function deleteCommunity(id, name) {
  if (!confirm(`Видалити спільноту «${name}»?\n\nРАЗОМ З НЕЮ НАЗАВЖДИ зникнуть УСІ її пости, коментарі, лайки та підписки. Це не можна відмінити.`)) return;
  const { error } = await supa.from('pages').delete().eq('id', id);
  if (error) return showToast('Не вдалося видалити: ' + error.message, 4500);
  showToast('Спільноту видалено');
  communityEdit = null;
  await loadAll(); renderApp();
}

    const btn = document.getElementById('cc-submit');
    btn.disabled = true; btn.textContent = 'Створюю…';

    btn.disabled = false; btn.textContent = 'Створити спільноту';

  el.querySelectorAll('[data-cc-edit]').forEach(b => b.addEventListener('click', () => { communityEdit = +b.dataset.ccEdit; renderApp(); }));
  el.querySelectorAll('[data-cc-del]').forEach(b => b.addEventListener('click', () => deleteCommunity(+b.dataset.ccDel, b.dataset.ccName)));
