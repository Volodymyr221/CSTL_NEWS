// ── TAB: Збори коштів ─────────────────────────────────────────────────
//
// 🔴 НАВІЩО ЦЕЙ РОЗДІЛ (замовлення Вови 17.08). До нього збори лежали у файлі
// `data/fundraisers.json` у git: створити збір міг ЛИШЕ Вова і лише через
// GitHub. Це працювало, поки збір був один, і ставало вузьким місцем далі —
// зокрема тому, що передати цю роботу іншій людині було неможливо.
//
// 🔑 РОЗДІЛ РОБИТЬ ДВІ РІЗНІ РЕЧІ, І ВОНИ НАВМИСНО НА ОДНОМУ ЕКРАНІ:
//   • ЗАЯВКИ  — те, що надіслали жителі. Тут ухвалюють рішення.
//   • ЗБОРИ   — те, що вже видно на головній. Тут керують показом.
// Розводити їх по двох розділах означало б розірвати один робочий процес
// («прийшла заявка → подзвонив → схвалив → бачу збір») на два екрани.
//
// ⚠️ ЗАЯВКИ СТОЯТЬ ПЕРШИМИ. Вони єдине, що ЧЕКАЄ на людину; збори просто є.
// Той самий принцип, що в «Скаргах»: угорі те, що вимагає дії.

const FUND_KIND_LABEL = {
  military:     'Для захисників',
  humanitarian: 'Гуманітарний',
  community:    'Для громади',
};
const FREQ_STATUS_LABEL = {
  new:       'Нова',
  contacted: 'Звʼязались',
  approved:  'Схвалено',
  rejected:  'Відхилено',
};

// Сума словами для списку. `toLocaleString` дає нерозривні пробіли між тисячами.
const fundMoney = n => (Number.isFinite(Number(n)) && Number(n) > 0)
  ? Number(n).toLocaleString('uk-UA') + ' ₴' : '—';

// Фото збору. Той самий бакет, що в спільнот і оголошень — заводити окремий
// заради одного розділу немає причини.
async function uploadFundPhoto(file) {
  const safe = (file.name || 'img').replace(/[^\w.\-]/g, '_');
  const path = `fundraisers/${currentUser.id}/${Date.now()}_${safe}`;
  const { error } = await supa.storage.from('community-photos').upload(path, file, { upsert: false });
  if (error) { showToast('Не вдалося завантажити фото: ' + error.message, 4000); return null; }
  const { data } = supa.storage.from('community-photos').getPublicUrl(path);
  return data?.publicUrl || null;
}

// Людська мова замість тексту з бази. 🔑 Ловимо ІМЕНА ОБМЕЖЕНЬ, а не текст
// помилки: текст Postgres міняє між версіями, назва `check` — ні.
function fundErr(error) {
  const m = `${error?.message || ''} ${error?.details || ''} ${error?.hint || ''}`;
  if (m.includes('url_https'))  return 'Посилання на банку має починатися з https://';
  if (m.includes('title_ok'))   return 'Назва — від 3 до 120 символів';
  if (m.includes('org_ok'))     return 'Поле «Хто збирає» — від 2 до 80 символів';
  if (m.includes('goal_ok'))    return 'Ціль має бути додатнім числом';
  if (m.includes('kind_ok'))    return 'Невідома категорія';
  if (m.includes('note_ok'))    return 'Опис задовгий — до 400 символів';
  if (m.includes('row-level'))  return 'Немає прав. Збори створює лише адмін.';
  return error?.message || 'Помилка';
}

// Форма створення / редагування. 🔑 ОДНА форма на обидві дії: різниця лише в
// тому, чи є `fundDraft.id`. Дві окремі форми розійшлись би по полях — а тут
// саме поля і є домовленістю з базою та заявкою (див. `fundraiser_field_parity`).
function fundFormHtml() {
  const d = fundDraft || {};
  const редагуємо = !!d.id;
  return `
    <form class="add-form" id="fund-form">
      <div class="add-form-title">${редагуємо ? '✎ Редагувати збір' : '+ Новий збір'}</div>
      <input class="input" id="fund-title" type="text" maxlength="120" required
             placeholder="Назва збору (наприклад: «FPV-дрони для 14 ОМБр»)" value="${escapeHtml(d.title || '')}">
      <input class="input" id="fund-org" type="text" maxlength="80" required
             placeholder="Хто збирає (обовʼязково — без цього збір не показується)" value="${escapeHtml(d.org || '')}">
      <input class="input" id="fund-url" type="url" required
             placeholder="https://send.monobank.ua/jar/..." value="${escapeHtml(d.url || '')}">
      <textarea class="textarea" id="fund-note" maxlength="400"
                placeholder="Короткий опис — на картці видно 2 рядки">${escapeHtml(d.note || '')}</textarea>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <input class="input" id="fund-goal" type="number" min="1" step="1" style="flex:1 1 140px"
               placeholder="Ціль, ₴ (не обовʼязково)" value="${d.goal ?? ''}">
        <select class="input" id="fund-kind" style="flex:1 1 160px">
          ${Object.entries(FUND_KIND_LABEL).map(([k, v]) =>
            `<option value="${k}"${(d.kind || 'community') === k ? ' selected' : ''}>${v}</option>`).join('')}
        </select>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <input class="input" id="fund-until" type="date" style="flex:1 1 150px" value="${d.until || ''}">
        <input class="input" id="fund-place" type="text" style="flex:1 1 150px" maxlength="60"
               placeholder="Звідки збір (Олика)" value="${escapeHtml(d.place || '')}">
      </div>
      <div style="font-size:12px;color:#777;margin:-2px 0 2px">
        Дата — до якої збір актуальний. Після неї збір ще 7 днів видно з написом
        «Збір завершено», потім зникає сам. Порожньо = безстроково.
      </div>
      <label style="font-size:13px;color:#555">Фото (горизонтальне, 16:9)
        <input class="input" id="fund-photo" type="file" accept="image/*">
      </label>
      <div id="fund-photo-prev">${d.photo ? `<img src="${escapeHtml(d.photo)}" style="height:90px;border-radius:8px;object-fit:cover;display:block;margin:6px 0">` : ''}</div>
      <label style="font-size:13px;color:#555;display:flex;align-items:center;gap:8px;cursor:pointer">
        <input type="checkbox" id="fund-verified" style="width:16px;height:16px"${d.verified ? ' checked' : ''}>
        Позначка «перевірено» — ставити, лише якщо збір справді перевірено
      </label>
      <div style="display:flex;gap:8px">
        <button class="btn btn--primary" type="submit">${редагуємо ? 'Зберегти' : 'Створити збір'}</button>
        ${редагуємо ? '<button class="btn" type="button" id="fund-cancel">Скасувати</button>' : ''}
      </div>
    </form>`;
}

function renderFundraisers(el) {
  const лічильники = {
    new:       fundRequests.filter(r => r.status === 'new').length,
    contacted: fundRequests.filter(r => r.status === 'contacted').length,
    approved:  fundRequests.filter(r => r.status === 'approved').length,
    rejected:  fundRequests.filter(r => r.status === 'rejected').length,
  };
  const заявки = fundRequests.filter(r => r.status === fundReqFilter);
  const сьогодні = new Date().toISOString().slice(0, 10);

  el.innerHTML = `
    <div class="section-title">Заявки від жителів</div>
    <!-- ⚠️ Фільтр зроблено ТИМИ САМИМИ класами, що у «Скаргах» (btn / btn--ghost),
         а не власними: своя пара класів у розділі означала б, що дві однакові
         на вигляд смужки живуть різним життям і розʼїдуться при першій же
         правці стилів.
         🛑 ЗВОРОТНІ ЛАПКИ В ЦЬОМУ КОМЕНТАРІ ЗАБОРОНЕНІ: він лежить УСЕРЕДИНІ
         шаблонного рядка, і пара лапок навколо назви класу закрила б рядок —
         решта розмітки стала б кодом. Саме так я тут і зламав адмінку 17.08:
         сторінка застигала на «Завантаження…», а перевірка синтаксису мовчала.
         Виправляючи це, я вжив лапки ще раз — у самому попередженні. -->
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
      ${Object.entries(FREQ_STATUS_LABEL).map(([k, v]) =>
        `<button class="btn${fundReqFilter === k ? '' : ' btn--ghost'}" data-freq-filter="${k}">${v} ${лічильники[k]}</button>`).join('')}
    </div>
    ${!fundRequests.length
      ? '<div class="empty">Заявок ще немає. Кнопка «Запропонувати збір» у застосунку пише сюди.</div>'
      : (!заявки.length ? '<div class="empty">У цій категорії порожньо</div>' : заявки.map(r => `
      <article class="card">
        <div class="card-meta">
          <span class="badge">${FREQ_STATUS_LABEL[r.status] || r.status}</span>
          <span class="badge">${FUND_KIND_LABEL[r.kind] || r.kind}</span>
          <span style="font-size:12px;color:#999;margin-left:auto">${escapeHtml(formatDate(r.created_at))}</span>
        </div>
        <div style="font-weight:600;margin-bottom:4px">${escapeHtml(r.title)}</div>
        <p class="card-text">${escapeHtml(r.note || '—')}</p>
        <div style="font-size:13px;color:#444;line-height:1.6;margin:6px 0">
          Збирає: <b>${escapeHtml(r.org)}</b><br>
          Банка: <a href="${escapeHtml(r.url)}" target="_blank" rel="noopener">${escapeHtml(r.url)}</a><br>
          Ціль: ${fundMoney(r.goal)}${r.until ? ' · до ' + escapeHtml(r.until) : ''}${r.place ? ' · ' + escapeHtml(r.place) : ''}
        </div>
        <!-- 🔴 КОНТАКТ — ГОЛОВНЕ В ЗАЯВЦІ, тому окремою плашкою, а не рядком
             у загальному тексті: збір публікується лише після живої розмови. -->
        <div style="background:#F3F5F8;border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.6">
          📞 <b>${escapeHtml(r.contact_name)}</b> · <a href="tel:${escapeHtml(r.contact_phone)}">${escapeHtml(r.contact_phone)}</a>
          <br><span style="color:#777">акаунт: ${escapeHtml(r.author_name || '—')}</span>
        </div>
        ${r.admin_note ? `<p class="card-text" style="color:#777">Нотатка: ${escapeHtml(r.admin_note)}</p>` : ''}
        <div class="card-actions">
          ${r.status === 'approved'
            ? `<span style="font-size:13px;color:#2a7">✓ Схвалено — збір #${r.fundraiser_id ?? '—'}</span>`
            : `<button class="btn btn--primary" data-freq-approve="${r.id}">✓ Схвалити і створити збір</button>
               ${r.status === 'new' ? `<button class="btn" data-freq-contacted="${r.id}">📞 Звʼязались</button>` : ''}
               <button class="btn btn--delete" data-freq-reject="${r.id}">Відхилити</button>`}
        </div>
      </article>`).join(''))}

    <div class="section-title" style="margin-top:22px">Збори на головній (${fundraisers.length})</div>
    ${fundFormHtml()}
    ${!fundraisers.length ? '<div class="empty">Жодного збору. Блок на головній не показується.</div>' : fundraisers.map(f => {
      const завершено = f.until && f.until < сьогодні;
      return `
      <article class="card" style="${f.active ? '' : 'opacity:.6'}">
        <div class="card-meta">
          ${f.active ? '<span class="badge" style="background:#DFF3E4;color:#1d6b32">На головній</span>'
                     : '<span class="badge">Приховано</span>'}
          ${f.verified ? '<span class="badge" style="background:#E7EEFB;color:#24467e">Перевірено</span>' : ''}
          ${завершено ? '<span class="badge" style="background:#FBE9E7;color:#8a3226">Завершено</span>' : ''}
          <span class="badge">${FUND_KIND_LABEL[f.kind] || f.kind}</span>
          <span style="font-size:12px;color:#999;margin-left:auto">${escapeHtml(formatDate(f.created_at))}</span>
        </div>
        <div style="display:flex;gap:10px">
          ${f.photo ? `<img src="${escapeHtml(f.photo)}" style="width:72px;height:72px;border-radius:8px;object-fit:cover;flex:0 0 auto">` : ''}
          <div style="min-width:0">
            <div style="font-weight:600;margin-bottom:2px">${escapeHtml(f.title)}</div>
            <div style="font-size:13px;color:#555">${escapeHtml(f.org)} · ціль ${fundMoney(f.goal)}${f.until ? ' · до ' + escapeHtml(f.until) : ''}</div>
            <a href="${escapeHtml(f.url)}" target="_blank" rel="noopener" style="font-size:12px;word-break:break-all">${escapeHtml(f.url)}</a>
          </div>
        </div>
        <div class="card-actions">
          <button class="btn" data-fund-edit="${f.id}">✎ Редагувати</button>
          <button class="btn" data-fund-toggle="${f.id}">${f.active ? 'Сховати' : 'Показати'}</button>
          <button class="btn" data-fund-verify="${f.id}">${f.verified ? 'Зняти «перевірено»' : 'Позначити перевіреним'}</button>
          <button class="btn" data-fund-up="${f.id}">↑ Підняти</button>
          <button class="btn btn--delete" data-fund-delete="${f.id}">🗑 Видалити</button>
        </div>
      </article>`;
    }).join('')}
  `;

  // ── Фільтр заявок ──
  el.querySelectorAll('[data-freq-filter]').forEach(b => b.addEventListener('click', () => {
    fundReqFilter = b.dataset.freqFilter; renderFundraisers(el);
  }));

  // ── Схвалення. 🔑 Через RPC, а не двома запитами: атомарно, і поля
  //    копіюються НА СЕРВЕРІ — підмінити посилання на банку по дорозі не можна.
  el.querySelectorAll('[data-freq-approve]').forEach(b => b.addEventListener('click', async () => {
    if (!confirm('Схвалити заявку і створити збір?\n\nПозначку «перевірено» треба буде поставити окремо.')) return;
    b.disabled = true;
    const { data, error } = await supa.rpc('approve_fundraiser_request', { p_request_id: Number(b.dataset.freqApprove) });
    if (error) { b.disabled = false; return showToast(fundErr(error), 4000); }
    showToast('Збір створено ✓ (#' + data + ')');
    await loadAll(); renderApp();
  }));

  el.querySelectorAll('[data-freq-contacted]').forEach(b => b.addEventListener('click', async () => {
    const { error } = await supa.from('fundraiser_requests')
      .update({ status: 'contacted' }).eq('id', Number(b.dataset.freqContacted));
    if (error) return showToast(fundErr(error), 4000);
    await loadAll(); renderApp();
  }));

  el.querySelectorAll('[data-freq-reject]').forEach(b => b.addEventListener('click', async () => {
    const нотатка = prompt('Чому відхиляємо? (побачить лише команда)');
    if (нотатка === null) return;
    const { error } = await supa.from('fundraiser_requests')
      .update({ status: 'rejected', admin_note: нотатка || null, reviewed_at: new Date().toISOString() })
      .eq('id', Number(b.dataset.freqReject));
    if (error) return showToast(fundErr(error), 4000);
    await loadAll(); renderApp();
  }));

  // ── Форма збору ──
  const photoInput = document.getElementById('fund-photo');
  if (photoInput) photoInput.addEventListener('change', async e => {
    const file = e.target.files[0]; if (!file) return;
    const prev = document.getElementById('fund-photo-prev');
    if (prev) prev.textContent = 'Завантаження…';
    const url = await uploadFundPhoto(file);
    fundDraft = { ...(fundDraft || {}), photo: url };
    if (prev) prev.innerHTML = url
      ? `<img src="${url}" style="height:90px;border-radius:8px;object-fit:cover;display:block;margin:6px 0">`
      : '<span style="color:#c33">Не вдалося</span>';
  });

  const cancel = document.getElementById('fund-cancel');
  if (cancel) cancel.addEventListener('click', () => { fundDraft = null; renderFundraisers(el); });

  document.getElementById('fund-form').addEventListener('submit', async e => {
    e.preventDefault();
    const v = id => (document.getElementById(id)?.value || '').trim();
    const рядок = {
      title: v('fund-title'),
      org:   v('fund-org'),
      url:   v('fund-url'),
      note:  v('fund-note') || null,
      goal:  v('fund-goal') ? Number(v('fund-goal')) : null,
      kind:  v('fund-kind') || 'community',
      until: v('fund-until') || null,
      place: v('fund-place') || null,
      photo: (fundDraft && fundDraft.photo) || null,
      verified: !!document.getElementById('fund-verified')?.checked,
    };
    if (!рядок.title || !рядок.org || !рядок.url) return showToast('Назва, «хто збирає» і посилання обовʼязкові', 4000);
    const { error } = fundDraft && fundDraft.id
      ? await supa.from('fundraisers').update(рядок).eq('id', fundDraft.id)
      : await supa.from('fundraisers').insert(рядок);
    if (error) return showToast(fundErr(error), 4000);
    showToast(fundDraft && fundDraft.id ? 'Збережено ✓' : 'Збір створено ✓');
    fundDraft = null;
    await loadAll(); renderApp();
  });

  // ── Дії над зборами ──
  el.querySelectorAll('[data-fund-edit]').forEach(b => b.addEventListener('click', () => {
    fundDraft = fundraisers.find(f => f.id === Number(b.dataset.fundEdit)) || null;
    renderFundraisers(el);
    document.getElementById('fund-form')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }));

  el.querySelectorAll('[data-fund-toggle]').forEach(b => b.addEventListener('click', async () => {
    const f = fundraisers.find(x => x.id === Number(b.dataset.fundToggle)); if (!f) return;
    const { error } = await supa.from('fundraisers').update({ active: !f.active }).eq('id', f.id);
    if (error) return showToast(fundErr(error), 4000);
    await loadAll(); renderApp();
  }));

  el.querySelectorAll('[data-fund-verify]').forEach(b => b.addEventListener('click', async () => {
    const f = fundraisers.find(x => x.id === Number(b.dataset.fundVerify)); if (!f) return;
    // 🛑 Окрема дія, а не галочка «за компанію» при схваленні: схвалив = «ми це
    // пропустили», перевірив = «ми це перевірили». Позначка, яку клеять усім
    // підряд, знецінює слово, заради якого існує.
    if (!f.verified && !confirm('Позначити збір перевіреним?\n\nЦе означає, що ви особисто переконались у зборі й у людині.')) return;
    const { error } = await supa.from('fundraisers').update({ verified: !f.verified }).eq('id', f.id);
    if (error) return showToast(fundErr(error), 4000);
    await loadAll(); renderApp();
  }));

  // Підняти вгору = стати вищим за найвищий. Числа в полі ніхто не редагує
  // руками: «підняти» — це дія, а не значення.
  el.querySelectorAll('[data-fund-up]').forEach(b => b.addEventListener('click', async () => {
    const максимум = fundraisers.reduce((m, x) => Math.max(m, Number(x.sort_order) || 0), 0);
    const { error } = await supa.from('fundraisers')
      .update({ sort_order: максимум + 1 }).eq('id', Number(b.dataset.fundUp));
    if (error) return showToast(fundErr(error), 4000);
    showToast('Піднято вгору');
    await loadAll(); renderApp();
  }));

  el.querySelectorAll('[data-fund-delete]').forEach(b => b.addEventListener('click', async () => {
    // ⚠️ Питаємо саме про НАСЛІДОК, а не «ви впевнені?»: у зборів є «Сховати»,
    // і в дев'яти випадках із десяти людині потрібне саме воно.
    if (!confirm('Видалити збір НАЗАВЖДИ?\n\nЩоб просто прибрати його з головної, є кнопка «Сховати».')) return;
    const { error } = await supa.from('fundraisers').delete().eq('id', Number(b.dataset.fundDelete));
    if (error) return showToast(fundErr(error), 4000);
    showToast('Видалено');
    await loadAll(); renderApp();
  }));
}

// ── TAB 3: адміни ─────────────────────────────────────────────────────
// ── TAB: Спільноти (канали «Стрічки») ─────────────────────────────────
// Створення / порядок кружечків / видалення спільнот + керування власниками.
// База (RLS + RPC): scripts/supabase_pages_admin.sql. Форма — за зразком
// renderAdmins/renderArticleForm; аватар/банер — uploadCommunityImage (бакет
// community-photos, як uploadArticlePhoto). profiles закриті RLS, тому власник
// по email іде через RPC admin_create_community / admin_find_uid_by_email.
let ccDraft = { avatar_url: null, banner_url: null };

async function uploadCommunityImage(file) {
  const safe = (file.name || 'img').replace(/[^\w.\-]/g, '_');
  const path = `communities/${currentUser.id}/${Date.now()}_${safe}`;
  const { error } = await supa.storage.from('community-photos').upload(path, file, { upsert: false });
  if (error) { showToast('Не вдалося завантажити фото: ' + error.message, 4000); return null; }
  const { data } = supa.storage.from('community-photos').getPublicUrl(path);
  return data?.publicUrl || null;
}

// Прив'язати <input type=file> до прев'ю і зберегти URL у target[field].
function bindCommunityUpload(inputId, prevId, target, field, isAvatar) {
  const inp = document.getElementById(inputId);
  if (!inp) return;
  inp.addEventListener('change', async e => {
    const file = e.target.files[0]; if (!file) return;
    const prev = document.getElementById(prevId);
    if (prev) prev.innerHTML = 'Завантаження…';
    const url = await uploadCommunityImage(file);
    if (url) {
      target[field] = url;
      if (prev) prev.innerHTML = `<img src="${url}" style="height:${isAvatar ? 54 : 90}px;border-radius:${isAvatar ? '50%' : '8px'};object-fit:cover;display:block;margin:6px 0">`;
    } else if (prev) prev.innerHTML = '<span style="color:#c33">Не вдалося</span>';
  });
}

// Укр. відмінювання «власник» за кількістю.
function pluralOwners(n) {
  const a = n % 10, b = n % 100;
  if (a === 1 && b !== 11) return 'власник';
  if (a >= 2 && a <= 4 && (b < 10 || b >= 20)) return 'власники';
  return 'власників';
}

// Розшифровка помилок RPC у людську мову.
function ccErr(error) {
  const m = (error.message || '') + ' ' + (error.details || '') + ' ' + (error.hint || '');
  if (m.includes('EMAIL_NOT_FOUND')) return 'Жителя з таким email не знайдено (він має бути зареєстрований у додатку)';
  if (m.includes('EMPTY_NAME'))      return 'Вкажи назву спільноти';
  if (m.includes('NOT_ADMIN'))       return 'Немає прав адміна';
  if (m.includes('NO_OWNER'))        return 'Признач хоча б одного власника';
  return 'Помилка: ' + (error.message || 'невідома');
}

// Рядок спільноти у списку (аватар · назва · тема/власники · дії · стрілки порядку).
// ── ОФІЦІЙНА ГАЛОЧКА (09.08, замовлення Вови) ─────────────────────────
// «Додай можливість для призначення синьої галочки з адмінки спільнотам та певним
// користувачам… просто буде користувач Олександр Прендецький, це голова міської
// ради — йому треба додати офіційну галочку, щоб користувачі розуміли, що це він».
//
// 🛑 НЕ ПЛУТАТИ З `trusted`. Той означає «підтверджений житель» і дає
// автопублікацію оголошень без модерації; його має 1 профіль з 11 і ставиться він
// не вручну. Галочка — окрема колонка `official`, і саме тому в списку людей
// нижче показані ОБИДВІ позначки різними значками: інакше адмін не бачив би, що
// саме він міняє.
//
// 🔑 Чому через RPC, а не `update`: право на колонку `official` відібране в усіх
// клієнтських ролей — а адмінка ходить у базу звичайним Google-входом, тобто
// теж `authenticated`. Пряме `update` не пройшло б навіть у Вови. Сторож
// `is_admin()` живе ВСЕРЕДИНІ `admin_set_official`.
const officialTick = (on) => on
  ? ' <span title="Офіційний акаунт" style="display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:#1D74E8;color:#fff;font-size:10px;font-weight:800;vertical-align:middle">✓</span>'
  : '';

const officialBtn = (kind, id, on) =>
  `<button class="btn" data-official-kind="${kind}" data-official-id="${escapeHtml(String(id))}"
     data-official-value="${on ? '0' : '1'}" style="padding:5px 10px;font-size:13px">
     ${on ? '✓ Зняти галочку' : '✓ Зробити офіційним'}</button>`;

// Один обробник на обидва списки (люди і спільноти) — щоб копії не розійшлись.
function bindOfficialButtons(el) {
  el.querySelectorAll('[data-official-kind]').forEach(b => b.addEventListener('click', async () => {
    const kind = b.dataset.officialKind;
    const id   = b.dataset.officialId;
    const val  = b.dataset.officialValue === '1';
    b.disabled = true;
    const prev = b.textContent;
    b.textContent = 'Зберігаю…';
    const { error } = await supa.rpc('admin_set_official', { p_kind: kind, p_id: id, p_value: val });
    if (error) {
      b.disabled = false; b.textContent = prev;
      // Машинні коди з бази → людський текст. База не має вирішувати, якою мовою
      // говорити з людиною (той самий підхід, що в скаргах).
      const raw = String(error.message || error);
      if (raw.includes('official_not_admin')) return showToast('Це може робити лише адмін', 4000);
      if (raw.includes('official_not_found')) return showToast('Запис не знайдено — онови сторінку', 4000);
      return showToast('Не вдалося: ' + raw, 5000);
    }
    showToast(val ? 'Галочку поставлено ✓' : 'Галочку знято');
    if (kind === 'page') { await loadAll(); renderApp(); }
    else { await loadPeople(peopleQuery); renderApp(); }
  }));
}

async function moveCommunity(id, dir) {
  const idx = communities.findIndex(p => p.id === id);
  if (idx === -1) return;
  const swapIdx = dir === 'up' ? idx - 1 : idx + 1;
  if (swapIdx < 0 || swapIdx >= communities.length) return;
  const a = communities[idx], b = communities[swapIdx];
  let sa = a.sort_order, sb = b.sort_order;
  if (sa === sb) { sa = idx + 1; sb = swapIdx + 1; }   // старі дані (0/0) — рознести за індексом
  const [r1, r2] = await Promise.all([
    supa.from('pages').update({ sort_order: sb }).eq('id', a.id),
    supa.from('pages').update({ sort_order: sa }).eq('id', b.id),
  ]);
  if (r1.error || r2.error) return showToast('Не вдалося змінити порядок', 3500);
  await loadAll(); renderApp();
}

async function deleteCommunity(id, name) {
  if (!confirm(`Видалити спільноту «${name}»?\n\nРАЗОМ З НЕЮ НАЗАВЖДИ зникнуть УСІ її пости, коментарі, лайки та підписки. Це не можна відмінити.`)) return;
  const { error } = await supa.from('pages').delete().eq('id', id);
  if (error) return showToast('Не вдалося видалити: ' + error.message, 4500);
  showToast('Спільноту видалено');
  communityEdit = null;
  await loadAll(); renderApp();
}

// ── TAB: Люди (офіційна галочка) ──────────────────────────────────────
// 🔴 Розділу людей в адмінці не було взагалі — і зробити його «як усі інші» не
// вийшло б: політика `own profile read` пускає в `profiles` лише у ВЛАСНИЙ рядок,
// а адмінка ходить у базу звичайним Google-входом. Тому список дає RPC
// `admin_list_profiles` зі сторожем `is_admin()` усередині.
//
// ⚠️ Показуємо ДВІ різні позначки, і це не надмірність: `official` (синя галочка,
// «це справді та публічна особа») і `trusted` («підтверджений житель», дає
// автопублікацію без модерації). Їх уже раз сплутали — 02.08 галочка малювалась
// за `trusted`, і Вова її прибрав. Якщо не показати обидві, адмін не бачитиме,
// що саме він змінює.
async function loadPeople(q) {
  const { data, error } = await supa.rpc('admin_list_profiles', { p_query: q || null });
  if (error) {
    people = [];
    // fail-soft: міграцію ще не накатано → розділ каже про це прямо, а не мовчить.
    return String(error.message || error);
  }
  people = data || [];
  return null;
}

function personRow(p) {
  const nm = [p.name, p.surname].filter(Boolean).join(' ').trim() || '—';
  const av = p.avatar_url
    ? `<img src="${escapeHtml(p.avatar_url)}" style="width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none">`
    : `<div style="width:40px;height:40px;border-radius:50%;background:#eee;display:flex;align-items:center;justify-content:center;flex:none;color:#999;font-weight:700">${escapeHtml(nm.slice(0, 1).toUpperCase())}</div>`;
  const trusted = p.trusted
    ? ' <span class="badge" style="background:#C5E1A5;color:#2e5e1f">довірений</span>' : '';
  return `<article class="card" style="display:flex;align-items:center;gap:12px">
    ${av}
    <div style="flex:1;min-width:0">
      <div style="font-weight:600">${escapeHtml(nm)}${officialTick(p.official)}${trusted}</div>
      <div style="font-size:13px;color:#666;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(p.email || p.uid)}${p.settlement ? ' · ' + escapeHtml(p.settlement) : ''}</div>
      <div style="margin-top:6px">${officialBtn('profile', p.uid, p.official)}</div>
    </div>
  </article>`;
}

async function renderPeople(el) {
  el.innerHTML = '<p style="color:#999">Завантаження…</p>';
  const err = await loadPeople(peopleQuery);

  if (err) {
    el.innerHTML = `<article class="card"><div style="font-weight:600;margin-bottom:6px">Список людей недоступний</div>
      <div style="font-size:13px;color:#666">${escapeHtml(err)}</div>
      <div style="font-size:13px;color:#999;margin-top:8px">Схоже, міграцію офіційності ще не накатано — <code>scripts/supabase_official_badge.sql</code>.</div></article>`;
    return;
  }

  const officialCount = people.filter(p => p.official).length;
  el.innerHTML = `
    <form class="add-form" id="pp-form" style="margin-bottom:10px">
      <div class="add-form-title">Пошук жителя</div>
      <input class="input" id="pp-q" type="search" placeholder="Ім'я, прізвище або email" value="${escapeHtml(peopleQuery)}" autocomplete="off">

      <button class="btn btn--primary" type="submit">Знайти</button>
    </form>
    <div class="section-title">Жителі (${people.length})
      <span style="font-weight:400;color:#999;font-size:12px">· з галочкою: ${officialCount}</span></div>
    <div id="pp-list">${people.map(personRow).join('') || '<p style="color:#999">Нікого не знайдено.</p>'}</div>
  `;

  document.getElementById('pp-form').addEventListener('submit', (e) => {
    e.preventDefault();
    peopleQuery = document.getElementById('pp-q').value.trim();
    renderApp();
  });
  bindOfficialButtons(el);
}

async function renderCommunityEdit(el) {
  const p = communities.find(c => c.id === communityEdit);
  if (!p) { communityEdit = null; return renderCommunities(el); }
  el.innerHTML = '<p style="color:#999">Завантаження…</p>';
  const { data: owners } = await supa.rpc('admin_page_owners', { p_page_id: p.id });
  const ed = { avatar_url: p.avatar_url, banner_url: p.banner_url };

  el.innerHTML = `
    <button class="btn" id="cce-back" style="margin-bottom:12px">← До списку спільнот</button>
    <form class="add-form" id="cce-form">
      <div class="add-form-title">✏ Редагувати «${escapeHtml(p.name)}»</div>
      <input class="input" id="cce-name"  type="text" value="${escapeHtml(p.name)}" autocomplete="off">
      <input class="input" id="cce-theme" type="text" value="${escapeHtml(p.theme || '')}" placeholder="Тема / категорія" autocomplete="off">
      <div style="display:flex;gap:12px;margin:6px 0">
        <label style="flex:1;font-size:13px;color:#555">Аватар
          <div id="cce-avatar-prev">${p.avatar_url ? `<img src="${escapeHtml(p.avatar_url)}" style="height:54px;border-radius:50%;object-fit:cover;display:block;margin:6px 0">` : ''}</div>
          <input class="input" id="cce-avatar" type="file" accept="image/*">
        </label>
        <label style="flex:1;font-size:13px;color:#555">Банер
          <div id="cce-banner-prev">${p.banner_url ? `<img src="${escapeHtml(p.banner_url)}" style="height:54px;border-radius:8px;object-fit:cover;display:block;margin:6px 0">` : ''}</div>
          <input class="input" id="cce-banner" type="file" accept="image/*">
        </label>
      </div>
      <button class="btn btn--primary" type="submit">Зберегти зміни</button>
    </form>

    <div class="section-title">Власники</div>
    <div id="cce-owners">${(owners || []).map(o => cceOwnerRow(o)).join('') || '<p style="color:#c33">Нема власників — додай нижче</p>'}</div>
    <form class="add-form" id="cce-owner-form" style="margin-top:10px">
      <div class="add-form-title" style="font-size:14px">+ Додати власника</div>
      <input class="input" id="cce-owner-email" type="email" placeholder="email жителя" autocomplete="off">
      <button class="btn btn--primary" type="submit">Додати</button>
    </form>
  `;

  bindCommunityUpload('cce-avatar', 'cce-avatar-prev', ed, 'avatar_url', true);
  bindCommunityUpload('cce-banner', 'cce-banner-prev', ed, 'banner_url', false);

  document.getElementById('cce-back').addEventListener('click', () => { communityEdit = null; renderApp(); });

  document.getElementById('cce-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('cce-name').value.trim();
    if (!name) return showToast('Назва не може бути порожня');
    const patch = {
      name,
      theme: document.getElementById('cce-theme').value.trim() || null,
      avatar_url: ed.avatar_url, banner_url: ed.banner_url,
    };
    const { error } = await supa.from('pages').update(patch).eq('id', p.id);
    if (error) return showToast('Не вдалося зберегти: ' + error.message, 4500);
    showToast('Збережено ✓');
    await loadAll(); renderApp();
  });

  document.getElementById('cce-owner-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('cce-owner-email').value.trim();
    if (!email) return;
    const { data: uid, error } = await supa.rpc('admin_find_uid_by_email', { p_email: email });
    if (error) return showToast(ccErr(error), 4000);
    if (!uid) return showToast('Жителя з таким email не знайдено', 4000);
    const { error: e2 } = await supa.from('page_admins').insert({ page_id: p.id, uid, role: 'owner' });
    if (e2) {
      if (e2.code === '23505') return showToast('Цей житель вже власник');
      return showToast('Помилка: ' + e2.message, 4000);
    }
    showToast('Власника додано ✓');
    renderApp();   // communityEdit лишається → перерендер екрана з новим власником
  });

  el.querySelectorAll('[data-cco-del]').forEach(b => b.addEventListener('click', async () => {
    const uid = b.dataset.ccoDel;
    if (!confirm('Прибрати цього власника зі спільноти? Він втратить право писати від її імені.')) return;
    const { error } = await supa.from('page_admins').delete().eq('page_id', p.id).eq('uid', uid);
    if (error) return showToast('Помилка: ' + error.message, 4000);
    showToast('Прибрано');
    renderApp();
  }));
}

// Причина в тому, що ПОКАЗУВАТИ НЕ БУЛО ЧОГО: у `editor_users` не існувало ні
// `last_seen_at`, ні `disabled_at`. Тобто навіть якби екран був, він показав би
// імена без жодної підказки, що з цим доступом щось не так. Спершу дані —
// потім екран.
//
// 🛑 ВІДКЛИКАННЯ ДІЄ В БАЗІ, А НЕ ТУТ. `has_editor_perm()` і `is_team_member()`
// перевіряють `disabled_at is null`, тож відкликаний редактор втрачає і права,
// і сам вхід у кабінет. Ховати кнопки було б імітацією захисту — правило
// проєкту, яке не обговорюється.
//
// ⚠️ ЖОДНОЇ ПРЯМОЇ ПРАВКИ ТАБЛИЦІ ЗВІДСИ. Усі зміни йдуть через RPC
// (`admin_set_editor_perms`, `admin_set_editor_disabled`), бо саме вони пишуть
// у журнал `admin_audit_log` тією ж транзакцією. Клієнт у журнал дописати не
// може взагалі — журнал, у який пише той, чиї дії він фіксує, не журнал.
function renderAccess(el) {
  const адміни    = accessRows.filter(r => r.вид === 'admin');
  const редактори = accessRows.filter(r => r.вид === 'editor');
  const забутих   = accessRows.filter(забутий).length;

  const коли = (d) => d ? formatDate(d) : 'ЖОДНОГО РАЗУ';
  const днів = (d) => d ? Math.floor((Date.now() - new Date(d).getTime()) / 86400000) : null;

  const рядокРедактора = (r) => {
    const n = днів(r.last_seen_at);
    const тривога = забутий(r);
    const права = [
      r.can_create  ? 'створення' : null,
      r.can_publish ? 'публікація' : null,
      r.can_events  ? 'події' : null,
    ].filter(Boolean).join(' · ') || 'жодних';
    return `
      <article class="card" style="${тривога ? 'border-left:4px solid #e0922a' : ''}">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <div style="flex:1;min-width:180px">
            <div style="font-weight:600">${escapeHtml(r.name || '—')}</div>
            <div style="font-size:13px;color:#666">${escapeHtml(r.email || '')}</div>
          </div>
          ${r.disabled_at
            ? '<span class="badge" style="background:#ddd;color:#555">доступ відкликано</span>'
            : тривога
              ? `<span class="badge" style="background:#e0922a;color:#fff">не заходив ${n === null ? 'жодного разу' : n + ' дн.'}</span>`
              : '<span class="badge" style="background:#C5E1A5;color:#2e5e1f">діючий</span>'}
        </div>
        <div style="font-size:13px;color:#444;margin-top:8px">Права: ${escapeHtml(права)}</div>
        <div style="font-size:11px;color:#999;margin-top:3px">
          видано ${escapeHtml(коли(r.created_at))} · останній вхід у кабінет ${escapeHtml(коли(r.last_seen_at))}
          ${r.disabled_at ? ` · відкликано ${escapeHtml(коли(r.disabled_at))}${r.disabled_by ? ' (' + escapeHtml(r.disabled_by) + ')' : ''}` : ''}
        </div>
        <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
          ${r.disabled_at
            ? `<button class="btn" data-access-on="${escapeHtml(r.uid)}">↩︎ Повернути доступ</button>`
            : `<button class="btn btn--delete" data-access-off="${escapeHtml(r.uid)}">⛔ Відкликати доступ</button>`}
        </div>
      </article>`;
  };

  el.innerHTML = `
    ${забутих ? `
      <div class="card" style="background:#fff6e6;border-left:4px solid #e0922a">
        <b>Забутих доступів: ${забутих}</b>
        <div style="font-size:13px;color:#555;margin-top:4px">
          Діючі права в людей, які не відкривали кабінет понад ${ЗАБУТИЙ_ДНІВ} днів.
          Якщо людина більше не в команді — відклич доступ.
        </div>
      </div>` : ''}

    <div class="section-title">Адміністратори (${адміни.length})</div>
    <div style="font-size:13px;color:#666;margin:-6px 0 10px">
      Бачать усе. Керуються в розділі «Адміни».
    </div>
    ${адміни.map(r => `
      <article class="card">
        <div style="font-weight:600">${escapeHtml(r.name || '—')}</div>
        <div style="font-size:13px;color:#666">${escapeHtml(r.email || '')}</div>
        <div style="font-size:11px;color:#999;margin-top:3px">
          у команді з ${escapeHtml(коли(r.created_at))} · останній вхід ${escapeHtml(коли(r.last_seen_at))}
        </div>
      </article>`).join('')}

    <div class="section-title">Редактори (${редактори.length})</div>
    ${редактори.length
      ? редактори.map(рядокРедактора).join('')
      : '<div class="card" style="color:#666">Зараз доступу до кабінету не має ніхто, крім адміністраторів.</div>'}
  `;

  // 🛑 Відкликання — з підтвердженням. Це рівно та межа, яку тримає проєкт:
  // підтверджуємо незворотне і публічне, не підтверджуємо перегляд і фільтр.
  el.querySelectorAll('[data-access-off]').forEach(b => b.addEventListener('click', async () => {
    const uid = b.dataset.accessOff;
    const хто = accessRows.find(r => r.uid === uid);
    if (!confirm(`Відкликати доступ у «${хто?.email || uid}»?\n\nЛюдина одразу втратить право публікувати і сам вхід у кабінет.`)) return;
    b.disabled = true; b.textContent = 'Відкликаю…';
    const { error } = await supa.rpc('admin_set_editor_disabled', { p_uid: uid, p_disabled: true });
    // ⚠️ Стан НЕ міняємо оптимістично: «відкликано» на екрані при невдалому
    // запиті — це найгірше, що може показати саме цей розділ.
    if (error) { b.disabled = false; b.textContent = '⛔ Відкликати доступ'; showToast('Не вдалось: ' + error.message, 4000); return; }
    showToast('Доступ відкликано ✓');
    await loadAll(); renderApp();
  }));

  el.querySelectorAll('[data-access-on]').forEach(b => b.addEventListener('click', async () => {
    const uid = b.dataset.accessOn;
    b.disabled = true; b.textContent = 'Повертаю…';
    const { error } = await supa.rpc('admin_set_editor_disabled', { p_uid: uid, p_disabled: false });
    if (error) { b.disabled = false; b.textContent = '↩︎ Повернути доступ'; showToast('Не вдалось: ' + error.message, 4000); return; }
    showToast('Доступ повернено ✓');
    await loadAll(); renderApp();
  }));
}

function renderAdmins(el) {
  el.innerHTML = `
    <form class="add-form" id="admin-form">
      <div class="add-form-title">+ Додати адміна</div>
      <input class="input" id="adm-email" type="email" placeholder="email@example.com" required autocomplete="off">
      <input class="input" id="adm-name"  type="text"  placeholder="Імʼя (опційно)">
      <button class="btn btn--primary" type="submit">Додати</button>
    </form>

    <div class="section-title">Поточні адміни (${admins.length})</div>
    ${admins.map(a => `
      <article class="card" style="display:flex;align-items:center;gap:12px">
        <div style="flex:1">
          <div style="font-weight:600">${escapeHtml(a.name || '—')}</div>
          <div style="font-size:13px;color:#666">${escapeHtml(a.email)}</div>
          <div style="font-size:11px;color:#999;margin-top:3px">додано ${escapeHtml(formatDate(a.created_at))}</div>
        </div>
        ${a.email === currentUser.email
          ? '<span class="badge" style="background:#C5E1A5;color:#2e5e1f">це ви</span>'
          : `<button class="btn btn--delete" data-delete-admin="${escapeHtml(a.email)}">🗑 Прибрати</button>`}
      </article>
    `).join('')}
  `;

  document.getElementById('admin-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('adm-email').value.trim().toLowerCase();
    const name  = document.getElementById('adm-name').value.trim() || null;
    if (!email) return;
    const { error } = await supa.from('admins').insert({ email, name });
    if (error) {
      if (error.code === '23505') showToast('Ця пошта вже є у списку');
      else showToast('Помилка: ' + error.message, 4000);
      return;
    }
    showToast('Адмін доданий ✓');
    await loadAll(); renderApp();
  });

  el.querySelectorAll('[data-delete-admin]').forEach(b => b.addEventListener('click', async () => {
    const email = b.dataset.deleteAdmin;
    if (!confirm(`Прибрати ${email} зі списку адмінів?`)) return;
    const { error } = await supa.from('admins').delete().eq('email', email);
    if (error) return showToast('Помилка: ' + error.message, 4000);
    showToast('Прибрано');
    await loadAll(); renderApp();
  }));
}

// ── TAB 4: налаштування (зміна пароля) ────────────────────────────────
function renderSettings(el) {
  el.innerHTML = `
    <form class="add-form" id="pwd-form">
      <div class="add-form-title">🔒 Змінити пароль</div>
      <p style="font-size:13px;color:#666;margin-bottom:4px">
        Поточна пошта: <strong>${escapeHtml(currentUser.email)}</strong>
      </p>
      <input class="input" id="pwd-new" type="password" placeholder="Новий пароль (6+ символів)" required minlength="6" autocomplete="new-password">
      <input class="input" id="pwd-repeat" type="password" placeholder="Повторити пароль" required minlength="6" autocomplete="new-password">
      <button class="btn btn--primary" type="submit">Змінити пароль</button>
      <p style="font-size:12px;color:#888;margin-top:6px">
        Після зміни тебе залогуть і доведеться увійти з новим паролем.
      </p>
    </form>

    <div class="section-title" style="margin-top:24px">Про аккаунт</div>
    <article class="card">
      <div style="font-size:13px;color:#666">Email</div>
      <div style="font-weight:600;margin-bottom:8px">${escapeHtml(currentUser.email)}</div>
      <div style="font-size:13px;color:#666">Останній вхід</div>
      <div style="font-size:13px">${escapeHtml(formatDate(currentUser.last_sign_in_at))}</div>
    </article>

    <div class="section-title" style="margin-top:24px">Якщо забув пароль</div>
    <article class="card">
      <p style="font-size:13px;line-height:1.5;color:#555">
        Натисни «Вийти» зверху → на сторінці входу натисни <strong>«Забув пароль?»</strong>.
        На пошту прийде magic-link → клік → ти автоматично всередині →
        повернись у Налаштування і встанови новий пароль.
      </p>
      <p style="font-size:12px;color:#999;margin-top:8px">
        Альтернатива: у Supabase SQL Editor виконай UPDATE auth.users SET
        encrypted_password = crypt('новий', gen_salt('bf')) WHERE email = '...';
      </p>
    </article>
  `;

  document.getElementById('pwd-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const newPwd    = document.getElementById('pwd-new').value;
    const repeatPwd = document.getElementById('pwd-repeat').value;
    if (newPwd.length < 6) {
      return showToast('Пароль має бути 6+ символів');
    }
    if (newPwd !== repeatPwd) {
      return showToast('Паролі не співпадають');
    }
    const { error } = await supa.auth.updateUser({ password: newPwd });
    if (error) {
      return showToast('Помилка: ' + error.message, 4500);
    }
    showToast('Пароль змінено ✓ Перезавантажую…', 2500);
    setTimeout(async () => {
      await supa.auth.signOut();
      location.reload();
    }, 1500);
  });
}

// ── LOGOUT ────────────────────────────────────────────────────────────
window.supabase_logout = async () => {
  await supa.auth.signOut();
  location.reload();
};
document.getElementById('btn-logout').addEventListener('click', window.supabase_logout);

// «← На сайт» — повертає на index.html БЕЗ виходу з адмінки.
// Сесія Supabase лишається у localStorage, при наступному відкритті admin.html
// одразу всередині без введення пароля.
// location.replace (не href) — заміняє запис адмінки в історії браузера, тож
// свайпом-назад у додатку в адмінку більше НЕ потрапиш (Вова 24.07).
document.getElementById('btn-minimize').addEventListener('click', () => {
  window.location.replace('./');
});

// Старт
init();
</script>
