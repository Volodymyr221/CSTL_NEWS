// ── TAB: Люди (офіційна галочка) ──────────────────────────────────────
// 🔴 Розділу людей в адмінці не було взагалі — і зробити його «як усі інші» не
// вийшло б: політика `own profile read` пускає в `profiles` лише у ВЛАСНИЙ рядок,
// а адмінка ходить у базу звичайним Google-входом. Тому список дає RPC
// `admin_list_profiles` зі сторожем `is_admin()` усередині.
//
// ⚠️ Показуємо ДВІ різні позначки, і це не надмірність: `official` (синя галочка,
// «це справді та публічна особа») і `trusted` («підтверджений житель», дає
// автопублікацію без модерації). Їх уже раз сплутали — 02.08 галочка малювалась
// за `trusted`, і Вова її прибрав. Якщо не показати обидві, адмін не бачитиме,
// що саме він змінює.
async function loadPeople(q) {
  const { data, error } = await supa.rpc('admin_list_profiles', { p_query: q || null });
  if (error) {
    people = [];
    // fail-soft: міграцію ще не накатано → розділ каже про це прямо, а не мовчить.
    return String(error.message || error);
  }
  people = data || [];
  return null;
}

function personRow(p) {
  const nm = [p.name, p.surname].filter(Boolean).join(' ').trim() || '—';
  const av = p.avatar_url
    ? `<img src="${escapeHtml(p.avatar_url)}" style="width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none">`
    : `<div style="width:40px;height:40px;border-radius:50%;background:#eee;display:flex;align-items:center;justify-content:center;flex:none;color:#999;font-weight:700">${escapeHtml(nm.slice(0, 1).toUpperCase())}</div>`;
  const trusted = p.trusted
    ? ' <span class="badge" style="background:#C5E1A5;color:#2e5e1f">довірений</span>' : '';
  return `<article class="card" style="display:flex;align-items:center;gap:12px">
    ${av}
    <div style="flex:1;min-width:0">
      <div style="font-weight:600">${escapeHtml(nm)}${officialTick(p.official)}${trusted}</div>
      <div style="font-size:13px;color:#666;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(p.email || p.uid)}${p.settlement ? ' · ' + escapeHtml(p.settlement) : ''}</div>
      <div style="margin-top:6px">${officialBtn('profile', p.uid, p.official)}</div>
    </div>
  </article>`;
}

async function renderPeople(el) {
  el.innerHTML = '<p style="color:#999">Завантаження…</p>';
  const err = await loadPeople(peopleQuery);

  if (err) {
    el.innerHTML = `<article class="card"><div style="font-weight:600;margin-bottom:6px">Список людей недоступний</div>
      <div style="font-size:13px;color:#666">${escapeHtml(err)}</div>
      <div style="font-size:13px;color:#999;margin-top:8px">Схоже, міграцію офіційності ще не накатано — <code>scripts/supabase_official_badge.sql</code>.</div></article>`;
    return;
  }

  const officialCount = people.filter(p => p.official).length;
  el.innerHTML = `
    <form class="add-form" id="pp-form" style="margin-bottom:10px">
      <div class="add-form-title">Пошук жителя</div>
      <input class="input" id="pp-q" type="search" placeholder="Ім'я, прізвище або email" value="${escapeHtml(peopleQuery)}" autocomplete="off">
      <p style="font-size:12px;color:#999;margin:4px 0 8px">Порожньо → останні зареєстровані. Офіційні завжди вгорі списку.</p>
      <button class="btn btn--primary" type="submit">Знайти</button>
    </form>
    <div class="section-title">Жителі (${people.length})
      <span style="font-weight:400;color:#999;font-size:12px">· з галочкою: ${officialCount}</span></div>
    <div id="pp-list">${people.map(personRow).join('') || '<p style="color:#999">Нікого не знайдено.</p>'}</div>
  `;

  document.getElementById('pp-form').addEventListener('submit', (e) => {
    e.preventDefault();
    peopleQuery = document.getElementById('pp-q').value.trim();
    renderApp();
  });
  bindOfficialButtons(el);
}

// Рядок власника в екрані редагування.
function cceOwnerRow(o) {
  const roleBadge = o.role === 'owner'
    ? '<span class="badge" style="background:#C5E1A5;color:#2e5e1f">власник</span>'
    : '<span class="badge">адмін</span>';
  return `<article class="card" style="display:flex;align-items:center;gap:10px;padding:10px 12px">
    <div style="flex:1;min-width:0">
      <div style="font-weight:600">${escapeHtml(o.name || '—')} ${roleBadge}</div>
      <div style="font-size:13px;color:#666">${escapeHtml(o.email || o.uid)}</div>
    </div>
    <button class="btn btn--delete" data-cco-del="${escapeHtml(o.uid)}" style="padding:5px 10px;font-size:13px">🗑</button>
  </article>`;
}

async function renderCommunityEdit(el) {
  const p = communities.find(c => c.id === communityEdit);
  if (!p) { communityEdit = null; return renderCommunities(el); }
  el.innerHTML = '<p style="color:#999">Завантаження…</p>';
  const { data: owners } = await supa.rpc('admin_page_owners', { p_page_id: p.id });
  const ed = { avatar_url: p.avatar_url, banner_url: p.banner_url };

  el.innerHTML = `
    <button class="btn" id="cce-back" style="margin-bottom:12px">← До списку спільнот</button>
    <form class="add-form" id="cce-form">
      <div class="add-form-title">✏ Редагувати «${escapeHtml(p.name)}»</div>
      <input class="input" id="cce-name"  type="text" value="${escapeHtml(p.name)}" autocomplete="off">
      <input class="input" id="cce-theme" type="text" value="${escapeHtml(p.theme || '')}" placeholder="Тема / категорія" autocomplete="off">
      <div style="display:flex;gap:12px;margin:6px 0">
        <label style="flex:1;font-size:13px;color:#555">Аватар
          <div id="cce-avatar-prev">${p.avatar_url ? `<img src="${escapeHtml(p.avatar_url)}" style="height:54px;border-radius:50%;object-fit:cover;display:block;margin:6px 0">` : ''}</div>
          <input class="input" id="cce-avatar" type="file" accept="image/*">
        </label>
        <label style="flex:1;font-size:13px;color:#555">Банер
          <div id="cce-banner-prev">${p.banner_url ? `<img src="${escapeHtml(p.banner_url)}" style="height:54px;border-radius:8px;object-fit:cover;display:block;margin:6px 0">` : ''}</div>
          <input class="input" id="cce-banner" type="file" accept="image/*">
        </label>
      </div>
      <button class="btn btn--primary" type="submit">Зберегти зміни</button>
    </form>

    <div class="section-title">Власники</div>
    <div id="cce-owners">${(owners || []).map(o => cceOwnerRow(o)).join('') || '<p style="color:#c33">Нема власників — додай нижче</p>'}</div>
    <form class="add-form" id="cce-owner-form" style="margin-top:10px">
      <div class="add-form-title" style="font-size:14px">+ Додати власника</div>
      <input class="input" id="cce-owner-email" type="email" placeholder="email жителя" autocomplete="off">
      <button class="btn btn--primary" type="submit">Додати</button>
    </form>
  `;

  bindCommunityUpload('cce-avatar', 'cce-avatar-prev', ed, 'avatar_url', true);
  bindCommunityUpload('cce-banner', 'cce-banner-prev', ed, 'banner_url', false);

  document.getElementById('cce-back').addEventListener('click', () => { communityEdit = null; renderApp(); });

  document.getElementById('cce-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('cce-name').value.trim();
    if (!name) return showToast('Назва не може бути порожня');
    const patch = {
      name,
      theme: document.getElementById('cce-theme').value.trim() || null,
      avatar_url: ed.avatar_url, banner_url: ed.banner_url,
    };
    const { error } = await supa.from('pages').update(patch).eq('id', p.id);
    if (error) return showToast('Не вдалося зберегти: ' + error.message, 4500);
    showToast('Збережено ✓');
    await loadAll(); renderApp();
  });

  document.getElementById('cce-owner-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('cce-owner-email').value.trim();
    if (!email) return;
    const { data: uid, error } = await supa.rpc('admin_find_uid_by_email', { p_email: email });
    if (error) return showToast(ccErr(error), 4000);
    if (!uid) return showToast('Жителя з таким email не знайдено', 4000);
    const { error: e2 } = await supa.from('page_admins').insert({ page_id: p.id, uid, role: 'owner' });
    if (e2) {
      if (e2.code === '23505') return showToast('Цей житель вже власник');
      return showToast('Помилка: ' + e2.message, 4000);
    }
    showToast('Власника додано ✓');
    renderApp();   // communityEdit лишається → перерендер екрана з новим власником
  });

  el.querySelectorAll('[data-cco-del]').forEach(b => b.addEventListener('click', async () => {
    const uid = b.dataset.ccoDel;
    if (!confirm('Прибрати цього власника зі спільноти? Він втратить право писати від її імені.')) return;
    const { error } = await supa.from('page_admins').delete().eq('page_id', p.id).eq('uid', uid);
    if (error) return showToast('Помилка: ' + error.message, 4000);
    showToast('Прибрано');
    renderApp();
  }));
}

// ── TAB: Доступи ──────────────────────────────────────────────────────
// 🔴 20.08 — ЗАВЕДЕНО ПІСЛЯ РЕАЛЬНОЇ ДІРИ, а не «щоб було». Людина, яка пішла з
// команди 26.07, станом на 20.08 досі мала повні права публікувати від імені
// видання. Вона зайшла в кабінет РІВНО ОДИН раз — 09.07, того ж дня, коли їй
// видали доступ. Прибрати вдалось лише SQL-запитом.
//
// 🔑 ЧОМУ ЦЕ СТАЛОСЬ І ЩО САМЕ ЛІКУЄМО. Причина не в тому, що «немає екрана».
// Причина в тому, що ПОКАЗУВАТИ НЕ БУЛО ЧОГО: у `editor_users` не існувало ні
// `last_seen_at`, ні `disabled_at`. Тобто навіть якби екран був, він показав би
// імена без жодної підказки, що з цим доступом щось не так. Спершу дані —
// потім екран.
//
// 🛑 ВІДКЛИКАННЯ ДІЄ В БАЗІ, А НЕ ТУТ. `has_editor_perm()` і `is_team_member()`
// перевіряють `disabled_at is null`, тож відкликаний редактор втрачає і права,
// і сам вхід у кабінет. Ховати кнопки було б імітацією захисту — правило
// проєкту, яке не обговорюється.
//
// ⚠️ ЖОДНОЇ ПРЯМОЇ ПРАВКИ ТАБЛИЦІ ЗВІДСИ. Усі зміни йдуть через RPC
// (`admin_set_editor_perms`, `admin_set_editor_disabled`), бо саме вони пишуть
// у журнал `admin_audit_log` тією ж транзакцією. Клієнт у журнал дописати не
// може взагалі — журнал, у який пише той, чиї дії він фіксує, не журнал.
function renderAccess(el) {
  const адміни    = accessRows.filter(r => r.вид === 'admin');
  const редактори = accessRows.filter(r => r.вид === 'editor');
  const забутих   = accessRows.filter(забутий).length;

  const коли = (d) => d ? formatDate(d) : 'ЖОДНОГО РАЗУ';
  const днів = (d) => d ? Math.floor((Date.now() - new Date(d).getTime()) / 86400000) : null;

  const рядокРедактора = (r) => {
    const n = днів(r.last_seen_at);
    const тривога = забутий(r);
    const права = [
      r.can_create  ? 'створення' : null,
      r.can_publish ? 'публікація' : null,
      r.can_events  ? 'події' : null,
    ].filter(Boolean).join(' · ') || 'жодних';
    return `
      <article class="card" style="${тривога ? 'border-left:4px solid #e0922a' : ''}">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <div style="flex:1;min-width:180px">
            <div style="font-weight:600">${escapeHtml(r.name || '—')}</div>
            <div style="font-size:13px;color:#666">${escapeHtml(r.email || '')}</div>
          </div>
          ${r.disabled_at
            ? '<span class="badge" style="background:#ddd;color:#555">доступ відкликано</span>'
            : тривога
              ? `<span class="badge" style="background:#e0922a;color:#fff">не заходив ${n === null ? 'жодного разу' : n + ' дн.'}</span>`
              : '<span class="badge" style="background:#C5E1A5;color:#2e5e1f">діючий</span>'}
        </div>
        <div style="font-size:13px;color:#444;margin-top:8px">Права: ${escapeHtml(права)}</div>
        <div style="font-size:11px;color:#999;margin-top:3px">
          видано ${escapeHtml(коли(r.created_at))} · останній вхід у кабінет ${escapeHtml(коли(r.last_seen_at))}
          ${r.disabled_at ? ` · відкликано ${escapeHtml(коли(r.disabled_at))}${r.disabled_by ? ' (' + escapeHtml(r.disabled_by) + ')' : ''}` : ''}
        </div>
        <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
          ${r.disabled_at
            ? `<button class="btn" data-access-on="${escapeHtml(r.uid)}">↩︎ Повернути доступ</button>`
            : `<button class="btn btn--delete" data-access-off="${escapeHtml(r.uid)}">⛔ Відкликати доступ</button>`}
        </div>
      </article>`;
  };

  el.innerHTML = `
    ${забутих ? `
      <div class="card" style="background:#fff6e6;border-left:4px solid #e0922a">
        <b>Забутих доступів: ${забутих}</b>
        <div style="font-size:13px;color:#555;margin-top:4px">
          Діючі права в людей, які не відкривали кабінет понад ${ЗАБУТИЙ_ДНІВ} днів.
          Якщо людина більше не в команді — відклич доступ.
        </div>
      </div>` : ''}

    <div class="section-title">Адміністратори (${адміни.length})</div>
    <div style="font-size:13px;color:#666;margin:-6px 0 10px">
      Бачать усе. Керуються в розділі «Адміни».
    </div>
    ${адміни.map(r => `
      <article class="card">
        <div style="font-weight:600">${escapeHtml(r.name || '—')}</div>
        <div style="font-size:13px;color:#666">${escapeHtml(r.email || '')}</div>
        <div style="font-size:11px;color:#999;margin-top:3px">
          у команді з ${escapeHtml(коли(r.created_at))} · останній вхід ${escapeHtml(коли(r.last_seen_at))}
        </div>
      </article>`).join('')}

    <div class="section-title">Редактори (${редактори.length})</div>
    ${редактори.length
      ? редактори.map(рядокРедактора).join('')
      : '<div class="card" style="color:#666">Зараз доступу до кабінету не має ніхто, крім адміністраторів.</div>'}
  `;

  // 🛑 Відкликання — з підтвердженням. Це рівно та межа, яку тримає проєкт:
  // підтверджуємо незворотне і публічне, не підтверджуємо перегляд і фільтр.
  el.querySelectorAll('[data-access-off]').forEach(b => b.addEventListener('click', async () => {
    const uid = b.dataset.accessOff;
    const хто = accessRows.find(r => r.uid === uid);
    if (!confirm(`Відкликати доступ у «${хто?.email || uid}»?\n\nЛюдина одразу втратить право публікувати і сам вхід у кабінет.`)) return;
    b.disabled = true; b.textContent = 'Відкликаю…';
    const { error } = await supa.rpc('admin_set_editor_disabled', { p_uid: uid, p_disabled: true });
    // ⚠️ Стан НЕ міняємо оптимістично: «відкликано» на екрані при невдалому
    // запиті — це найгірше, що може показати саме цей розділ.
    if (error) { b.disabled = false; b.textContent = '⛔ Відкликати доступ'; showToast('Не вдалось: ' + error.message, 4000); return; }
    showToast('Доступ відкликано ✓');
    await loadAll(); renderApp();
  }));

  el.querySelectorAll('[data-access-on]').forEach(b => b.addEventListener('click', async () => {
    const uid = b.dataset.accessOn;
    b.disabled = true; b.textContent = 'Повертаю…';
    const { error } = await supa.rpc('admin_set_editor_disabled', { p_uid: uid, p_disabled: false });
    if (error) { b.disabled = false; b.textContent = '↩︎ Повернути доступ'; showToast('Не вдалось: ' + error.message, 4000); return; }
    showToast('Доступ повернено ✓');
    await loadAll(); renderApp();
  }));
}

function renderAdmins(el) {
  el.innerHTML = `
    <form class="add-form" id="admin-form">
      <div class="add-form-title">+ Додати адміна</div>
      <input class="input" id="adm-email" type="email" placeholder="email@example.com" required autocomplete="off">
      <input class="input" id="adm-name"  type="text"  placeholder="Імʼя (опційно)">
      <button class="btn btn--primary" type="submit">Додати</button>
    </form>

    <div class="section-title">Поточні адміни (${admins.length})</div>
    ${admins.map(a => `
      <article class="card" style="display:flex;align-items:center;gap:12px">
        <div style="flex:1">
          <div style="font-weight:600">${escapeHtml(a.name || '—')}</div>
          <div style="font-size:13px;color:#666">${escapeHtml(a.email)}</div>
          <div style="font-size:11px;color:#999;margin-top:3px">додано ${escapeHtml(formatDate(a.created_at))}</div>
        </div>
        ${a.email === currentUser.email
          ? '<span class="badge" style="background:#C5E1A5;color:#2e5e1f">це ви</span>'
          : `<button class="btn btn--delete" data-delete-admin="${escapeHtml(a.email)}">🗑 Прибрати</button>`}
      </article>
    `).join('')}
  `;

  document.getElementById('admin-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('adm-email').value.trim().toLowerCase();
    const name  = document.getElementById('adm-name').value.trim() || null;
    if (!email) return;
    const { error } = await supa.from('admins').insert({ email, name });
    if (error) {
      if (error.code === '23505') showToast('Ця пошта вже є у списку');
      else showToast('Помилка: ' + error.message, 4000);
      return;
    }
    showToast('Адмін доданий ✓');
    await loadAll(); renderApp();
  });

  el.querySelectorAll('[data-delete-admin]').forEach(b => b.addEventListener('click', async () => {
    const email = b.dataset.deleteAdmin;
    if (!confirm(`Прибрати ${email} зі списку адмінів?`)) return;
    const { error } = await supa.from('admins').delete().eq('email', email);
    if (error) return showToast('Помилка: ' + error.message, 4000);
    showToast('Прибрано');
    await loadAll(); renderApp();
  }));
}

// ── TAB 4: налаштування (зміна пароля) ────────────────────────────────
function renderSettings(el) {
  el.innerHTML = `
    <form class="add-form" id="pwd-form">
      <div class="add-form-title">🔒 Змінити пароль</div>
      <p style="font-size:13px;color:#666;margin-bottom:4px">
        Поточна пошта: <strong>${escapeHtml(currentUser.email)}</strong>
      </p>
      <input class="input" id="pwd-new" type="password" placeholder="Новий пароль (6+ символів)" required minlength="6" autocomplete="new-password">
      <input class="input" id="pwd-repeat" type="password" placeholder="Повторити пароль" required minlength="6" autocomplete="new-password">
      <button class="btn btn--primary" type="submit">Змінити пароль</button>
      <p style="font-size:12px;color:#888;margin-top:6px">
        Після зміни тебе залогуть і доведеться увійти з новим паролем.
      </p>
    </form>

    <div class="section-title" style="margin-top:24px">Про аккаунт</div>
    <article class="card">
      <div style="font-size:13px;color:#666">Email</div>
      <div style="font-weight:600;margin-bottom:8px">${escapeHtml(currentUser.email)}</div>
      <div style="font-size:13px;color:#666">Останній вхід</div>
      <div style="font-size:13px">${escapeHtml(formatDate(currentUser.last_sign_in_at))}</div>
    </article>

    <div class="section-title" style="margin-top:24px">Якщо забув пароль</div>
    <article class="card">
      <p style="font-size:13px;line-height:1.5;color:#555">
        Натисни «Вийти» зверху → на сторінці входу натисни <strong>«Забув пароль?»</strong>.
        На пошту прийде magic-link → клік → ти автоматично всередині →
        повернись у Налаштування і встанови новий пароль.
      </p>
      <p style="font-size:12px;color:#999;margin-top:8px">
        Альтернатива: у Supabase SQL Editor виконай UPDATE auth.users SET
        encrypted_password = crypt('новий', gen_salt('bf')) WHERE email = '...';
      </p>
    </article>
  `;

  document.getElementById('pwd-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const newPwd    = document.getElementById('pwd-new').value;
    const repeatPwd = document.getElementById('pwd-repeat').value;
    if (newPwd.length < 6) {
      return showToast('Пароль має бути 6+ символів');
    }
    if (newPwd !== repeatPwd) {
      return showToast('Паролі не співпадають');
    }
    const { error } = await supa.auth.updateUser({ password: newPwd });
    if (error) {
      return showToast('Помилка: ' + error.message, 4500);
    }
    showToast('Пароль змінено ✓ Перезавантажую…', 2500);
    setTimeout(async () => {
      await supa.auth.signOut();
      location.reload();
    }, 1500);
  });
}

// ── LOGOUT ────────────────────────────────────────────────────────────
window.supabase_logout = async () => {
  await supa.auth.signOut();
  location.reload();
};
document.getElementById('btn-logout').addEventListener('click', window.supabase_logout);

// «← На сайт» — повертає на index.html БЕЗ виходу з адмінки.
// Сесія Supabase лишається у localStorage, при наступному відкритті admin.html
// одразу всередині без введення пароля.
// location.replace (не href) — заміняє запис адмінки в історії браузера, тож
// свайпом-назад у додатку в адмінку більше НЕ потрапиш (Вова 24.07).
document.getElementById('btn-minimize').addEventListener('click', () => {
  window.location.replace('./');
});

// Старт
init();
