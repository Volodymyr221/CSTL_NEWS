# Конфіг сканера секретів — базові правила + allowlist ПУБЛІЧНИХ за дизайном значень.
# Кладеться в корінь репозиторію як .gitleaks.toml
[extend]
useDefault = true

[allowlist]
description = "Публічні за дизайном значення — не секрети"
regexes = [
  # Приклад: публічний ключ клієнта, захищений правами доступу на сервері.
  # Кожен запис ОБОВʼЯЗКОВО з коментарем, ЧОМУ це не секрет.
  # '''sb_publishable_[A-Za-z0-9_]+''',
]
paths = [
  # Згенеровані файли — дублюють уже перевірені вихідники
  # '''bundle\.js''',
]
