# supabase/config.toml — налаштування проєкту для Supabase CLI.
#
# 🔴 НАВІЩО ЗАВЕДЕНО (24.09.2026). Edge Functions до цього дня їхали в прод
# ТІЛЬКИ руками — ні воркфлову, ні конфігу в репозиторії не було. Наслідок
# заміряно того ж дня: звірка живого коду з репозиторієм показала розходження
# у ЧОТИРЬОХ функціях із восьми. Самі розбіжності виявились нешкідливими
# (вкорочені роздільники з рисок у коментарях, загублений апостроф, і один
# рядок `json()` з переставленими ключами `headers`, що нічого не міняє, бо
# `cors` не містить `Content-Type`) — але сам ФАКТ важливіший за зміст: якщо
# прод і репозиторій можуть розійтись непомітно, то наступного разу розійдеться
# не коментар.
#
# 🔑 Корінь не в неуважності, а в ШЛЯХУ: деплой через модель означає, що текст
# функції проходить через переписування. Єдиний спосіб зробити прод побайтовою
# копією репозиторію — везти файли інструментом, а не текстом. Саме це робить
# `.github/workflows/functions-deploy.yml` разом із цим файлом.
#
# ⚠️ `verify_jwt` тут — ЗНЯТО З ЖИВОГО ПРОДА 24.09, а не вигадано. Помилка в
# будь-якому рядку нижче або відкриває функцію стороннім, або глушить її
# зовсім (база не має чим показати токен людини й доводить себе секретом).
# 🛑 `send-bus-push` лишається `true` — це прямо записано в «НЕ ЧІПАТИ» NOW.md.

project_id = "uabyfecseqnemvcqhdem"

# ── Ті, кого кличе ЛЮДИНА або розклад (токен є) ─────────────────────────────
[functions.send-bus-push]
verify_jwt = true

[functions.send-chat-push]
verify_jwt = true

[functions.send-group-push]
verify_jwt = true

[functions.send-unanswered-push]
verify_jwt = true

[functions.ai-analytics-summary]
verify_jwt = true

[functions.nudge-parser]
verify_jwt = true

[functions.publish-now]
verify_jwt = true

# ── Ті, кого кличе САМА БАЗА з тригера (токена людини немає) ────────────────
# Вони доводять себе спільним секретом усередині тіла функції, тому перевірку
# токена вимкнено. Увімкнеш тут `true` — тригер отримає 401 і сповіщення
# мовчки перестануть ходити.
[functions.send-answer-push]
verify_jwt = false

[functions.send-comment-push]
verify_jwt = false

[functions.send-event-push]
verify_jwt = false

[functions.send-page-push]
verify_jwt = false
