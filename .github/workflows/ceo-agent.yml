# Агент CEO — щотижневий звіт про стан проєкту проти курсу.
#
# 🔴 НЕДІЛЯ, А НЕ ЩОДНЯ — пряме рішення Вови 20.09 («Раз на тиждень»).
# Щоденний звіт про проєкт, де за добу нічого не змінилось, привчає його не
# читати — і в потрібний день важливе буде пропущено.
#
# 🛑 Розклад у cron стоїть в UTC. 17:10 UTC — це 20:10 за Києвом у неділю:
# тиждень уже закінчився, а вечір вільний.
# ⚠️ Планові прогони GitHub Actions можуть запізнюватись на години під
# навантаженням (заміряно на парсері VOPAS: `*/30` фактично дає раз на ~2 год).
# Для тижневого звіту це не критично, але обіцяти точну годину не можна.

name: CEO agent

on:
  workflow_dispatch:
  schedule:
    - cron: '10 17 * * 0'   # неділя, 20:10 за Києвом

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 🔑 збирач фактів рахує коміти за 7 днів

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run CEO agent
        env:
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
          CEO_MAX_MONTH_USD:     '5.0'
        run: python3 scripts/ceo_agent.py

      # 🔴 КРОК 5 — ЗАВДАННЯ ЧЕРЕЗ PR, А НЕ ПРЯМО В РЕЄСТР.
      # Вова: «хай зводить». Агент справді складає пропозиції — але заводить їх
      # окремою гілкою і PR, щоб рішення лишалось за людиною. Реєстр, наполовину
      # заповнений агентом, перестають читати, і ми полагодили б забування ціною
      # уваги.
      - name: Propose tasks (PR)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess, datetime
          f = pathlib.Path('data/ceo_tasks_proposed.json')
          if not f.exists():
              print('пропозицій немає'); raise SystemExit(0)
          д = json.loads(f.read_text(encoding='utf-8'))
          зав = д.get('завдання') or []
          if not зав:
              print('агент нічого не запропонував'); raise SystemExit(0)
          реєстр = pathlib.Path('CSTL NEWS VOVA/NEVYKONANI_ZAVDANNIA.md')
          текст = реєстр.read_text(encoding='utf-8')
          дата = datetime.date.today().strftime('%d.%m')
          блок = '\n'.join(f'| 🤖 {дата} | {з} | ⏸ запропонував агент CEO, чекає рішення |' for з in зав)
          # Дописуємо в кінець — рішення, куди саме, ухвалює людина в PR.
          реєстр.write_text(текст + f'\n\n### 🤖 Пропозиції агента CEO ({дата})\n\n'
                            '| коли | що | стан |\n|---|---|---|\n' + блок + '\n', encoding='utf-8')
          гілка = f"ceo/tasks-{datetime.date.today().isoformat()}"
          subprocess.run(['git','config','user.name','ceo-agent-bot'], check=True)
          subprocess.run(['git','config','user.email','ceo-agent@cstl-news.local'], check=True)
          subprocess.run(['git','checkout','-B',гілка], check=True)
          subprocess.run(['git','add','CSTL NEWS VOVA/NEVYKONANI_ZAVDANNIA.md'], check=True)
          subprocess.run(['git','-c','commit.gpgsign=false','commit','-m',
                          f'docs(реєстр): {len(зав)} пропозицій агента CEO'], check=True)
          subprocess.run(['git','push','-u','origin',гілка,'--force'], check=True)
          subprocess.run(['gh','pr','create','--base','main','--head',гілка,
                          '--title',f'Пропозиції агента CEO — {дата}',
                          '--body','Агент CEO запропонував занести це в реєстр невиконаного.\n\n'
                                   'Рішення за Вовою: змерджити, поправити або закрити.\n\n'
                                   '---\n_Generated by [Claude Code](https://claude.ai/code)_'], check=False)
          PY

      - name: Commit spend ledger
        run: |
          if [ -n "$(git status --porcelain data/ceo_spend.json)" ]; then
            git config user.name  "ceo-agent-bot"
            git config user.email "ceo-agent@cstl-news.local"
            git add data/ceo_spend.json
            git -c commit.gpgsign=false commit -m "auto(ceo): витрати агента $(date -u +'%d.%m %H:%M UTC')"
            for i in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort 2>/dev/null || true
              sleep 3
            done
            # 🛑 Чесний червоний замість тихого зеленого — той самий урок, що в парсері VOPAS.
            echo "❌ витрати не доїхали в main"; exit 1
          fi
