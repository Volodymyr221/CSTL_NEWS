# ============================================================================
# ВАРТОВИЙ ЖИВОГО ШАРУ ДАНИХ — чи відповідає застосунку його база
# ============================================================================
#
# 🔴 ЗАРАДИ ЧОГО (ніч на 22.09.2026). Вова написав: «Чому додаток так довго став
# завантажувати вкладки? Та викинуло з особистого акаунту?» — і це був ЄДИНИЙ
# спосіб, яким ми про це дізнались. Шар даних Supabase на той момент уже лежав:
#
#   • REST віддавав `PGRST002` («Could not query the database for the schema
#     cache») — 5 запитів із 5;
#   • продовження сесії висіло 10.0 · 11.8 · 12.5 · 16.6 · 29.0 секунди і
#     закінчувалось 504 — саме це й викинуло Вову з акаунту;
#   • вхід через Google висів 38.6 секунди.
#
# 📐 КОРІНЬ, знайдений у `pg_stat_activity`: запит `SELECT name FROM
# pg_timezone_names`, яким PostgREST збирає довідник схеми, тривав **40 секунд**
# при стелі ролі `authenticator` у 8 секунд. Його обривало щоразу (у журналі
# Postgres — 44 рази «canceling statement due to statement timeout»), тож
# довідник не збирався ніколи й API відповідало 503 по колу. Заразом голодували
# завдання `pg_cron` (по 67 зривів старту в `job 4` і `job 5`).
#
# 🔑 ЩО РОБИТЬ ЦЕЙ ФАЙЛ. Нічого не лагодить — лише НЕ ДАЄ ПОМОВЧАТИ. Раз на
# 15 хвилин питає обидві двері застосунку (дані й вхід) і, якщо вони зачинені,
# ЧЕРВОНИТЬ прогін. GitHub надсилає власнику листа про впалий воркфлов — тобто
# про поломку ми дізнаємось раніше за жителя, а не від нього.
#
# 🛑 Три спроби з паузами, а не одна: одиничний збій по дорозі — це не аварія,
# і будити людину через нього означало б навчити її не читати ці листи.
# ⚠️ Ключі тут НЕ потрібні: `SUPABASE_ANON_KEY` публічний (він лежить у коді
# застосунку, його бачить кожен браузер). Секретів цей файл не торкається.
# ============================================================================
name: Health check

on:
  schedule:
    # 🔴 ЯВНІ ХВИЛИНИ, А НЕ `*/15` — І ЦЕ ЗАМІРЯНО, НЕ СМАК (22.09).
    # Перша редакція стояла на `*/15` і за **4.5 години не дала ЖОДНОГО
    # прогону**, хоч воркфлов зареєстрований і `state: active`. Інші розклади
    # репозиторію в цей самий час ішли справно (новини 03:47 · 04:47 · 05:47 ·
    # 06:47 · 07:47).
    # 📐 Різниця видно в сусідніх файлах, і проєкт це вже знав ДВІЧІ:
    #   • `rss-parser.yml` — `0,30 * * * *` з коментарем «GitHub надійно виконує
    #     такі cron-jobs» — іде справно;
    #   • `vopas-parser.yml` — `*/30` — у журналі 21.09 записано: «обіцяє прогін
    #     кожні 30 хвилин, фактично раз на ~2 години»;
    #   • `cms-sync.yml` — `7,22,37,52` з припискою «кожні 15 хв, але не в чужі
    #     хвилини» — саме через це.
    # ➡️ Вартовий на кроковому синтаксисі — це вартовий, який спить. Хвилини
    #    вибрані вільні: 15 зайняв агент новин, 7/22/37/52 — синк кабінету,
    #    0/30 — парсери, 10 і 40 — агенти спільнот.
    - cron: '5,20,35,50 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 🛑 ЗМІННІ ОБОЛОНКИ — ЛИШЕ ЛАТИНИЦЕЮ. Перша редакція мала `КОД=`, `ЧАС=`,
      # `САЙТ=` — і обидва перші прогони впали з `command not found` та
      # `bad substitution`, не перевіривши НІЧОГО. Це гаряче правило проєкту
      # («кирилиця в змінних bash»), на яке я наступив того ж дня вдруге.
      # ⚠️ Усередині python-heredoc кирилиця законна і лишається — там це імена
      #    змінних Python, а не оболонки.
      - name: Опитати шар даних і вхід
        shell: bash
        run: |
          # Адресу й публічний ключ беремо З КОДУ ЗАСТОСУНКУ, а не з секретів:
          # вартовий мусить питати рівно те, що питає браузер жителя. Розійдуться —
          # він стерегтиме не ту двері.
          URL=$(grep -oP "SUPABASE_URL\s*=\s*'\K[^']+" src/core/supabase.js | head -1)
          KEY=$(grep -oP "SUPABASE_ANON_KEY\s*=\s*'\K[^']+" src/core/supabase.js | head -1)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "❌ не знайшов адресу або публічний ключ у src/core/supabase.js"
            echo "   (їх перейменували? тоді вартовий стереже порожнечу — виправити ТУТ)"
            exit 1
          fi

          probe() {
            # -m 20: чекати довше немає сенсу — житель стільки не чекає.
            CODE=$(curl -s -o /tmp/body.txt -m 20 -w '%{http_code}' \
                    -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
                    "$URL/rest/v1/fundraisers?select=id&limit=1" || echo 000)
            TIME_S=$(curl -s -o /dev/null -m 20 -w '%{time_total}' \
                    -H "apikey: $KEY" "$URL/auth/v1/health" || echo -1)
            echo "  дані: HTTP $CODE · вхід: ${TIME_S}s"
            [ "$CODE" = "200" ]
          }

          for i in 1 2 3; do
            echo "спроба $i:"
            if probe; then
              echo "✅ шар даних відповідає"
              exit 0
            fi
            echo "  тіло відповіді: $(head -c 200 /tmp/body.txt)"
            [ $i -lt 3 ] && sleep 20
          done

          echo ""
          echo "❌ ШАР ДАНИХ НЕ ВІДПОВІДАЄ ТРИ РАЗИ ПОСПІЛЬ."
          echo ""
          if grep -q 'PGRST002' /tmp/body.txt 2>/dev/null; then
            echo "🔴 Це PGRST002 — той самий випадок, що в ніч на 22.09."
            echo "   PostgREST не може зібрати довідник схеми: запит"
            echo "   'SELECT name FROM pg_timezone_names' не встигає у 8 секунд"
            echo "   стелі ролі authenticator."
            echo ""
            echo "   ЩО РОБИТИ (перевірено, спрацювало 22.09 о 21:42):"
            echo "   виконати в SQL Editor від імені postgres —"
            echo "     select count(*) from pg_timezone_names;"
            echo "   Це читання, воно нічого не змінює: прогріває дані часових"
            echo "   поясів, після чого наступна спроба PostgREST встигає."
            echo "   Не допомогло — Dashboard → Settings → General → Restart project."
          else
            echo "Причина інша — дивись тіло відповіді вище."
          fi
          exit 1

      # 🔴 22.09 — ПЕРЕВІРКА ПОДІЛУ СТАТЕЙ, і вона тут не випадково.
      # Список і тексти роз'їхались по двох файлах (`scripts/split_articles.py`),
      # і поділ робиться ЛИШЕ при складанні сайту. Тобто зламатись він може там,
      # куди жоден стенд не дістає: у репозиторії файл один і цілий, а на сайті
      # може лежати список без текстів — і жоден житель не прочитає жодної
      # статті далі анонсу. Мовчазно.
      # 🛑 Саме цю перевірку я НЕ МІГ зробити руками з пісочниці (вихід на Pages
      # звідти закритий), тому вона стоїть тут і робиться щочверть години.
      - name: Перевірити, що поділ статей доїхав на сайт
        shell: bash
        run: |
          SITE="https://castlelife.org"
          # 🔑 ЗАМІР, ЯКИЙ НЕ ЗРОБИТИ З ПІСОЧНИЦІ РОЗРОБКИ (вихід на Pages звідти
          # закритий): чи дає хостинг мітку версії файлу і чи розуміє умовний
          # запит. Від цього залежить, чи коштує фонове оновлення сотні кілобайт,
          # чи кількасот байт. Нічого не валить — це знання, а не вимога.
          ETAG=$(curl -sS -m 30 -D- -o /dev/null "$SITE/data/articles.json" | grep -i '^etag:' | tr -d '\r' | cut -d' ' -f2- || true)
          if [ -n "$ETAG" ]; then
            CODE304=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' -H "If-None-Match: $ETAG" "$SITE/data/articles.json" || echo 000)
            echo "мітка версії: є · повторний запит із нею → HTTP $CODE304 $([ "$CODE304" = 304 ] && echo '(фонове оновлення майже безкоштовне)' || echo '(304 не віддає — оновлення качає файл цілком)')"
          else
            echo "мітка версії: НЕМАЄ — фонове оновлення щоразу качає файл цілком"
          fi

          curl -sS -m 30 -o /tmp/list.json -w "список: HTTP %{http_code} · %{size_download} байт\n" "$SITE/data/articles.json"
          curl -sS -m 30 -o /tmp/texts.json -w "тексти: HTTP %{http_code} · %{size_download} байт\n" "$SITE/data/articles-text.json"

          python3 - <<'PY'
          import json, sys

          def прочитати(шлях, назва):
              try:
                  return json.load(open(шлях, encoding="utf-8"))
              except Exception as e:
                  print(f"❌ {назва} не розібрався: {e}")
                  sys.exit(1)

          список = прочитати("/tmp/list.json", "data/articles.json")
          тексти  = прочитати("/tmp/texts.json",  "data/articles-text.json")

          if not isinstance(список, list) or not список:
              print("❌ список статей порожній або не масив"); sys.exit(1)
          if not isinstance(тексти, dict):
              print("❌ файл текстів не словник"); sys.exit(1)

          # 1. Поділ справді стався: у списку не має лишитись повного тексту.
          з_текстом = sum(1 for a in список if "content" in a)
          # 2. І тексти справді є — інакше застосунок покаже самі анонси.
          покрито = sum(1 for a in список if str(a.get("id")) in тексти)

          print(f"статей на сайті: {len(список)} · у списку з `content`: {з_текстом}"
                f" · мають текст окремо: {покрито}")

          if з_текстом:
              print("❌ КРОК ПОДІЛУ НЕ ВІДПРАЦЮВАВ: у списку лишився `content`.")
              print("   Сайт качає зайві ~1.4 МБ на кожне відкриття.")
              print("   Дивись крок «Split articles» у deploy.yml.")
              sys.exit(1)

          # Дописи спільнот доливаються з бази вже в застосунку, тож 100% тут не
          # буває; але якщо текст загубився в більшості — це аварія.
          частка = покрито / len(список)
          if частка < 0.9:
              print(f"❌ ТЕКСТИ ЗАГУБИЛИСЬ: покрито лише {частка:.0%} статей.")
              print("   Житель побачить анонс замість статті. Перевір, чи доїхав")
              print("   data/articles-text.json і чи не зрізав його крок Trim artifact.")
              sys.exit(1)

          print(f"✅ поділ на місці: покрито {частка:.0%} статей")
          PY
