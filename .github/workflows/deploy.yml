name: Deploy CSTL NEWS to GitHub Pages

# Запускається при пуші в main, або вручну через GitHub UI
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Дозволи: читати код, писати на Pages, OIDC для deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Тільки один деплой одночасно. cancel-in-progress: true (05.07) — новіший деплой
# СКАСОВУЄ старіший у черзі, а не стає позаду. Інакше при пачці пушів підряд деплої
# стакались і GitHub Pages відхиляв застряглі («Deployment failed, try again later»).
# Тепер публікується лише найсвіжіший — заторів нема (для статичного сайту безпечно).
# 🔴 06.08 — `cancel-in-progress` ПЕРЕВЕДЕНО В `false`. Це виправлення, а не смак.
#
# Було `true` («публікується лише найсвіжіший»). На папері безпечно, на практиці
# дало окремий клас невдач: БУДЬ-ЯКИЙ другий пуш у `main` убивав публікацію, що
# вже йшла. А пушать сюди не лише люди — парсери новин і розкладу роблять це
# самі, за розкладом. Тобто автоматичний коміт міг обірвати деплой на середині,
# і в журналі це виглядало як `cancelled` без жодної причини.
# 06.08 так згоріло щонайменше три прогони (#3833, #3840, #3843), і кожен я
# спершу прийняв за черговий збій GitHub.
#
# 🔑 Для Pages черга краща за скасування: публікація або доходить до кінця, або
# чесно падає — але не зникає посеред дороги. Затримка на одну зайву публікацію
# коштує хвилину; обірваний деплой коштував сьогодні кількох годин пошуку.
# ⚠️ Аргумент «стакаються і Pages відхиляє застряглі» (через нього й ставили
# `true`) знято іншим виправленням: артефакт більше не 100 МБ, а 19, і черга
# розсмоктується за хвилини — див. крок `Trim artifact`.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # повна історія для git rev-list --count

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build bundle.js (склеюємо src/ у один файл)
        run: node build.js

      - name: Update deploy version stamp (лічильник версії + час)
        run: |
          DEPLOY_TIME=$(TZ='Europe/Kyiv' date '+%d.%m %H:%M')
          BUILD_NUM=$(git rev-list --count --no-merges HEAD)
          echo "Deploy version: v${BUILD_NUM} · ${DEPLOY_TIME}"
          sed -i "s|v[0-9]\+ · [0-9][0-9]\.[0-9][0-9] [0-9][0-9]:[0-9][0-9]|v${BUILD_NUM} · ${DEPLOY_TIME}|" index.html
          echo "--- Показати оновлений рядок у index.html ---"
          grep "deploy-stamp" index.html || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # ⚠️ 06.08 — У КОРЕНІ МУСИТЬ ЛЕЖАТИ `CNAME` (`castlelife.org`). ПОВЕРНУТО.
      # Артефакт — це ВЕСЬ репозиторій (`path: .`), тобто він і є майбутній сайт.
      # При деплої через Actions власний домен береться з артефакту: поки `CNAME`
      # немає, кожна публікація віддає сайт БЕЗ домену, і `castlelife.org` до
      # нього не привʼязаний. Постійний стан має бути з файлом.
      #
      # ЧОМУ ЗНЯТО: 06.08 перевірка домену на боці GitHub («DNS Check in
      # Progress») зависла і заблокувала ВСІ публікації — вісім прогонів поспіль
      # упали на `deployment_queued`, включно з прогоном парсера, який коду не
      # торкався. Обхід: зняти домен у Settings → Pages і задеплоїти без нього,
      # щоб довести, що сама публікація робоча. Але файл `CNAME` повертав би
      # домен назад при кожному деплої і робив той обхід неможливим.
      #
      # ✅ ПОВЕРНУТО того ж дня, щойно деплой #3836 пройшов.
      # ⚠️ DNS-записи в порядку — перевірено 06.08: `castlelife.org` віддає
      # 185.199.108-111.153, тобто рівно адреси GitHub Pages. Проблема була не
      # в них і не в домені: домен лише МАСКУВАВ справжню причину — розмір
      # артефакту (див. крок `Trim artifact` вище). Поки він був 100 МБ,
      # публікація не встигала, а перевірка DNS не могла завершитись, бо для
      # неї теж потрібна успішна публікація. Зняття домену розірвало це коло і
      # показало справжній симптом (`deployment_in_progress` замість
      # `deployment_queued`).
      # 🛑 Не видаляти `CNAME` «як зайвий файл у корені» — сайт відвʼяжеться від
      # домену при першому ж деплої.
      # 🔴 06.08 — ОБРІЗАННЯ АРТЕФАКТА. Без цього деплой перестає проходити.
      #
      # Артефакт це `path: .`, тобто ВЕСЬ репозиторій — 100 МБ. Із них сайту
      # потрібно менше чверті, решта їде на сервер щоразу ні за що:
      #   tests/           39 МБ  — переважно тестові скріншоти `tools/_shots`
      #   node_modules/    27 МБ  — потрібні лише кроку збірки, який уже минув
      #   shots/            7 МБ
      #   CSTL NEWS VOVA/   3 МБ  — документація
      #
      # 🔑 ЧОМУ ЦЕ ЛАМАЛО ДЕПЛОЙ, А НЕ ПРОСТО СПОВІЛЬНЮВАЛО ЙОГО.
      # 06.08 публікації почали падати: спершу `deployment_queued` (черга не
      # рухалась), після зняття власного домену — `deployment_in_progress` усі
      # 10 хвилин поспіль і обрив. Тобто Pages чесно розпаковував архів і не
      # встигав. Підняти очікування НЕМОЖЛИВО: у `deploy-pages@v4` стеля 10
      # хвилин, більше значення воно мовчки зрізає до максимуму.
      # Отже єдиний важіль — розмір.
      #
      # ⚠️ Список ВИКЛЮЧЕНЬ явний, а не «лишаємо тільки потрібне»: другий підхід
      # тихо викинув би файл, про який ніхто не згадав. Додаєш теку, якої сайту
      # не треба, — дописуєш сюди рядок.
      # 🛑 Не чіпати `data/`, `images/`, `icons/`, `photos/`, `style/`,
      # `bundle.js`, `index.html`, `admin.html`, `sw.js`, `manifest.json` —
      # це і є сайт.
      - name: Trim artifact (прибрати те, що сайту не потрібне)
        run: |
          # ⚠️ 12.08 — додано `.agents` і `.claude`: там лежать скіли агента
          # (24 штуки, 4.1 МБ, 183 файли), і сайту вони не потрібні ЖОДНОЮ мірою.
          # Без цього рядка вони поїхали б у артефакт разом зі сторінкою — а саме
          # роздутий артефакт клав публікацію на 20 годин 06.08 (100 МБ проти
          # стелі розпакування Pages у 10 хвилин).
          rm -rf node_modules tests shots docs scripts supabase _session-log \
                 "CSTL NEWS VOVA" .github .agents .claude
          rm -f bundle.js.map
          # 🔴 07.08 — ІМʼЯ ЗМІННОЇ ТІЛЬКИ ЛАТИНИЦЕЮ. Тут стояло `РОЗМІР=…`, і
          # саме цей рядок поклав деплой на 20 годин: 24 прогони поспіль (#3839…
          # #3862) падали з `exit 127`, останній успішний був #3838 о 15:41 06.08.
          # Bash дозволяє в іменах змінних лише латиницю, цифри й `_`. Кирилицю
          # він за імʼя не приймає, тому весь рядок читає як КОМАНДУ і каже
          # `РОЗМІР=20: command not found` → крок падає → `Upload artifact` і
          # публікація пропускаються. Відтворено локально з контролем: те саме
          # присвоєння кирилицею дає 127, латиницею — 0.
          # ⚠️ Коментарі й текст повідомлень українською лишаються — вони не
          # виконуються. Правило вузьке: українською можна ВСЕ, крім імен змінних.
          SIZE_MB=$(du -sm . --exclude=.git | cut -f1)
          echo "Розмір того, що поїде на Pages: ${SIZE_MB} МБ"
          # 🔑 СТОРОЖ РОЗМІРУ. 06.08 деплой лежав чотири години саме тому, що
          # артефакт непомітно доріс до 100 МБ і Pages перестав встигати за свої
          # 10 хвилин. Нічого не попереджало — просто одного дня перестало
          # працювати. Тепер зростання буде видно В ЖУРНАЛІ ЗБІРКИ заздалегідь.
          # ⚠️ Це попередження, а не помилка: валити деплой через розмір означало б
          # міняти одну раптову зупинку на іншу. Поріг 40 МБ — удвічі більше за
          # теперішні 19, тобто спрацює задовго до справжньої межі.
          if [ "$SIZE_MB" -gt 40 ]; then
            echo "::warning::Артефакт ${SIZE_MB} МБ — росте. При ~100 МБ Pages перестає встигати за 10 хв (це вже ламало деплой 06.08). Перевір список виключень у кроці Trim artifact."
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        # ⚠️ 06.08 — `timeout` ТУТ НЕ СТАВИТИ. Пробував 30 хвилин, і дія
        # відповіла у власному логу:
        #   «timeout value is greater than the allowed maximum
        #    - timeout set to the maximum of 600000 milliseconds»
        # Стеля 10 хвилин жорстка. Якщо публікація не вкладається — лікувати
        # треба РОЗМІР артефакту (крок `Trim artifact` вище), а не очікування.
