# ============================================================================
# ШІ-АГЕНТ СПІЛЬНОТИ «ІСТОРІЯ ГРОМАДИ» — пише пости у стрічку як ЧЕРНЕТКИ
# ============================================================================
# Рішення Вови 20.08: агент НЕ публікує сам. Він кладе чернетку в стрічку, і
# Вова бачить її з позначкою «ЧЕРНЕТКА · її бачиш лише ти» та кнопкою
# «Опублікувати». Читач до цього моменту тексту не бачить — так каже політика
# читання бази, а не фільтр у клієнті.
#
# 📅 3 пости на тиждень: вт, чт, сб о 07:40 UTC = 10:40 за Києвом. Дні НАВМИСНО не
# збігаються з OLYKA CASTLE (пн/ср/пт/нд) — інакше в стрічці два наші пости поспіль. Один пост за прогін (`per_run: 1` у місії) — щоб черга з плану
# витрачалась рівно, а не вилітала пачкою.
# ⚠️ Якщо тем у плані немає — агент нічого не робить і каже про це в журналі.
# Це нормальний стан, а не збій: план наповнюють люди.
#
# 💸 Витрати пишуться в `data/ai_spend.json` (той самий лічильник, що бачить
# адмінка) з РЕАЛЬНОЮ ціною Opus 5 — 20.08 лічильник навчили розрізняти моделі,
# доти він рахував усе за Sonnet і занизив би суму вдвічі.
name: Історія Громади — агент спільноти

on:
  schedule:
    - cron: '40 7 * * 2,4,6'

  # 🔴 28.08 — ПИСАР ІДЕ СЛІДОМ ЗА ЗБИРАЧЕМ, А НЕ ЧЕКАЄ ВІВТІРКА.
  # 📐 Заміряно того дня: збирач наповнив план о 15:20, а Вова тиснув Run workflow
  # о 14:45 — на 35 хвилин РАНІШЕ. У журналі чесно: «тем у плані не було». Тобто
  # крок 2 не зламався, він просто відпрацював по порожньому — і між двома
  # кроками конвеєра стояла людина з кнопкою і секундоміром.
  # 🛑 Розклад цієї діри не закриває: 28.08 заміряно, що GitHub кидає крони цього
  # репозиторію (`cms-sync` мовчав 16+ годин при «кожні 15 хвилин»). Чекати
  # вівтірка означало б чекати «колись».
  #
  # 🔑 Тому будить ПОДІЯ, і саме та, що означає «зʼявились нові теми»: зміна файлу
  # плану. Не «на кожен push» — інакше писар прокидався б на кожен коміт коду.
  # ⚠️ Гроші під контролем ще до цього тригера, і саме тому він безпечний:
  # `per_run: 1`, `day_budget_usd: 0.2`, `month_budget_usd: 0.6` у місії, а стік
  # пише `status = draft` — читач нічого не бачить, доки Вова не схвалить.
  # 🔑 Файл самого воркфлову теж у списку: правку проводки має одразу перевіряти
  # прогін, а не наступний вівторок.
  # 🛑 Відлуння немає: писар комітить `data/olyka_agent_state.json` і
  # `data/ai_spend.json` — жодного з цих шляхів у списку нижче немає.
  push:
    branches: [main]
    paths:
      - 'editor/plans/istoriya_hromady.json'
      - '.github/workflows/istoriya-agent.yml'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Тільки показати текст, нічого не зберігати'
        type: boolean
        default: false

# Два прогони одночасно писали б у той самий файл памʼяті `data/olyka_agent_state.json`
# і могли б видати одну тему двічі. Файл памʼяті СПІЛЬНИЙ з OLYKA CASTLE — навмисно:
# так та сама тема не піде двічі у дві різні спільноти.
concurrency:
  group: istoriya-agent
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # памʼять агента комітиться назад у репозиторій
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Залежностей немає навмисно: і Anthropic, і Supabase викликаються через
      # стандартний `urllib` — той самий підхід, що в решті агентів проєкту.
      # Один крок менше, який може впасти.
      - name: Прогін агента
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m editor.run --mission istoriya_hromady --dry-run
          else
            python -m editor.run --mission istoriya_hromady
          fi

      # Памʼять («які теми вже написані») має пережити прогін, інакше наступного
      # разу агент напише той самий пост удруге.
      - name: Зберегти памʼять агента
        if: ${{ inputs.dry_run != true }}
        run: |
          set -euo pipefail
          git config user.name  "CSTL bot"
          git config user.email "bot@castlelife.org"
          git add data/olyka_agent_state.json data/ai_spend.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Змін немає — тем у плані не було."
          else
            git commit -m "auto(olyka-agent): памʼять і витрати після прогону"
            git push
          fi
