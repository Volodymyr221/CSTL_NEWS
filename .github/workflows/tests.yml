name: Стенди — перевірка поведінки

# 🔴 ЗАВЕДЕНО 13.08.2026. До цього в проєкті було 71 стенд, і ЖОДЕН із них не
# запускався автоматично — тільки руками, коли хтось згадає. Тобто захист діяв
# лише тоді, коли про нього пам'ятали. Знайдено при підготовці репозиторію до
# зовнішнього перегляду.
#
# ⚠️ Стенди піднімають Chromium і справжній застосунок, тому прогін довгий
# (кілька хвилин). Це прийнятно: він не блокує деплой, а лише позначає PR.
#
# 🛑 НЕ ставити цей workflow у ланцюг деплою. Деплой має лишатись швидким і
# незалежним: якщо стенд упаде через часозалежність (див. `weather-day` нижче),
# сайт однаково має публікуватись.

on:
  pull_request:
    branches: [main]
    # Документаційні зміни стенди не зачіпають — не ганяємо Chromium даремно.
    paths:
      - 'src/**'
      - 'style/**'
      - 'tests/**'
      - 'index.html'
      - 'sw.js'
      - 'build.js'
      - 'package.json'
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stands:
    runs-on: ubuntu-latest
    # 🔴 02.09 — 25 → 45. ЦЕЙ СТОРОЖ НЕ ПРОХОДИВ УЖЕ КІЛЬКА ТИЖНІВ, І ЦЬОГО НІХТО
    # НЕ БАЧИВ, бо GitHub малює обрив по таймауту як «cancelled», а не як «failure».
    # 📐 Заміряно по історії `tests.yml`: з останніх 30 прогонів (№135-№164) 29
    # завершились «cancelled», і кожен рівно на 25:1x-25:2x — тобто впирались у
    # стелю, а не в червоний стенд. Один-єдиний «failure» (№150) був справжнім.
    # 🛑 Тобто головна перевірка проєкту була ДЕКОРАТИВНОЮ: PR-и зливались із
    # позначкою, яка нічого не перевірила до кінця. Прогін №164 обірвався на
    # `tab-return-repaint` — це ~95% списку, далі лишалось десяток стендів.
    # ⚠️ Стеля не «на око»: локально повна суїта йде ~13 хв, на раннері ~26+ хв
    # (браузерні стенди вдвічі повільніші). 45 хв дають запас, а не впритул.
    # 🔑 Справжнє лікування — ганяти стенди паралельно, але це окрема робота;
    # спершу сторож має ДОБІГАТИ, інакше його зелений колір нічого не означає.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Залежності
        run: npm install

      # Стенди шукають браузер самі (`chromiumPath()` у tests/_lib.mjs):
      # спершу CHROMIUM_PATH, далі стандартна тека Playwright. Ставимо саме
      # chromium, без решти браузерів — вони не потрібні.
      - name: Chromium
        run: npx playwright install --with-deps chromium

      - name: Збірка
        run: node build.js

      # Python-стенди парсерів. Вони не потребують браузера і швидкі, тому
      # стоять ПЕРЕД браузерними: якщо зламано логіку парсера, дізнаємось за
      # секунди, а не за п'ять хвилин.
      - name: Python-стенди
        run: |
          python3 -m pip install --quiet beautifulsoup4
          python3 scripts/test_fulltext.py
          python3 scripts/test_rls_snapshot.py
          python3 scripts/test_retention.py
          python3 scripts/test_dedup.py
          python3 scripts/test_rich_html.py
          python3 scripts/test_categories.py
          python3 scripts/test_mixed_layout.py
          # 🔴 31.08 — ДОПИСАНО ПІСЛЯ ЗНАХІДКИ: стенд існував із 27.08 (42 перевірки
          # про розмітку статті) і в CI НЕ ЗАПУСКАВСЯ ЖОДНОГО РАЗУ. У цьому проєкті
          # вже був випадок, коли документація посилалась на сторожів, яких не було
          # в git, і «захист» був уявним — тут те саме, тільки файл на місці.
          python3 scripts/test_markup_polish.py
          # Ці двоє стережуть РОЗДІЛЕННЯ КОНТЕНТУ між спільнотами (53+53 перевірки)
          # і теж не запускались у CI. Саме вони ловлять витік історичних тем у
          # бренд і навпаки — тобто те, що читають жителі.
          python3 scripts/test_history_routing.py
          python3 scripts/test_editor_pools.py
          # ℹ️ `test_vopas_access.py` живе у власному воркфлові `test-vopas.yml`,
          # а `test_worker.py` вимагає адресу проксі аргументом — це ручний
          # інструмент, не сторож. Обидва тут навмисно відсутні.

      - name: Сторож документації
        run: node tests/docs-refs.mjs

      - name: Браузерні стенди
        run: npm test
