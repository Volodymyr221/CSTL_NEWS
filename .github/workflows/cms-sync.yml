name: CMS Sync — статті кабінету у стрічку

# Бере готові статті кабінету редактора (cms_articles status='ready') із Supabase
# і викладає у data/articles.json → деплой. Архітектура «Supabase редагує — Git публікує».
on:
  schedule:
    # 🔴 28.08 — БУЛО `*/5`, І ЦЕ БУЛА ВИГАДКА, А НЕ РОЗКЛАД.
    #
    # 📐 Заміряно через GitHub API: ми просили **288 запусків на добу**, а за
    # останню добу воркфлов запустився **ТРИЧІ** — 27.08 о 05:07 і 16:27,
    # 28.08 о 01:03. Тобто обіцянка «стаття з кабінету зʼявиться за 5 хвилин»
    # насправді означала проміжки по 8-11 годин.
    #
    # 📉 І це не разовий збій, а ПОГІРШЕННЯ: 18.08 той самий розклад заміряли по
    # 30 прогонах — виходило приблизно раз на 33 хвилини. За десять днів упало до
    # трьох разів на добу.
    #
    # 🔑 `schedule` у GitHub Actions — «за можливості», і в їхній документації
    # прямо сказано: чим частіший розклад, тим імовірніше його відкинуть. Ми
    # були найгучнішим споживачем черги цього репозиторію — і 27.08 разом із
    # нами замовк `rss-parser` (13 годин без жодного планового запуску).
    # ⚠️ Причинність ззовні НЕ доведена — її видно лише GitHub. Але зниження не
    # коштує нічого: 5-хвилинного темпу ми й так не отримували.
    #
    # 🛑 Правильне рішення не тут: опитувати чергу — взагалі не той інструмент.
    # Публікація має ШТОВХАТИ синк (кабінет → Edge Function → workflow), і тоді
    # стаття зʼявляється за секунди. Цей крон лишається СТРАХОВКОЮ.
    #
    # 🔴 28.08, ВЕЧІР — ХВИЛИНИ РОЗВЕДЕНО, БО МИ ЗБІГАЛИСЬ САМІ З СОБОЮ.
    # 📐 Заміряно по всіх воркфловах репозиторію: `rss-parser` стоїть на `0,30`,
    # `vopas-parser` на `*/30` (теж :00 і :30), `ai-news-agent` на `:15`. Тобто
    # `*/15` збігався з кимось на ТРЬОХ слотах із чотирьох. GitHub ставить такі
    # запити в одну чергу репозиторію, і зайвий тисняви ми створювали собі самі.
    # ⚠️ Це ПОМʼЯКШЕННЯ, не ліки: доставку розкладу видно лише GitHub, і обіцяти
    # поліпшення я не можу. Але коштує воно нуль, а колізії прибирає всі.
    # 🛑 Ліки — токен `GITHUB_DISPATCH_TOKEN` (див. `scripts/README_publish_now.md`).
    - cron: '7,22,37,52 * * * *'   # кожні 15 хв, але не в чужі хвилини
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: "cms-sync"
  # false (P3, 12.07): раніше true СКАСОВУВАВ синк посеред роботи — якщо він уже
  # позначив рядок published у Supabase, але не встиг закомітити/запушити стрічку,
  # виникав перманентний розсинхрон «в адмінці published, на сайті нема». Тепер
  # запуски чекають один одного (синк ідемпотентний і швидкий — черга безпечна).
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0   # повна історія — потрібна для rebase перед пушем

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'

      - name: Sync cms_articles → articles.json
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/sync_cms.py

      - name: Commit if changed
        id: commit
        run: |
          git config user.name  "CSTL CMS Bot"
          git config user.email "cms@cstl-news"
          git add data/articles.json data/events.json
          # 🔑 Окремо дивимось, чи змінились САМЕ події. Прапорець `changed` для
          # цього не годиться: він піднімається і на звичайних новинах, які
          # приїжджають щогодини, — і агент спільноти палив би кишеню намарно.
          if git diff --staged --name-only | grep -qx 'data/events.json'; then
            echo "events=true" >> "$GITHUB_OUTPUT"
          else
            echo "events=false" >> "$GITHUB_OUTPUT"
          fi
          if git diff --staged --quiet; then
            echo "Нових статей/подій кабінету немає — деплой не потрібен"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "cms: статті кабінету у стрічку $(date -u +'%d.%m %H:%M UTC')"
            # Пуш із ре-базою (main міг піти вперед) — уникаємо «fetch first».
            pushed=false
            for i in 1 2 3 4 5; do
              if git push origin main; then pushed=true; break; fi
              echo "Пуш $i відхилено — rebase і повтор…"
              git fetch origin main
              git rebase origin/main || { echo "Конфлікт rebase — стоп"; exit 1; }
              sleep 2
            done
            [ "$pushed" = true ] || { echo "Пуш не вдався після 5 спроб"; exit 1; }
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # 🔴 20.08 — ПІДТВЕРДЖЕННЯ ОКРЕМИМ ТАКТОМ, І ЛИШЕ ПІСЛЯ ВДАЛОГО ПУША.
      # Раніше `sync_cms.py` позначав рядки `published` ще під час збору — тобто
      # ДО того, як стало відомо, чи стаття пройде ліміти і чи доїде коміт у main.
      # Заміряно 20.08: 6 статей мали в базі `published` + `git_id`, а в
      # `data/articles.json` не було жодної. База рапортувала про публікацію,
      # якої не сталося.
      # 🔑 Тепер позначку ставить той, хто бачив успіх. Не доїхало — рядки
      # лишаються `ready` і поїдуть наступним прогоном самі.
      - name: Confirm published (лише після успішного пуша)
        if: steps.commit.outputs.changed == 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/sync_cms.py --confirm

      - name: Trigger deploy
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 🔴 20.08 — СВЯТО З КАБІНЕТУ → ЧЕРНЕТКА ПОСТА У СТРІЧЦІ.
      #
      # Вова опублікував свято і не знайшов його ніде. Причина була не в синку:
      # свята чесно доїжджали в `data/events.json`, але цей файл у застосунку не
      # показується НІДЕ з 04.08, коли секцію «Події» прибрали за його ж рішенням
      # («вести з неї не було куди»). Тобто кабінет два тижні публікував у нікуди.
      #
      # 🔑 Механізм доставки вже був — черга агента спільноти вміє брати теми з
      # `events.json` (PR #966). Бракувало саме ШВИДКОСТІ: пост чекав би розкладу
      # агента (пн/ср/пт/нд), тобто до двох діб після публікації.
      # ⚠️ Тригеримо ЛИШЕ на зміну подій, не на кожен синк новин: інакше агент
      # прокидався б щогодини і випалював добову кишеню ні за що.
      - name: Свято/подія → чернетка поста у Стрічці
        if: steps.commit.outputs.events == 'true'
        run: gh workflow run olyka-agent.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
