# Координати сіл громади — ЗА КНОПКОЮ, з обовʼязковим людським переглядом.
#
# 🔴 НАВІЩО ЦЕЙ ВОРКФЛОВ. Файл `data/settlements-geo.json` живить головну ланку
# капсули автобуса: «з якої НАШОЇ зупинки людина може сісти». Без нього
# застосунок упізнає за координатами лише Олику, і житель Метельного отримує
# рейси з Олики — за 7 км від себе.
#
# Згенерувати файл можна було лише на комп'ютері з відкритою мережею: у
# середовищі розробки Nominatim заблокований проксі. Тут мережа є.
#
# 🛑 І ГОЛОВНЕ — ЦЕ НЕ ОБХІД ПРАВИЛА, ЗАПИСАНОГО В САМОМУ СКРИПТІ:
#   «Скрипт НЕ запускається автоматично і нікуди не комітить сам. Це свідомо:
#    координати мають подивитись очима, а не приймати наосліп.»
# Розкладу тут немає — тільки ручний запуск. У `main` нічого не пишеться: воркфлов
# відкриває PR, у якому видно 18 рядків «назва → широта, довгота».
# ➡️ Причому «подивитись очима» стає СИЛЬНІШИМ, ніж було: біжучий рядок у
# терміналі людина проглядає, а числа в PR перевіряє ще й стенд
# `tests/settlements-geo.mjs` — він ловить те, чого око не бачить (тезку з іншої
# області виглядає як звичайне число).
name: Координати сіл — згенерувати і відкрити PR

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  geocode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Скрипт сам вирішує, чи вдалося: якщо хоч один пункт не знайдено, він
      # НІЧОГО не пише і виходить з помилкою. Половина списку гірша за його
      # відсутність — застосунок вважав би пропущені села «вже зʼясованими».
      - name: Згенерувати координати
        run: node scripts/geocode-settlements.mjs

      # 🔑 Числа перевіряє геометрія, а не око: усі села на місці, жодне не далі
      # 25 км від Олики (тезка з іншої області), два села не в одній точці.
      - name: Перевірити числа стендом
        run: node tests/settlements-geo.mjs

      - name: Відкрити PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name  "CSTL Geo Bot"
          git config user.email "geo@cstl-news"
          if git diff --quiet -- data/settlements-geo.json; then
            echo "Координати не змінились — PR не потрібен"; exit 0
          fi
          ГІЛКА="geo/settlements-$(date -u +%Y%m%d-%H%M)"
          git checkout -b "$ГІЛКА"
          git add data/settlements-geo.json
          git commit -m "data: координати сіл громади (OpenStreetMap)"
          git push -u origin "$ГІЛКА"
          {
            echo "Згенеровано воркфловом «Координати сіл» з OpenStreetMap."
            echo
            echo "**Що перевірити очима:** кожен рядок — \`село → широта, довгота\`."
            echo "Будь-яке значення можна вставити в карти й переконатись, що це саме наше село."
            echo
            echo "Числа вже перевірив стенд \`tests/settlements-geo.mjs\`:"
            echo "- усі села громади на місці (половина списку гірша за його відсутність:"
            echo "  застосунок вважав би пропущені села «вже зʼясованими» і не пробував би сам);"
            echo "- жодне не далі 25 км від Олики — це ловить тезку з іншої області"
            echo "  («Ставок», «Котів», «Дерно» є не лише на Волині, і таке число виглядає нормально);"
            echo "- два різні села не стоять в одній точці."
            echo
            echo "**Навіщо файл:** без нього застосунок упізнає за координатами лише Олику,"
            echo "і житель Метельного отримує рейси з Олики — за 7 км від себе."
          } > /tmp/pr-body.md
          gh pr create --base main --head "$ГІЛКА" \
            --title "data: координати сіл громади" \
            --body-file /tmp/pr-body.md
