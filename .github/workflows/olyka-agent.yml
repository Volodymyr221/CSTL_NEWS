# ============================================================================
# ШІ-АГЕНТ СПІЛЬНОТИ OLYKA CASTLE — пише пости у стрічку як ЧЕРНЕТКИ
# ============================================================================
# Рішення Вови 20.08: агент НЕ публікує сам. Він кладе чернетку в стрічку, і
# Вова бачить її з позначкою «ЧЕРНЕТКА · її бачиш лише ти» та кнопкою
# «Опублікувати». Читач до цього моменту тексту не бачить — так каже політика
# читання бази, а не фільтр у клієнті.
#
# 📅 3-4 пости на тиждень (вибір Вови): пн, ср, пт, нд о 07:10 UTC = 10:10 за
# Києвом. Один пост за прогін (`per_run: 1` у місії) — щоб черга з плану
# витрачалась рівно, а не вилітала пачкою.
# ⚠️ Якщо тем у плані немає — агент нічого не робить і каже про це в журналі.
# Це нормальний стан, а не збій: план наповнюють люди.
#
# 💸 Витрати пишуться в `data/ai_spend.json` (той самий лічильник, що бачить
# адмінка) з РЕАЛЬНОЮ ціною Opus 5 — 20.08 лічильник навчили розрізняти моделі,
# доти він рахував усе за Sonnet і занизив би суму вдвічі.
name: Olyka Castle — агент спільноти

on:
  schedule:
    - cron: '10 7 * * 1,3,5,0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Тільки показати текст, нічого не зберігати'
        type: boolean
        default: false

# 02.09 — спільна черга ВСІХ, хто пише в `data/ai_spend.json` (гаманець один файл;
# розгорнуте пояснення — в `ai-news-agent.yml`). Заразом закриває й стару причину:
# памʼять `data/olyka_agent_state.json` СПІЛЬНА в олицького та історичного агентів,
# тож два прогони поруч могли б видати одну тему двічі.
concurrency:
  group: ai-spend-writers
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # памʼять агента комітиться назад у репозиторій
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # повна історія — без неї `git rebase origin/main` нижче не має на що спертись

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Залежностей немає навмисно: і Anthropic, і Supabase викликаються через
      # стандартний `urllib` — той самий підхід, що в решті агентів проєкту.
      # Один крок менше, який може впасти.
      - name: Прогін агента
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m editor.run --mission olyka_castle --dry-run
          else
            python -m editor.run --mission olyka_castle
          fi

      # Памʼять («які теми вже написані») має пережити прогін, інакше наступного
      # разу агент напише той самий пост удруге.
      - name: Зберегти памʼять агента
        if: ${{ inputs.dry_run != true }}
        run: |
          set -euo pipefail
          git config user.name  "CSTL bot"
          git config user.email "bot@castlelife.org"
          git add data/olyka_agent_state.json data/ai_spend.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Змін немає — тем у плані не було."
          else
            git commit -m "auto(olyka-agent): памʼять і витрати після прогону"
            # 🔴 02.09 — ПУШ ІЗ РЕ-БАЗОЮ, А НЕ ГОЛИЙ `git push`.
            # Раніше тут стояв один `git push` під `set -euo pipefail`. Поки агент
            # писав пост (десятки секунд у моделі), `main` міг піти вперед — і пуш
            # відлітав з «fetch first». Крок падав, АЛЕ пост уже лежав у Supabase:
            # губилась лише памʼять «цю тему вже написано». Наступний прогін брав
            # ТУ САМУ тему вдруге — і платив за неї вдруге.
            # 🔑 Тому: 5 спроб з ре-базою, і чесний `exit 1`, якщо не вийшло —
            # мовчазний зелений прогін тут гірший за червоний.
            pushed=false
            for i in 1 2 3 4 5; do
              if git push origin HEAD:main; then pushed=true; break; fi
              echo "Пуш $i відхилено (main пішов уперед) — rebase і повтор…"
              git fetch origin main
              git rebase origin/main || { echo "Конфлікт rebase — стоп"; exit 1; }
              sleep 2
            done
            [ "$pushed" = true ] || { echo "Пуш не вдався після 5 спроб"; exit 1; }
          fi
