<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#4A121C">
  <meta name="description" content="CSTL LIFE — локальна медіа-платформа Олики та Волині">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CSTL LIFE">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>CSTL LIFE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Splash screen (заставка при завантаженні) -->
  <div id="splash">
    <img src="logo.png" class="splash-icon" alt="Olyka Castle">
    <div class="splash-logo">CSTL LIFE</div>
    <div class="splash-sub">Олика · Волинь · Україна</div>
  </div>

  <!-- Шапка сайту -->
  <header class="app-header">
    <!-- Ліва група: бургер + лого впритул (рішення Роми 08.07). Погоду з шапки
         прибрано (лишилась блоком на Громаді); лічильник версії — по центру шапки. -->
    <!-- Розклад шапки (рішення Вови 16.07): лого вліво; справа — закладка, бургер
         у самий правий край. Іконка кабінету — біля привітання на Громаді. -->
    <div class="header-left">
      <div class="header-logo">CSTL <span>LIFE</span></div>
    </div>
    <div class="deploy-stamp">v1 · 01.01 00:00</div>
    <div class="header-right">
      <button class="saved-hub-btn" id="saved-hub-btn" type="button" aria-label="Збережені">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      </button>
      <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-label="Меню" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <!-- Бічне меню (сайдбар). Наповнення й логіка — src/core/sidebar.js -->
  <div class="sidebar-overlay" id="sidebar-overlay" hidden></div>
  <aside class="sidebar" id="sidebar" aria-hidden="true">
    <!-- 🔴 10.08 (друга редакція, зауваження Вови) — У ШАПЦІ ЛИШЕ НАЗВА І ✕.
         Було: іконка замку + лічильник версії під назвою. Обидва прибрано на
         пряме прохання: замок дублює центральну кнопку таб-бару, а лічильник —
         той, що вже стоїть по центру шапки застосунку.
         ⚠️ Шапка меню СТАТИЧНА (не їде при прокрутці) — це `flex-shrink: 0` у
         `style/sidebar.css`, а прокрутка живе на `.sidebar-nav`, не на панелі. -->
    <div class="sidebar-head">
      <div class="sidebar-logo">CSTL <span>LIFE</span></div>
      <!-- Порожня НАВМИСНО: вектор ✕ кладе `initSidebar()` з `ICONS.close` —
           той самий значок, що в усіх модалках. Копіювати сюди `<svg>` означало б
           завести другу копію іконки, яка колись розійдеться з першою. -->
      <button class="sidebar-close" id="sidebar-close" type="button" aria-label="Закрити"></button>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <!-- 🔴 10.08 (замовлення Вови зі знімка) — ПІДВАЛ СТАТИЧНИЙ, ЯК І ШАПКА.
         Був усередині `.sidebar-nav`, тобто всередині скролера, і їхав разом зі
         списком; на довгому меню «Політика і приватність» ховалась під ним.
         Тепер це БРАТ шапки і списку: прокручується рівно середина.
         Вміст кладе `renderNav()` — розмітка тут порожня навмисно, щоб не
         завести другу копію блока соцмереж. -->
    <div class="sidebar-foot" id="sidebar-foot"></div>
  </aside>

  <!-- Основний контент -->
  <main class="app-main" data-tab="community">

    <!-- Вкладка: Громада (головна) -->
    <div id="page-community" class="page active">
      <div id="cm-content" class="cm-content"></div>
    </div>

    <!-- Вкладка: «Стрічка» — сторінки-канали громади (мінісоцмережа).
         Кружечки-канали (stories) + вертикальна стрічка постів. Рендерить feed.js. -->
    <div id="page-shotam" class="page" style="display:none">
      <div class="fd-topbar">
        <div id="feed-circles" class="fd-circles-wrap"></div>
      </div>
      <div id="feed-list" class="fd-list"></div>
    </div>

    <!-- Вкладка: Автобуси -->
    <div id="page-buses" class="page" style="display:none">
      <div id="buses-content"></div>
    </div>

    <!-- Вкладка: Світло. Прихована з tab-bar 16.05.2026 (наразі не актуально).
         Залишена в DOM щоб switchTab('power') не падав, якщо викликати програмно.
         Щоб повернути в навігацію — розкоментуй кнопку в tab-bar нижче. -->
    <div id="page-power" class="page" style="display:none">
      <div id="power-content"></div>
    </div>

    <!-- Вкладка: Дошка громади -->
    <div id="page-board" class="page" style="display:none">
      <div class="board-bg" aria-hidden="true"></div>
      <div id="board-content" class="board-content"></div>
    </div>

    <!-- Вкладка: Чати (хаб спілкування) -->
    <div id="page-chats" class="page" style="display:none">
      <div class="chats-hub">
        <h1 class="chats-hub-title">Питання</h1>

        <!-- V2: «Повідомлення» (приватний чат) і «Групи» приховані до версії 2.
             Код і хендлери (data-chats у app.js, messages-ui.js) лишаються робочими —
             приховано лише кнопки через display:none (не видалено). -->
        <button class="chats-entry" type="button" data-chats="messages" style="display:none">
          <span class="chats-entry-ic">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          </span>
          <span class="chats-entry-body">
            <span class="chats-entry-name">Повідомлення</span>
            <span class="chats-entry-sub">Приватні листування 1-на-1</span>
          </span>
          <span class="chats-entry-arrow">›</span>
        </button>

        <button class="chats-entry" type="button" data-chats="groups" style="display:none">
          <span class="chats-entry-ic">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9.5" cy="7" r="3.5"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.5a3.5 3.5 0 0 1 0 6.8"/></svg>
          </span>
          <span class="chats-entry-body">
            <span class="chats-entry-name">Групи</span>
            <span class="chats-entry-sub">Приватні чати спільнот і сіл</span>
          </span>
          <span class="chats-entry-arrow">›</span>
        </button>

        <button class="chats-entry" type="button" data-chats="discussions">
          <span class="chats-entry-ic">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l16-5v12L3 14z"/><path d="M11.5 16.5a2.5 2.5 0 0 1-4.7-.9"/></svg>
          </span>
          <span class="chats-entry-body">
            <span class="chats-entry-name">Питання</span>
            <span class="chats-entry-sub">Питання і відповіді громади</span>
          </span>
          <span class="chats-entry-arrow">›</span>
        </button>
      </div>
    </div>

    <!-- Вкладка: Питання (Q&A) — СПРАВЖНЯ сторінка (не overlay), тому таб-бар завжди
         видимий і навігація нативна. Рендериться board.js у #disc-content (той самий
         рушій карток/реакцій/коментарів/realtime). Хаб #page-chats вище — осиротілий,
         лишений схованим під V2 (Повідомлення/Групи). -->
    <div id="page-discussions" class="page" style="display:none">
      <div id="disc-content" class="board-content"></div>
    </div>

  </main>

  <!-- Модальне вікно статті (відкривається при натисканні на новину) -->
  <div id="article-modal" class="article-modal" onclick="if(event.target===this)closeArticleModal()">
    <div class="article-modal-inner">
      <div class="modal-sticky-header">
        <div class="modal-handle"></div>
        <div class="modal-icon-group">
          <button class="modal-icon-btn" id="modal-share-btn" type="button" aria-label="Поділитись"></button>
          <button class="modal-icon-btn" id="modal-remind-btn" type="button" aria-label="Нагадування" hidden></button>
          <button class="modal-icon-btn" id="modal-save-btn" type="button" aria-label="Зберегти" hidden></button>
        </div>
        <!-- 08.08: ✕ векторний, як у примітиві core/modal.js. Тут контур вписано
             в розмітку, а не взято з ICONS: ця кнопка статична в index.html і
             жоден JS її не малює. Path той самий (Tabler `x`) — при зміні іконки
             в реєстрі оновити й тут. -->
        <button class="modal-close-btn" onclick="closeArticleModal()" aria-label="Закрити"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="cat-ico"><path d="M18 6l-12 12"/><path d="M6 6l12 12"/></svg></button>
        <div class="modal-meta-tags" id="modalMetaTags"></div>
      </div>
      <div id="article-modal-content" class="article-modal-content"></div>
    </div>
  </div>

  <!-- Нижня навігація (tab bar) — порядок (Вова 22.07): зліва інформація, справа сервіси.
       Стрічка · Питання · [Громада] · Дошка · Автобуси. -->
  <nav class="tab-bar">
    <button class="tab-item" data-tab="shotam" onclick="switchTab('shotam')">
      <!-- 🔴 10.08 — ІКОНКА ЗМІНЕНА (зауваження Вови: «в таббарі іконка стрічки
           схожа на іконку "новини" з бургер меню»). Претензія точна: тут стояв
           Tabler `news` — той самий малюнок, що `ICONS.newspaper`, яким підписані
           НОВИНИ. Два розділи мали фактично один знак.
           Перша спроба — стос карток; Вова її відхилив («іконка стрічки мені не
           подобається»). Стало: Tabler `list-details` — прев'ю зліва, текст
           справа, тобто рядок стрічки в мініатюрі (вибір Вови: «попробуємо Є3»).
           ⚠️ Бургер-меню бере іконки вкладок ЗВІДСИ (`tabIcon()` у sidebar.js),
           тож правити треба рівно тут — меню підхопить саме. -->
      <!-- 🔴 14.08 — ТРЕТЯ РЕДАКЦІЯ, макет Вови («варіант 1»): картка в рамці —
           прев'ю зліва, два рядки праворуч, один довгий рядок під ними.
           Історія, щоб не ходити по колу: Tabler `news` (збігався з «Новинами»
           в меню) → стос карток (відхилено) → Tabler `list-details` (два рядки
           без рамки) → тепер рамка. 🔑 Що дала саме рамка: `list-details`
           малював ДВА елементи списку, тобто знак читався як «список», а рамка
           робить його ОДНИМ дописом — публікацією, а не переліком. -->
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v10a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3z"/>
        <path d="M7.5 9.5a1 1 0 0 1 1 -1h1.8a1 1 0 0 1 1 1v1.8a1 1 0 0 1 -1 1h-1.8a1 1 0 0 1 -1 -1z"/>
        <path d="M13.8 9.2h3.2"/>
        <path d="M13.8 12.3h3.2"/>
        <path d="M7.5 16h9.5"/>
      </svg>
      <span class="tab-label">Стрічка</span>
    </button>
    <button class="tab-item" data-tab="discussions" onclick="switchTab('discussions')">
      <!-- 30.07: іконка в ОБГОРТЦІ — щоб крапка «є нове» стала їй на куток.
           Чому обгортка, а не absolute від `.tab-item`: там flex-колонка з міткою,
           і позиція «на око від центру» поїхала б від будь-якої зміни розкладки. -->
      <span class="tab-ico-wrap">
        <!-- 🔴 14.08, ЧЕТВЕРТА РЕДАКЦІЯ — ПЕРЕМАЛЬОВАНО ЗА СПЕЦИФІКАЦІЄЮ ВОВИ.
             Історія, щоб не ходити по колу:
               до 11.08 — бульбашка з рядками тексту (іконка ЧАТУ, зі старих «Обговорень»);
               11.08 ранок — бульбашка зі знаком питання всередині;
               11.08 — чисте коло зі знаком питання (Tabler `help-circle`);
               14.08 — дві бульбашки (концепція Вови), але малюнок ручний і сируватий;
               14.08 вечір — та сама КОНЦЕПЦІЯ, перемальована рахунком. ⚠️ Концепцію
               не міняти: «питання → відповідь», а не «чат» і не «help».
             📐 ПРОПОРЦІЇ ЗНЯТІ З МАКЕТА ВОВИ ВИМІРОМ, а не на око. Перша спроба
             посадила малу бульбашку ВНИЗ-праворуч (зсув центрів 7.4 × 5.5), і Вова
             сказав «бульбашки все одно не такої форми». Заміряно по макету: мала
             стоїть майже ЗБОКУ — зсув ≈ 6.6 × 3.0 при відношенні радіусів 0.60.
             ⚠️ ДРУГЕ УТОЧНЕННЯ ВОВИ: «форма горизонтально трішки ширша» — бульбашки
             мусять бути ЕЛІПСАМИ, а не колами. Чинні: `rx 7.5 / ry 7.08` (велика)
             і `rx 4.5 / ry 4.25` (мала), розтяг по горизонталі 1.06.
             ⚠️ ТРЕТЄ УТОЧНЕННЯ: «маленька, її не видно» — знак збільшено.
             📐 І тут вимір показав МЕЖУ, яку словами не видно: висота чорнила
             залежить ТІЛЬКИ від загального масштабу, а ширина — від масштабу ПОМНОЖЕНОГО
             на розтяг, і вона вже впиралась у стелю 22 (за нею `viewBox` ріже знак).
             Тобто «вища» і «ширша» в коробці 24×24 змагаються між собою: щоб підняти
             висоту, довелось віддати частину розтягу (1.10 → 1.06).
             🛑 Варіант ще більший (`rx` при розтягу 1.04) давав ширину 21.92 — знак
             ставав би за 0.16 одиниці від краю; відкинуто виміром, а не на око.
             🔑 Рахується це так: геометрія будується в КРУГОВОМУ просторі (там перетин
             двох кіл має точну формулу), а потім X-координати множаться на 1.10
             ЧИСЛАМИ — у дузі це просто різні `rx`/`ry`, ніякого `transform`.
             🛑 Знак питання НЕ розтягується: інакше «?» став би кривим. Розтяг
             торкається лише самих бульбашок і хвостів.
             Задня дуга обривається рівно в точках перетину, тому нахлест виглядає
             як перекриття без жодної заливки.
             🔴 ЗАЛИВКА ТУТ ЗАБОРОНЕНА: ці ж іконки бере бічне меню (`tabIcon()` у
             sidebar.js), а там фон сірий `--board-bg` — білий клапоть проступив би.
             🛑 І БЕЗ `transform`/`scale`: масштаб множить товщину лінії, і знак
             мовчки став би жирнішим за сусідні (попередня редакція трималась на
             `scale(1.08)` з компенсацією `stroke-width` — крихка конструкція).
             Тут числа фінальні, компенсувати нічого.
             📐 Заміряно: чорнило 19.4×16.1, центр рівно 12,12, площа 312 — у межах
             родини (Стрічка 288 · Автобуси 280 · Дошка 252). Сторож —
             `tests/tabbar-icons.mjs`. -->
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2.35 14.26A7.5 7.08 0 1 1 4.9 17.34L1.19 17.59Z"/>
          <path d="M16.79 11.05A4.5 4.25 0 0 1 21.75 17.07L22.81 19.25L20.35 18.65A4.5 4.25 0 0 1 13.78 17.3"/>
          <path d="M7.21 9.57a2.31 2.31 0 1 1 3.94 2.1c-0.75 0.68 -1.83 1.02 -1.83 2.37"/>
          <path d="M9.31 16.22v.01"/>
        </svg>
        <span class="tab-dot" data-tab-dot="discussions" hidden></span>
      </span>
      <span class="tab-label">Питання</span>
    </button>
    <button class="tab-item tab-item--home active" data-tab="community" onclick="switchTab('community')">
      <div class="tab-home-circle">
        <img src="icons/castle-icon.png" class="tab-castle-icon" alt="Громада">
      </div>
      <span class="tab-label tab-label--home">Громада</span>
    </button>
    <button class="tab-item" data-tab="board" onclick="switchTab('board')">
      <!-- 30.07: іконка в ОБГОРТЦІ — щоб крапка «є нове» стала їй на куток.
           Чому обгортка, а не absolute від `.tab-item`: там flex-колонка з міткою,
           і позиція «на око від центру» поїхала б від будь-якої зміни розкладки. -->
      <span class="tab-ico-wrap">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 5h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-12a2 2 0 0 0 -2 -2h-2"/>
          <path d="M9 3m0 2a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v0a2 2 0 0 1 -2 2h-2a2 2 0 0 1 -2 -2z"/>
          <path d="M9 12l.01 0"/>
          <path d="M13 12l2 0"/>
          <path d="M9 16l.01 0"/>
          <path d="M13 16l2 0"/>
        </svg>
        <span class="tab-dot" data-tab-dot="board" hidden></span>
      </span>
      <span class="tab-label">Дошка</span>
    </button>
    <button class="tab-item" data-tab="buses" onclick="switchTab('buses')">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 17a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/>
        <path d="M16 17a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/>
        <path d="M4 17h-2v-11a1 1 0 0 1 1 -1h14a5 7 0 0 1 5 7v5h-2m-4 0h-8"/>
        <path d="M16 5l1.5 7l4.5 0"/>
        <path d="M2 10l15 0"/>
        <path d="M7 5l0 5"/>
        <path d="M12 5l0 5"/>
      </svg>
      <span class="tab-label">Автобуси</span>
