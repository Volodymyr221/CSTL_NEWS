      <!-- 🔴 14.08, ЧЕТВЕРТА РЕДАКЦІЯ — ЗВІРЕНО З РЕФЕРЕНСОМ ВОВИ ВИМІРОМ.

           ⚠️ У брифі текст і картинка СУПЕРЕЧИЛИ одне одному: текст вимагав

      <!-- 🔴 15.08, ШОСТА РЕДАКЦІЯ — «ВАРІАНТ 4» З МАКЕТА ВОВИ (пряме замовлення:

           ⚠️ Моє заперечення, сказане Вові ДО роботи: сітка 2×2 у мобільних

           а не як «стрічка». Вова вибрав варіант 4 — виконано за його рішенням.

           📐 ГЕОМЕТРІЯ ПОРАХОВАНА, НЕ ПІДІБРАНА. Три числа задають усе:

               означало б звести видимий зазор у НУЛЬ — квадрати склеїлись би;
             • радіус кутів **2.05** = 29% сторони (з макета — кути помітно круглі).
           ➡️ Габарит 2×7.125 + 3.5 = **17.75**, площа **315**. Центр: 12 − 17.75/2
           = **3.125**, отже квадрати стоять на [3.125…10.25] і [13.75…20.875] по

           нову іконку — не додавай stroke до цілі, інакше знак вийде меншим за
           сусідні рівно на товщину лінії.
           🔑 Площа 315 зведена з «Питаннями» (335) і вища за Дошку (252): сусідні
           знаки мусять важити однаково. Розкид родини 1.33× при стелі сторожа 1.6×.

           🛑 БЕЗ заливки: ці ж іконки бере бічне меню (`tabIcon()` у sidebar.js),
           а там фон сірий `--board-bg` — білий клапоть проступив би.
